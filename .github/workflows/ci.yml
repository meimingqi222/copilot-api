name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run linter
        run: bun run lint:all

      # Prettier is run as its own tool (oxlint is a correctness linter, not a
      # formatter), so it needs its own gate. Without this, formatting drift
      # accumulates silently and then explodes into whole-file reformats the
      # next time a file is touched — which shows up as unreviewable diffs and
      # merge conflicts.
      - name: Check formatting
        run: bun run format:check

      - name: Run type check
        run: bun run typecheck

      # Regression notes: a note whose bound test or red-run evidence
      # disappeared fails here, so a later change cannot silently drop a
      # decision that already cost a bug fix.
      - name: Verify regression notes
        run: python3 regression-notes/scripts/verify-notes.py --notes-dir .agents/notes

      # Dead-code / unused-export gate. The tree is clean (knip exits 0), so
      # this fails the build the moment a new unused export, type, dependency
      # or duplicate export is introduced.
      - name: Check for unused code (knip)
        run: bun run knip

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build
