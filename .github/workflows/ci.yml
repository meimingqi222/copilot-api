name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run linter
        run: bun run lint:all

      # Prettier is run as its own tool (not via eslint-plugin-prettier), so it
      # needs its own gate. Without this, formatting drift accumulates silently
      # and then explodes into whole-file reformats the next time a file is
      # touched — which shows up as unreviewable diffs and merge conflicts.
      - name: Check formatting
        run: bun run format:check

      - name: Run type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build
