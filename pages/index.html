<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copilot API Admin</title>
  <link rel="stylesheet" href="/admin/static/css/apple-theme.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/admin/static/js/i18n.js"></script>
  <script src="/admin/static/js/api.js"></script>
  <script src="/admin/static/js/quota-display.js"></script>
</head>
<body x-data="adminApp()" x-init="init()" x-cloak>
  <!-- Toast Notifications -->
  <div class="fixed top-6 right-6 z-50 space-y-3">
    <template x-for="toast in toasts" :key="toast.id">
      <div class="toast flex items-center gap-3"
           :class="toast.type === 'error' ? 'border-l-4 border-l-[var(--apple-red)]' : (toast.type === 'success' ? 'border-l-4 border-l-[var(--apple-green)]' : 'border-l-4 border-l-[var(--apple-blue)]')">
        <i :data-lucide="toast.type === 'error' ? 'alert-circle' : (toast.type === 'success' ? 'check-circle' : 'info')" class="w-5 h-5"></i>
        <span x-text="toast.message"></span>
      </div>
    </template>
  </div>

  <div class="flex h-screen" x-show="initialized">
    <!-- Mobile Header -->
    <div class="mobile-header">
      <button @click="sidebarOpen = !sidebarOpen" class="hamburger-btn" :class="{ 'open': sidebarOpen }">
        <div class="hamburger-icon"><span></span><span></span><span></span></div>
      </button>
      <h1 class="text-title-3 flex items-center gap-2">
        <div class="w-7 h-7 bg-gradient-to-br from-[var(--apple-blue)] to-[var(--apple-purple)] rounded-lg flex items-center justify-center">
          <i data-lucide="cpu" class="w-4 h-4 text-white"></i>
        </div>
        <span x-text="t('app.name')"></span>
      </h1>
      <div class="w-10"></div>
    </div>
    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" :class="{ 'open': sidebarOpen }" @click="sidebarOpen = false"></div>
    <!-- Sidebar -->
    <aside class="sidebar w-64 flex flex-col" :class="{ 'open': sidebarOpen }">
      <div class="p-6 border-b border-[var(--apple-gray-5)]">
        <h1 class="text-title-3 flex items-center gap-3">
          <div class="w-8 h-8 bg-gradient-to-br from-[var(--apple-blue)] to-[var(--apple-purple)] rounded-lg flex items-center justify-center">
            <i data-lucide="cpu" class="w-5 h-5 text-white"></i>
          </div>
          <span x-text="t('app.name')"></span>
        </h1>
      </div>

      <nav class="flex-1 py-4">
        <template x-for="item in navItems" :key="item.id">
          <a href="#" 
             @click.prevent="currentView = item.id; window.location.hash = item.id; sidebarOpen = false"
             class="nav-item"
             :class="{ 'active': currentView === item.id }">
            <i :data-lucide="item.icon" class="w-5 h-5"></i>
            <span x-text="item.label"></span>
          </a>
        </template>
      </nav>

      <div class="p-4 border-t border-[var(--apple-gray-5)] space-y-4">
        <!-- Language Switcher -->
        <div class="lang-switcher">
          <button @click="setLang('zh')" :class="{ 'active': currentLang === 'zh' }">中文</button>
          <button @click="setLang('en')" :class="{ 'active': currentLang === 'en' }">EN</button>
        </div>

        <button @click="logout()" class="nav-item w-full !mx-0 !text-[var(--apple-text-secondary)] hover:!text-[var(--apple-text)]">
          <i data-lucide="log-out" class="w-5 h-5"></i>
          <span x-text="t('logout')"></span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-auto p-8 bg-[var(--apple-bg-secondary)]">
      <!-- Dashboard View -->
      <div x-show="currentView === 'dashboard'" x-data="dashboardView()" x-init="load()">
        <header class="flex justify-between items-center mb-8">
          <h2 class="text-headline" x-text="t('dashboard.title')"></h2>
          <div class="flex items-center gap-6">
            <span class="text-body text-[var(--apple-text-secondary)]" x-show="lastRefresh">
              <span x-text="t('dashboard.lastUpdated') + ': '"></span>
              <span x-text="formatTime(lastRefresh)"></span>
            </span>
            <button @click="load()" class="btn btn-secondary" :class="{ 'opacity-75': loading }">
              <i data-lucide="refresh-cw" class="w-4 h-4" :class="{ 'animate-spin': loading }"></i>
              <span x-text="t('refresh')"></span>
            </button>
          </div>
        </header>

        <div x-show="loading" class="flex justify-center items-center py-20">
          <div class="text-center">
            <div class="animate-spin h-12 w-12 border-4 border-[var(--apple-blue)] border-t-transparent rounded-full mx-auto mb-4"></div>
            <p class="text-body text-[var(--apple-text-secondary)]" x-text="t('loading')"></p>
          </div>
        </div>

        <div x-show="!loading" class="animate-slide-in">
          <!-- Stats Grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="stat-card card card-hover">
              <p class="stat-label mb-2" x-text="t('dashboard.activeUsers')"></p>
              <p class="stat-value" x-text="data.activeUsers || 0"></p>
            </div>
            <div class="stat-card card card-hover">
              <p class="stat-label mb-2" x-text="t('dashboard.activeAccounts')"></p>
              <p class="stat-value" x-text="data.activeAccounts || 0"></p>
              <p class="text-sm text-[var(--apple-text-tertiary)] mt-2" x-text="(data.activeAccounts || 0) + ' / ' + (data.totalAccounts || 0)"></p>
            </div>
            <div class="stat-card card card-hover">
              <p class="stat-label mb-2" x-text="t('dashboard.requestsToday')"></p>
              <p class="stat-value" x-text="data.requestsToday || 0"></p>
            </div>
            <div class="stat-card card card-hover">
              <p class="stat-label mb-2" x-text="t('dashboard.errorsToday')"></p>
              <p class="stat-value text-[var(--apple-red)]" x-text="data.errorsToday || 0"></p>
            </div>
          </div>

          <!-- Two Column Layout -->
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Quota Summary -->
            <div class="card p-6">
              <h3 class="text-title-2 mb-6" x-text="t('dashboard.quotaSummary')"></h3>
              <div x-show="data.activeAccountQuota || data.totalQuota">
                <!-- Total Quota (All Accounts) -->
                <div x-show="data.totalQuota" class="mb-6">
                  <div class="flex items-center gap-2 mb-3">
                    <i data-lucide="layers" class="w-4 h-4 text-[var(--apple-text-secondary)]"></i>
                    <span class="text-sm font-medium text-[var(--apple-text-secondary)]" x-text="t('quota.totalQuota') || '全部账户'"></span>
                  </div>
                  
                  <!-- Total Chat Quota -->
                  <div x-show="data.totalQuota?.chatTotal" class="mb-4">
                    <div class="flex items-center justify-between mb-2">
                      <div class="flex items-center gap-2">
                        <i data-lucide="message-square" class="w-4 h-4 text-[var(--apple-text-secondary)]"></i>
                        <span class="text-sm" x-text="t('quota.chat')"></span>
                      </div>
                      <span class="text-sm font-medium">
                        <span x-text="data.totalQuota?.chatRemaining ?? 'N/A'"></span>
                        <span class="text-[var(--apple-text-secondary)]">/ <span x-text="data.totalQuota?.chatTotal"></span></span>
                      </span>
                    </div>
                    <div class="progress-bar">
                      <div class="progress-fill" 
                           :class="totalQuotaColorClass"
                           :style="`width: ${totalChatQuotaPercent}%`"></div>
                    </div>
                  </div>

                  <!-- Total Premium -->
                  <div x-show="data.totalQuota?.premiumTotal">
                    <div class="flex items-center justify-between mb-2">
                      <div class="flex items-center gap-2">
                        <i data-lucide="sparkles" class="w-4 h-4 text-[var(--apple-text-secondary)]"></i>
                        <span class="text-sm text-[var(--apple-text-secondary)]" x-text="t('quota.premium')"></span>
                      </div>
                      <span class="text-sm font-medium">
                        <span x-text="data.totalQuota?.premiumRemaining ?? 'N/A'"></span>
                        <span class="text-[var(--apple-text-secondary)]">/ <span x-text="data.totalQuota?.premiumTotal"></span></span>
                      </span>
                    </div>
                    <div class="progress-bar">
                      <div class="progress-fill" 
                           :class="totalPremiumColorClass"
                           :style="`width: ${totalPremiumPercent}%`"></div>
                    </div>
                  </div>
                </div>

                <!-- Divider -->
                <div x-show="data.activeAccountQuota && data.totalQuota" class="border-t border-[var(--apple-gray-5)] my-4"></div>

                <!-- Active Account Quota -->
                <div x-show="data.activeAccountQuota">
                  <div class="flex items-center gap-2 mb-3">
                    <i data-lucide="user" class="w-4 h-4 text-[var(--apple-blue)]"></i>
                    <span class="text-sm font-medium text-[var(--apple-blue)]" x-text="t('quota.currentAccount') || '当前账户'"></span>
                  </div>

                  <!-- Chat Quota (Priority Display) -->
                  <div x-show="data.activeAccountQuota?.chatTotal" class="mb-4">
                    <div class="flex items-center justify-between mb-2">
                      <div class="flex items-center gap-2">
                        <i data-lucide="message-square" class="w-4 h-4 text-[var(--apple-text-secondary)]"></i>
                        <span class="text-sm font-medium" x-text="t('quota.chat')"></span>
                      </div>
                      <span class="text-title-3">
                        <span x-text="data.activeAccountQuota?.chatRemaining ?? 'N/A'"></span>
                        <span class="text-[var(--apple-text-secondary)]">/ <span x-text="data.activeAccountQuota?.chatTotal"></span></span>
                      </span>
                    </div>
                    <div class="progress-bar">
                      <div class="progress-fill" 
                           :class="chatQuotaColorClass"
                           :style="`width: ${chatQuotaPercent}%`"></div>
                    </div>
                  </div>

                  <!-- Premium Interactions -->
                  <div x-show="data.activeAccountQuota?.premiumTotal" class="py-3 border-t border-[var(--apple-gray-5)]">
                    <div class="flex items-center justify-between mb-2">
                      <div class="flex items-center gap-2">
                        <i data-lucide="sparkles" class="w-4 h-4 text-[var(--apple-text-secondary)]"></i>
                        <span class="text-sm text-[var(--apple-text-secondary)]" x-text="t('quota.premium')"></span>
                      </div>
                      <span class="text-sm font-medium">
                        <span x-text="data.activeAccountQuota?.premiumRemaining ?? 'N/A'"></span>
                        <span class="text-[var(--apple-text-secondary)]">/ <span x-text="data.activeAccountQuota?.premiumTotal"></span></span>
                      </span>
                    </div>
                    <div class="progress-bar">
                      <div class="progress-fill" 
                           :class="premiumQuotaColorClass"
                           :style="`width: ${premiumQuotaPercent}%`"></div>
                    </div>
                  </div>

                  <!-- Completions (Autocomplete) - Simplified -->
                  <div x-show="data.activeAccountQuota?.unlimited || data.activeAccountQuota?.completionsTotal" class="py-3 border-t border-[var(--apple-gray-5)]">
                    <div class="flex items-center justify-between">
                      <div class="flex items-center gap-2">
                        <i data-lucide="keyboard" class="w-4 h-4 text-[var(--apple-text-secondary)]"></i>
                        <span class="text-sm text-[var(--apple-text-secondary)]" x-text="t('quota.completions')"></span>
                      </div>
                      <span x-show="data.activeAccountQuota?.unlimited" class="text-sm text-[var(--apple-green)] font-medium">
                        <span x-text="t('quota.unlimited')"></span>
                      </span>
                      <span x-show="!data.activeAccountQuota?.unlimited" class="text-sm font-medium">
                        <span x-text="data.activeAccountQuota?.completionsRemaining ?? 'N/A'"></span>
                        <span class="text-[var(--apple-text-secondary)]">/ <span x-text="data.activeAccountQuota?.completionsTotal"></span></span>
                      </span>
                    </div>
                  </div>

                  <!-- No quota data -->
                  <div x-show="!data.activeAccountQuota?.chatTotal && !data.activeAccountQuota?.premiumTotal && !data.activeAccountQuota?.completionsTotal" class="text-center py-4">
                    <p class="text-sm text-[var(--apple-text-secondary)]" x-text="t('quota.noData') || '暂无配额数据'"></p>
                  </div>
                </div>
              </div>
            </div>

            <!-- Recent Activity -->
            <div class="card p-6">
              <h3 class="text-title-2 mb-6" x-text="t('dashboard.recentActivity')"></h3>
              <div class="space-y-4" x-show="recentLogs.length">
                <template x-for="log in recentLogs" :key="log.id">
                  <div class="flex items-center justify-between py-3 border-b border-[var(--apple-gray-5)] last:border-0">
                    <div class="flex items-center gap-3">
                      <span class="badge" :class="getLevelClass(log.level)" x-text="log.level"></span>
                      <span class="text-body" x-text="log.path"></span>
                    </div>
                    <span class="text-caption text-[var(--apple-text-secondary)]" x-text="formatTime(log.timestamp)"></span>
                  </div>
                </template>
              </div>
              <div x-show="!recentLogs.length" class="empty-state">
                <i data-lucide="activity" class="empty-state-icon"></i>
                <p class="text-body text-[var(--apple-text-secondary)]" x-text="t('dashboard.noActivity')"></p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Users (API Keys) View -->
      <div x-show="currentView === 'users'" x-data="usersView()" x-init="load()" style="display: none;">
        <header class="flex justify-between items-center mb-8">
          <h2 class="text-headline" x-text="t('users.title')"></h2>
          <div class="flex items-center gap-4">
            <button @click="openCreateModal()" class="btn btn-primary">
              <i data-lucide="plus" class="w-4 h-4 mr-1"></i>
              <span x-text="t('users.addUser')"></span>
            </button>
            <button @click="load()" class="btn btn-secondary" :class="{ 'opacity-75': loading }">
              <i data-lucide="refresh-cw" class="w-4 h-4" :class="{ 'animate-spin': loading }"></i>
            </button>
          </div>
        </header>

        <div x-show="loading" class="flex justify-center py-20">
          <div class="animate-spin h-12 w-12 border-4 border-[var(--apple-blue)] border-t-transparent rounded-full"></div>
        </div>

        <div x-show="!loading" class="card overflow-hidden">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-[var(--apple-gray-5)] bg-[var(--apple-bg-secondary)]">
                <th class="text-left p-3" x-text="t('users.username')"></th>
                <th class="text-left p-3" x-text="t('users.role')"></th>
                <th class="text-left p-3" x-text="t('users.status')"></th>
                <th class="text-left p-3" x-text="t('users.quota')"></th>
                <th class="text-left p-3" x-text="t('users.used')"></th>
                <th class="text-left p-3" x-text="t('users.models')"></th>
                <th class="text-left p-3" x-text="t('users.lastUsed')"></th>
                <th class="text-left p-3" x-text="t('users.actions')"></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="user in users" :key="user.id">
                <tr class="border-b border-[var(--apple-gray-5)] last:border-0 hover:bg-[var(--apple-bg-secondary)]">
                  <td class="p-3 font-medium" x-text="user.username"></td>
                  <td class="p-3">
                    <span class="badge" :class="user.role === 'admin' ? 'badge-warning' : 'badge-info'" x-text="t('users.role.' + user.role)"></span>
                  </td>
                  <td class="p-3">
                    <span class="badge" :class="user.enabled ? 'badge-success' : 'badge-gray'" x-text="t(user.enabled ? 'users.status.enabled' : 'users.status.disabled')"></span>
                  </td>
                  <td class="p-3" x-text="user.quotaLimit === 0 ? t('quota.unlimited') : formatTokens(user.quotaLimit)"></td>
                  <td class="p-3">
                    <div class="flex items-center gap-1">
                      <span x-text="formatTokens(user.usedTokens || 0)"></span>
                      <button @click="resetTokens(user)"
                              class="w-5 h-5 rounded inline-flex items-center justify-center hover:bg-[var(--apple-gray-5)] transition-colors"
                              :title="t('users.resetTokens')"
                              style="font-size:11px;color:var(--apple-text-tertiary)">↺</button>
                    </div>
                  </td>
                  <td class="p-3">
                    <button @click="openModelsModal(user)" class="badge badge-info" x-text="modelAccessText(user)"></button>
                  </td>
                  <td class="p-3 text-[var(--apple-text-secondary)]" x-text="user.lastUsedAt ? formatTime(user.lastUsedAt) : '-'"></td>
                  <td class="p-3">
                    <div class="flex gap-1">
                      <button @click="openEditModal(user)" class="btn-icon" :title="t('users.edit')" style="color:var(--apple-blue)">
                        <i data-lucide="pencil" class="w-4 h-4"></i>
                      </button>
                      <button @click="toggleEnabled(user)" class="btn-icon"
                              :title="t(user.enabled ? 'accounts.disable' : 'accounts.enable')"
                              :style="user.enabled ? 'color:var(--apple-orange)' : 'color:var(--apple-green)'">
                        <i :data-lucide="user.enabled ? 'pause-circle' : 'play-circle'" class="w-4 h-4"></i>
                      </button>
                      <button @click="resetKey(user)" class="btn-icon" :title="t('users.resetKey')">
                        <i data-lucide="key" class="w-4 h-4"></i>
                      </button>
                      <button @click="deleteUser(user)" class="btn-icon" style="color:var(--apple-red)" :title="t('delete')">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                      </button>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
          <div x-show="!users.length" class="empty-state py-12">
            <i data-lucide="key" class="empty-state-icon"></i>
            <p class="text-body text-[var(--apple-text-secondary)]" x-text="t('users.noUsers')"></p>
          </div>
        </div>

        <!-- Create User Modal -->
        <div x-show="showCreateModal" class="modal-overlay" @click.self="showCreateModal = false" x-cloak>
          <div class="modal">
            <div class="modal-header">
              <h3 class="text-title-3" x-text="t('users.addUser')"></h3>
              <button @click="showCreateModal = false" class="btn-icon">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>
            <div class="modal-body space-y-4">
              <div>
                <label class="form-label" x-text="t('users.username')"></label>
                <input x-model="newUser.username" type="text" class="form-input" placeholder="e.g. alice">
              </div>
              <div>
                <label class="form-label" x-text="t('users.role.label')"></label>
                <select x-model="newUser.role" class="form-input">
                  <option value="user" x-text="t('users.role.user')"></option>
                  <option value="admin" x-text="t('users.role.admin')"></option>
                </select>
              </div>
              <div>
                <label class="form-label">
                  <span x-text="t('users.quota')"></span>
                  <span class="text-xs font-normal text-[var(--apple-text-tertiary)] ml-1" x-text="'(' + t('users.quotaHint') + ')'"></span>
                </label>
                <input x-model="newUser.quotaLimit" type="text" class="form-input" placeholder="e.g. 700m">
              </div>
              <div>
                <label class="form-label">
                  <span x-text="t('users.models')"></span>
                  <span class="text-xs font-normal text-[var(--apple-text-tertiary)] ml-1" x-text="'(' + t('users.modelsHint') + ')'"></span>
                </label>
                <div class="max-h-48 overflow-y-auto rounded-xl border border-[var(--apple-gray-5)] p-3 space-y-2">
                  <input type="text" x-model="modelSearch" class="form-input mb-2" :placeholder="t('search') + '...'" style="padding:4px 8px;font-size:12px">
                  <template x-for="model in filteredModels" :key="model.id">
                    <label class="flex items-center gap-2 text-sm cursor-pointer">
                      <input type="checkbox" class="form-checkbox" x-model="newUser.allowedModels" :value="model.id">
                      <span class="font-mono" x-text="model.displayId || model.id"></span>
                      <span x-show="model.provider" class="text-xs text-[var(--apple-text-tertiary)]" x-text="'via ' + model.provider"></span>
                    </label>
                  </template>
                  <p x-show="!models.length" class="text-sm text-[var(--apple-text-tertiary)]" x-text="t('users.noModels')"></p>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button @click="showCreateModal = false" class="btn btn-secondary" x-text="t('cancel')"></button>
              <button @click="createUser()" class="btn btn-primary" x-text="t('create')"></button>
            </div>
          </div>
        </div>

        <!-- Edit User Model Access Modal -->
        <div x-show="showModelsModal" class="modal-overlay" @click.self="showModelsModal = false" x-cloak>
          <div class="modal" style="max-width:640px">
            <div class="modal-header">
              <h3 class="text-title-3" x-text="t('users.modelsTitle', { name: selectedUser?.username || '' })"></h3>
              <button @click="showModelsModal = false" class="btn-icon">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>
            <div class="modal-body space-y-4">
              <p class="text-sm text-[var(--apple-text-secondary)]" x-text="t('users.modelsHint')"></p>
              <div class="flex gap-2">
                <button @click="selectedModels = []" class="btn btn-secondary" x-text="t('users.models.unrestricted')"></button>
                <button @click="selectedModels = models.map((m) => m.id)" class="btn btn-secondary" x-text="t('users.models.selectAll')"></button>
              </div>
              <div class="max-h-80 overflow-y-auto rounded-xl border border-[var(--apple-gray-5)] p-3 space-y-2">
                <input type="text" x-model="modelSearch" class="form-input mb-2" :placeholder="t('search') + '...'" style="padding:4px 8px;font-size:12px">
                <template x-for="model in filteredModels" :key="model.id">
                  <label class="flex items-center gap-2 text-sm cursor-pointer">
                    <input type="checkbox" class="form-checkbox" :checked="isModelSelected(model.id)" @change="toggleModel(model.id)">
                    <span class="font-mono" x-text="model.displayId || model.id"></span>
                    <span x-show="model.provider" class="text-xs text-[var(--apple-text-tertiary)]" x-text="'via ' + model.provider"></span>
                  </label>
                </template>
                <p x-show="!models.length" class="text-sm text-[var(--apple-text-tertiary)]" x-text="t('users.noModels')"></p>
              </div>
            </div>
            <div class="modal-footer">
              <button @click="showModelsModal = false" class="btn btn-secondary" x-text="t('cancel')"></button>
              <button @click="saveModels()" class="btn btn-primary" x-text="t('save')"></button>
            </div>
          </div>
        </div>

        <!-- Edit User Modal -->
        <div x-show="showEditModal" class="modal-overlay" @click.self="showEditModal = false" x-cloak>
          <div class="modal">
            <div class="modal-header">
              <h3 class="text-title-3" x-text="t('users.editUser', { name: editingUser?.username || '' })"></h3>
              <button @click="showEditModal = false" class="btn-icon">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>
            <div class="modal-body space-y-4">
              <div>
                <label class="form-label" x-text="t('users.username')"></label>
                <input x-model="editingUser.username" type="text" class="form-input" placeholder="e.g. alice">
              </div>
              <div>
                <label class="form-label" x-text="t('users.role.label')"></label>
                <select x-model="editingUser.role" class="form-input">
                  <option value="user" x-text="t('users.role.user')"></option>
                  <option value="admin" x-text="t('users.role.admin')"></option>
                </select>
              </div>
              <div>
                <label class="form-label">
                  <span x-text="t('users.quota')"></span>
                  <span class="text-xs font-normal text-[var(--apple-text-tertiary)] ml-1" x-text="'(' + t('users.quotaHint') + ')'"></span>
                </label>
                <input x-model="editingUser.quotaLimit" type="text" class="form-input" placeholder="e.g. 700m">
              </div>
              <div>
                <label class="form-label">
                  <span x-text="t('users.models')"></span>
                  <span class="text-xs font-normal text-[var(--apple-text-tertiary)] ml-1" x-text="'(' + t('users.modelsHint') + ')'"></span>
                </label>
                <div class="flex gap-2 mb-2">
                  <button @click="editingUser.allowedModels = []" class="btn btn-secondary btn-xs" x-text="t('users.models.unrestricted')"></button>
                  <button @click="editingUser.allowedModels = models.map((m) => m.id)" class="btn btn-secondary btn-xs" x-text="t('users.models.selectAll')"></button>
                </div>
                <div class="max-h-48 overflow-y-auto rounded-xl border border-[var(--apple-gray-5)] p-3 space-y-2">
                  <input type="text" x-model="modelSearchEdit" class="form-input mb-2" :placeholder="t('search') + '...'" style="padding:4px 8px;font-size:12px">
                  <template x-for="model in filteredModelsEdit" :key="model.id">
                    <label class="flex items-center gap-2 text-sm cursor-pointer">
                      <input type="checkbox" class="form-checkbox" :checked="editingUser.allowedModels.includes(model.id)" @change="toggleEditModel(model.id)">
                      <span class="font-mono" x-text="model.displayId || model.id"></span>
                      <span x-show="model.provider" class="text-xs text-[var(--apple-text-tertiary)]" x-text="'via ' + model.provider"></span>
                      <span class="text-xs text-[var(--apple-text-tertiary)]" x-text="model.vendor || ''"></span>
                    </label>
                  </template>
                  <p x-show="!models.length" class="text-sm text-[var(--apple-text-tertiary)]" x-text="t('users.noModels')"></p>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button @click="showEditModal = false" class="btn btn-secondary" x-text="t('cancel')"></button>
              <button @click="saveEditUser()" class="btn btn-primary" x-text="t('save')"></button>
            </div>
          </div>
        </div>

        <!-- New API Key Modal -->
        <div x-show="showKeyModal" class="modal-overlay" @click.self="showKeyModal = false" x-cloak>
          <div class="modal" style="max-width:520px">
            <div class="modal-header">
              <h3 class="text-title-3" x-text="t('users.newApiKey')"></h3>
              <button @click="showKeyModal = false" class="btn-icon">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>
            <div class="modal-body text-center">
              <div class="w-14 h-14 bg-[var(--apple-green)] rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i data-lucide="key" class="w-7 h-7 text-white"></i>
              </div>
              <p class="text-sm text-[var(--apple-red)] mb-5" x-text="t('users.keyWarning')"></p>
              <div class="bg-[var(--apple-bg-secondary)] rounded-xl p-4">
                <code class="text-sm break-all select-all font-mono" x-text="newApiKey"></code>
              </div>
            </div>
            <div class="modal-footer justify-center">
              <button @click="copyKey()" class="btn btn-primary">
                <i data-lucide="copy" class="w-4 h-4"></i>
                <span x-text="t('copy')"></span>
              </button>
              <button @click="showKeyModal = false" class="btn btn-secondary" x-text="t('done')"></button>
            </div>
          </div>
        </div>
      </div>

      <!-- Accounts View -->
      <div x-show="currentView === 'accounts'" x-data="accountsView()" x-init="load()" style="display: none;">
        <header class="flex justify-between items-center mb-8">
          <h2 class="text-headline" x-text="t('accounts.title')"></h2>
          <div class="flex items-center gap-4">
            <button @click="openAddModal()" class="btn btn-primary">
              <i data-lucide="plus" class="w-4 h-4 mr-1"></i>
              <span x-text="t('accounts.addAccount')"></span>
            </button>
            <button @click="exportAccounts()" class="btn btn-secondary">
              <i data-lucide="download" class="w-4 h-4 mr-1"></i>
              <span x-text="t('accounts.export')"></span>
            </button>
            <button @click="openImportModal()" class="btn btn-secondary">
              <i data-lucide="upload" class="w-4 h-4 mr-1"></i>
              <span x-text="t('accounts.import')"></span>
            </button>
            <button @click="load()" class="btn btn-secondary" :class="{ 'opacity-75': loading }">
              <i data-lucide="refresh-cw" class="w-4 h-4" :class="{ 'animate-spin': loading }"></i>
            </button>
          </div>
        </header>

        <div x-show="loading" class="flex justify-center py-20">
          <div class="animate-spin h-12 w-12 border-4 border-[var(--apple-blue)] border-t-transparent rounded-full"></div>
        </div>

        <div x-show="!loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <template x-for="account in accounts" :key="account.id">
            <div class="card p-6">
              <div class="flex items-start justify-between mb-4">
                <div class="flex items-center gap-3">
                  <i :data-lucide="providerIcon(account.provider || 'copilot')" class="w-8 h-8"></i>
                  <div>
                    <div class="flex items-center gap-2 flex-wrap">
                      <p class="font-medium" x-text="account.label || providerLabel(account.provider || 'copilot')"></p>
                      <span class="badge badge-info uppercase" x-text="account.provider || 'copilot'"></span>
                    </div>
                    <p x-show="account.subtitle" class="text-xs text-[var(--apple-text-tertiary)] truncate max-w-[220px]" :title="account.subtitle" x-text="account.subtitle"></p>
                    <input
                      x-show="editingLabel === account.id"
                      x-model="editLabelValue"
                      @blur="saveLabel(account)"
                      @keydown.enter="saveLabel(account)"
                      @keydown.escape="editingLabel = null"
                      class="input text-sm mt-1 p-1 h-8"
                      x-ref="labelInput"
                    >
                    <p
                      x-show="editingLabel !== account.id"
                      @dblclick="startEditLabel(account)"
                      class="text-sm text-[var(--apple-text-secondary)] cursor-pointer hover:underline"
                      x-text="t('accounts.doubleClickEdit') || '双击编辑名称'"></p>
                  </div>
                </div>
                <div class="flex flex-col items-end gap-1">
                  <span class="badge" :class="account.enabled ? 'badge-success' : 'badge-gray'" x-text="t(account.enabled ? 'accounts.status.enabled' : 'accounts.status.disabled')"></span>
                  <span x-show="account.isExhausted" class="badge badge-danger" x-text="t('accounts.status.exhausted')"></span>
                  <span class="badge" :class="account.authStatus === 'error' ? 'badge-danger' : account.authStatus === 'ready' ? 'badge-success' : 'badge-gray'"
                        :title="account.authError || ''"
                        :style="account.authError ? 'cursor:help' : ''"
                        x-text="account.authStatus || 'ready'"></span>
                </div>
              </div>
              <div x-show="account.providerFeatures && account.providerFeatures.length" class="mb-4 flex flex-wrap gap-1">
                <template x-for="feature in account.providerFeatures" :key="feature">
                  <span class="tag tag-sm tag-muted" x-text="feature"></span>
                </template>
              </div>
              <!-- Quota Summary -->
              <div x-show="account.supportsQuota" class="mb-4 quota-card-inline">
                <div class="quota-account-card" :class="QuotaDisplay.providerCardClass(account.provider)">
                  <div class="quota-card-accent"></div>
                  <div class="quota-card-body !py-3 !px-3">
                <div class="flex items-center justify-between gap-2 mb-1">
                  <span class="text-sm text-[var(--apple-text-secondary)]" x-text="t('accounts.quota')"></span>
                  <button
                    @click="refreshAccountQuota(account)"
                    class="btn-icon"
                    :title="t('accounts.quotaRefresh')"
                    :class="{ 'opacity-75': refreshingQuotaId === account.id }">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5" :class="{ 'animate-spin': refreshingQuotaId === account.id }"></i>
                  </button>
                </div>
                <p class="text-sm font-medium" x-text="formatQuotaSummary(account)"></p>
                  </div>
                </div>
              </div>
              <!-- Priority Setting -->
              <div class="mb-4 p-3 bg-[var(--apple-bg-secondary)] rounded-lg">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2">
                    <i data-lucide="list-ordered" class="w-4 h-4 text-[var(--apple-text-secondary)]"></i>
                    <span class="text-sm text-[var(--apple-text-secondary)]" x-text="t('accounts.priority')"></span>
                  </div>
                  <div class="flex items-center gap-2">
                    <button @click="increasePriority(account)" class="w-7 h-7 rounded flex items-center justify-center bg-[var(--apple-gray-4)] hover:bg-[var(--apple-gray-5)] transition-colors" :disabled="!account.enabled">
                      <i data-lucide="plus" class="w-4 h-4"></i>
                    </button>
                    <input type="number" x-model.number="account.priority" @change="savePriority(account)"
                           min="0" max="100" step="1"
                           class="input w-16 text-center text-sm py-1 px-2 h-8"
                           :disabled="!account.enabled">
                    <button @click="decreasePriority(account)" class="w-7 h-7 rounded flex items-center justify-center bg-[var(--apple-gray-4)] hover:bg-[var(--apple-gray-5)] transition-colors" :disabled="!account.enabled">
                      <i data-lucide="minus" class="w-4 h-4"></i>
                    </button>
                  </div>
                </div>
                <p class="text-xs text-[var(--apple-text-tertiary)] mt-1" x-text="t('accounts.priorityHint')"></p>
              </div>
              <!-- Available Models -->
              <div x-show="account.availableModels && account.availableModels.length" class="mb-4">
                <p class="text-xs text-[var(--apple-text-secondary)] mb-1.5" x-text="t('accounts.availableModels')"></p>
                <input type="text"
                       x-model="modelSearch[account.id]"
                       :placeholder="t('accounts.searchModels') || '搜索模型...'"
                       class="input text-xs mb-2 py-1 px-2 h-7 w-full">
                <div class="flex flex-col gap-1 max-h-48 overflow-y-auto">
                  <template x-for="model in getFilteredModels(account)" :key="model.id">
                    <div class="flex items-center justify-between gap-1 text-xs px-1.5 py-1 rounded" style="background:rgba(0,113,227,0.07)">
                      <div class="flex items-center gap-1 min-w-0">
                        <span :title="model.pickerEnabled ? t('accounts.models.pickerOn') : t('accounts.models.pickerOff')"
                              :class="model.pickerEnabled ? 'text-[var(--apple-green)]' : 'text-[var(--apple-text-tertiary)]'">
                          <i :data-lucide="model.pickerEnabled ? 'eye' : 'eye-off'" class="w-3 h-3 inline-block"></i>
                        </span>
                        <div class="min-w-0">
                          <div class="truncate font-medium" style="color:var(--apple-blue)" x-text="model.name || model.id"></div>
                          <div x-show="model.name && model.name !== model.id"
                               class="truncate font-mono text-[10px] text-[var(--apple-text-tertiary)]"
                               x-text="model.id"></div>
                        </div>
                      </div>
                      <div class="flex items-center gap-1 shrink-0">
                        <span x-show="model.vendor" class="px-1 py-0.5 rounded text-[10px] bg-indigo-100 text-indigo-700" x-text="model.vendor"></span>
                        <div class="flex gap-0.5 shrink-0">
                          <template x-for="ep in (model.supportedEndpoints || [])" :key="ep">
                            <span class="px-1 py-0.5 rounded text-[10px] font-medium"
                                  :class="ep === '/v1/messages' ? 'bg-purple-100 text-purple-700' : 'bg-sky-100 text-sky-700'"
                                  x-text="ep === '/v1/messages' ? 'ANT' : ep === '/chat/completions' ? 'OAI' : ep === '/responses' ? 'RSP' : ep"></span>
                          </template>
                          <span x-show="!model.supportedEndpoints || !model.supportedEndpoints.length"
                                class="px-1 py-0.5 rounded text-[10px] bg-gray-100 text-gray-500">all</span>
                        </div>
                      </div>
                    </div>
                  </template>
                  <p x-show="getFilteredModels(account).length === 0" class="text-xs text-[var(--apple-text-tertiary)] text-center py-2">
                    <span x-text="t('accounts.noModelsFound') || '未找到匹配的模型'"></span>
                  </p>
                </div>
              </div>
              <div x-show="!account.availableModels || !account.availableModels.length" class="mb-4">
                <p class="text-xs text-[var(--apple-text-secondary)] italic" x-text="t('accounts.modelsLoading')"></p>
              </div>
              <div class="flex items-center gap-1.5">
                <button @click="toggleEnabled(account)" class="btn btn-sm flex-1"
                        :class="account.enabled ? 'btn-secondary' : 'btn-primary'"
                        x-text="t(account.enabled ? 'accounts.disable' : 'accounts.enable')">
                </button>
                <button @click="exportOneAccount(account)" class="btn-icon" :title="t('accounts.exportOne')">
                  <i data-lucide="download" class="w-4 h-4"></i>
                </button>
                <button @click="deleteAccount(account.id)" class="btn-icon" style="color:var(--apple-red)" :title="t('delete')">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </template>
          <div x-show="!accounts.length" class="col-span-full empty-state py-12">
            <i data-lucide="server" class="empty-state-icon"></i>
            <p class="text-body text-[var(--apple-text-secondary)]" x-text="t('accounts.noAccounts')"></p>
          </div>
        </div>

        <!-- Add Modal -->
        <div x-show="showAddModal" class="modal-overlay" @click.self="closeAddModal()" x-cloak>
          <div class="modal">
            <div class="modal-header">
              <h3 class="text-title-3" x-text="selectedProvider()?.authMode === 'oauth' ? t('accounts.oauth.title') : t('accounts.deviceFlow.title')"></h3>
              <button @click="closeAddModal()" class="btn-icon"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div x-show="deviceFlowStep === 'input'" class="modal-body space-y-4">
              <div>
                <label class="form-label" x-text="t('accounts.label')"></label>
                <input x-model="newAccount.label" type="text" :placeholder="t('accounts.labelPlaceholder')" class="form-input">
              </div>
              <div>
                <label class="form-label" x-text="t('accounts.provider')"></label>
                <select x-model="newAccount.provider" class="form-input">
                  <template x-for="provider in providers" :key="provider.id">
                    <option :value="provider.id" x-text="provider.name || provider.id"></option>
                  </template>
                </select>
              </div>
              <div x-show="newAccount.provider === 'mimo-aistudio'" class="space-y-1">
                <label class="form-label" x-text="t('accounts.provider.mimo-aistudio.cookieHint')"></label>
                <textarea x-model="mimoCookieInput" @input="parseMimoCookie()"
                  class="form-input font-mono text-xs" rows="2"
                  placeholder='serviceToken="..."; userId=...; xiaomichatbot_ph="..."'></textarea>
              </div>
              <div x-show="selectedProviderFields().length" class="space-y-3">
                <template x-for="field in selectedProviderFields()" :key="field.key">
                  <div>
                    <label class="form-label" x-text="fieldLabel(field)"></label>
                    <template x-if="field.type === 'checkbox'">
                      <input
                        type="checkbox"
                        class="w-4 h-4"
                        :checked="Boolean(getAccountFieldValue(field))"
                        @change="setAccountFieldValue(field, $event.target.checked)"
                      >
                    </template>
                    <template x-if="field.type === 'select'">
                      <select
                        class="form-input"
                        :value="getAccountFieldValue(field) ?? ''"
                        @change="setAccountFieldValue(field, $event.target.value)"
                      >
                        <template x-for="option in (field.options || [])" :key="option.value">
                          <option :value="option.value" x-text="option.label"></option>
                        </template>
                      </select>
                    </template>
                    <template x-if="field.type !== 'checkbox' && field.type !== 'select'">
                      <input
                        :type="field.type === 'secret' ? 'password' : 'text'"
                        class="form-input"
                        :value="getAccountFieldValue(field) ?? ''"
                        @input="setAccountFieldValue(field, $event.target.value)"
                      >
                    </template>
                  </div>
                </template>
              </div>
              <div class="modal-footer">
                <button @click="closeAddModal()" class="btn btn-secondary" x-text="t('cancel')"></button>
                <button @click="submitAccount()" class="btn btn-primary" x-text="selectedProvider()?.authMode === 'oauth' ? t('accounts.oauth.authorize') : (selectedProvider()?.authMode === 'device_flow' ? t('accounts.deviceFlow.step2') : t('create'))"></button>
              </div>
            </div>
            <div x-show="deviceFlowStep === 'pending'" class="modal-body text-center py-6">
              <div class="animate-spin h-10 w-10 border-4 border-[var(--apple-blue)] border-t-transparent rounded-full mx-auto mb-6"></div>
              <template x-if="oauthFlowData?.authUrl">
                <div>
                  <p class="text-body text-[var(--apple-text-secondary)] mb-4"
                     x-text="needsManualOAuthCallback() ? t('accounts.oauth.manualInstruction') : t('accounts.oauth.instruction')"></p>
                  <a :href="oauthFlowData.authUrl" target="_blank" rel="noopener noreferrer" class="btn btn-secondary inline-flex items-center gap-2">
                    <i data-lucide="external-link" class="w-4 h-4"></i>
                    <span x-text="t('accounts.oauth.openAuth')"></span>
                  </a>
                  <template x-if="needsManualOAuthCallback()">
                    <div class="mt-6 text-left space-y-3">
                      <div>
                        <label class="form-label" x-text="oauthCallbackLabel()"></label>
                        <input
                          x-model="oauthCallbackInput"
                          type="text"
                          class="form-input font-mono text-sm"
                          :placeholder="oauthCallbackPlaceholder()"
                        >
                        <p class="text-caption text-[var(--apple-text-secondary)] mt-2" x-text="oauthCallbackHint()"></p>
                      </div>
                      <button
                        @click="submitOAuthCallback()"
                        class="btn btn-primary w-full"
                        :disabled="oauthCallbackSubmitting || !oauthCallbackInput.trim()"
                        x-text="oauthCallbackSubmitting ? t('accounts.oauth.callbackSubmitting') : t('accounts.oauth.callbackSubmit')"
                      ></button>
                    </div>
                  </template>
                  <p class="text-caption text-[var(--apple-text-secondary)] mt-6"
                     x-show="!needsManualOAuthCallback()"
                     x-text="t('accounts.oauth.waiting')"></p>
                </div>
              </template>
              <template x-if="!oauthFlowData?.authUrl">
                <div>
                  <p class="text-body text-[var(--apple-text-secondary)] mb-4" x-text="t('accounts.deviceFlow.instruction')"></p>
                  <a :href="(oauthFlowData?.verificationUri || deviceFlowData?.verificationUri)" target="_blank" rel="noopener noreferrer" class="btn btn-secondary inline-flex items-center gap-2">
                    <i data-lucide="external-link" class="w-4 h-4"></i>
                    <span x-text="t('accounts.oauth.openVerification')"></span>
                  </a>
                  <p class="text-3xl font-mono font-bold my-6 tracking-widest" x-text="(oauthFlowData?.userCode || deviceFlowData?.userCode)"></p>
                  <p class="text-caption text-[var(--apple-text-secondary)]" x-text="t('accounts.deviceFlow.waiting')"></p>
                </div>
              </template>
            </div>
            <div x-show="deviceFlowStep === 'success'" class="modal-body text-center py-6">
              <div class="w-14 h-14 bg-[var(--apple-green)] rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i data-lucide="check" class="w-7 h-7 text-white"></i>
              </div>
              <h4 class="text-title-3 mb-2" x-text="oauthFlowData ? t('accounts.oauth.success') : t('accounts.deviceFlow.success')"></h4>
              <button @click="closeAddModal(); load()" class="btn btn-primary mt-4" x-text="t('done')"></button>
            </div>
          </div>
        </div>

        <!-- Import Modal -->
        <div x-show="showImportModal" class="modal-overlay" @click.self="closeImportModal()" x-cloak>
          <div class="modal">
            <div class="modal-header">
              <h3 class="text-title-3" x-text="t('accounts.importTitle')"></h3>
              <button @click="closeImportModal()" class="btn-icon"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="modal-body space-y-4">
              <p class="text-sm text-[var(--apple-text-secondary)]" x-text="importMode === 'cpa' ? t('accounts.importCpaDesc') : t('accounts.importDesc')"></p>
              <div class="flex gap-2">
                <button
                  type="button"
                  class="btn btn-secondary text-sm"
                  :class="{ 'btn-primary': importMode === 'standard' }"
                  @click="importMode = 'standard'"
                  x-text="t('accounts.importModeStandard')"
                ></button>
                <button
                  type="button"
                  class="btn btn-secondary text-sm"
                  :class="{ 'btn-primary': importMode === 'cpa' }"
                  @click="importMode = 'cpa'"
                  x-text="t('accounts.importModeCpa')"
                ></button>
              </div>
              <div>
                <label class="form-label" x-text="t('accounts.importFile')"></label>
                <input
                  type="file"
                  accept=".json,application/json"
                  @change="importFileSelected($event)"
                  class="form-input text-sm"
                  x-ref="importFileInput"
                >
              </div>
              <div class="flex items-start gap-3">
                <input
                  type="checkbox"
                  id="importSkipDuplicates"
                  x-model="importSkipDuplicates"
                  class="w-4 h-4 mt-0.5 accent-[var(--apple-blue)]"
                >
                <div>
                  <label for="importSkipDuplicates" class="text-sm cursor-pointer" x-text="t('accounts.importOverwrite')"></label>
                  <p class="text-xs text-[var(--apple-text-tertiary)] mt-0.5" x-text="t('accounts.importOverwriteHint')"></p>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button @click="closeImportModal()" class="btn btn-secondary" x-text="t('cancel')"></button>
              <button @click="submitImport()" class="btn btn-primary" :disabled="!importFile" :class="{ 'opacity-50 cursor-not-allowed': !importFile }">
                <i data-lucide="upload" class="w-4 h-4"></i>
                <span x-text="t('accounts.import')"></span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Provider Connections View -->
      <div x-show="currentView === 'connections'" x-data="connectionsView()" x-init="load()" style="display: none;">
        <header class="flex justify-between items-center mb-8">
          <h2 class="text-headline" x-text="t('connections.title')"></h2>
          <div class="flex items-center gap-3">
            <button @click="load()" class="btn btn-secondary" :class="{ 'opacity-60': loading }">
              <i data-lucide="refresh-cw" class="w-4 h-4" :class="{ 'animate-spin': loading }"></i>
              <span x-text="t('refresh')"></span>
            </button>
            <button @click="testAllCreds()" class="btn btn-secondary">
              <i data-lucide="zap" class="w-4 h-4"></i>
              <span x-text="t('connections.testAll')"></span>
            </button>
            <button @click="openCreate()" class="btn btn-primary">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span x-text="t('connections.add')"></span>
            </button>
          </div>
        </header>

        <!-- Loading state -->
        <div x-show="loading && connections.length === 0" class="flex justify-center py-20">
          <div class="animate-spin h-10 w-10 border-4 border-[var(--apple-blue)] border-t-transparent rounded-full"></div>
        </div>

        <!-- Empty state -->
        <div x-show="!loading && connections.length === 0" class="card p-16 text-center">
          <div class="w-16 h-16 rounded-2xl bg-[var(--apple-gray-6)] flex items-center justify-center mx-auto mb-4">
            <i data-lucide="plug" class="w-8 h-8 text-[var(--apple-text-tertiary)]"></i>
          </div>
          <p class="text-title-3 mb-1" x-text="t('connections.title')"></p>
          <p class="text-sm text-[var(--apple-text-secondary)] mb-5" x-text="t('connections.empty')"></p>
          <button @click="openCreate()" class="btn btn-primary mx-auto">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span x-text="t('connections.add')"></span>
          </button>
        </div>

        <!-- Connection list -->
        <div class="space-y-4">
          <template x-for="conn in connections" :key="conn.id">
            <div class="card p-0 overflow-hidden">
              <!-- Card header -->
              <div class="p-5 flex items-start gap-4">
                <!-- Provider avatar -->
                <div class="w-11 h-11 rounded-2xl flex items-center justify-center text-white text-base font-semibold flex-shrink-0 shadow-sm"
                     :style="'background:' + protocolColor(conn.protocol)">
                  <span x-text="conn.name?.[0]?.toUpperCase() || '?'"></span>
                </div>

                <!-- Info block -->
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2 flex-wrap mb-1">
                    <h3 class="text-title-3" x-text="conn.name"></h3>
                    <span class="tag" :class="conn.enabled ? 'tag-success' : 'tag-muted'"
                          x-text="conn.enabled ? t('enabled') : t('disabled')"></span>
                    <span class="tag tag-info" x-text="conn.protocol"></span>
                  </div>
                  <p class="text-sm text-[var(--apple-text-secondary)] font-mono break-all leading-snug" x-text="conn.baseUrl"></p>
                  <div class="flex items-center gap-3 mt-1.5 flex-wrap">
                    <span class="text-xs text-[var(--apple-text-tertiary)]">id: <span class="font-mono" x-text="conn.id"></span></span>
                    <span class="text-xs text-[var(--apple-text-tertiary)]">priority <span class="font-mono" x-text="conn.priority"></span></span>
                    <span class="text-xs text-[var(--apple-text-tertiary)]">weight <span class="font-mono" x-text="conn.weight ?? 1"></span></span>
                    <span x-show="conn.lastModelDiscoveryAt" class="text-xs text-[var(--apple-text-tertiary)]">↻ <span x-text="formatTime(conn.lastModelDiscoveryAt)"></span></span>
                  </div>
                  <p x-show="conn.lastModelDiscoveryError" class="text-xs text-[var(--apple-red)] mt-1 truncate" x-text="conn.lastModelDiscoveryError"></p>
                </div>

                <!-- Action buttons -->
                <div class="flex items-center gap-1.5 flex-shrink-0">
                  <button @click="refreshModels(conn)" class="btn-icon" :title="t('connections.refreshModels')">
                    <i data-lucide="refresh-ccw" class="w-4 h-4"></i>
                  </button>
                  <button @click="openEdit(conn)" class="btn-icon">
                    <i data-lucide="edit-2" class="w-4 h-4"></i>
                  </button>
                  <button @click="deleteConn(conn)" class="btn-icon" style="color: var(--apple-red)">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>

              <!-- Credentials section -->
              <div class="border-t border-[var(--apple-gray-5)] px-5 py-4">
                <div class="flex items-center justify-between mb-3">
                  <span class="text-xs font-semibold text-[var(--apple-text-tertiary)] uppercase tracking-wider" x-text="t('connections.credentials')"></span>
                  <button @click="openAddCredential(conn)" class="btn btn-sm btn-ghost">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                    <span x-text="t('connections.addCredential')"></span>
                  </button>
                </div>
                <div class="space-y-1.5">
                  <template x-for="cred in conn.credentials" :key="cred.id">
                    <div class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-[var(--apple-bg-secondary)] hover:bg-[var(--apple-gray-6)] transition-colors group">
                      <!-- Status dot -->
                      <div class="w-2 h-2 rounded-full flex-shrink-0"
                           :class="{
                             'bg-[var(--apple-green)]': cred.enabled && cred.status === 'ready',
                             'bg-[var(--apple-orange)]': cred.status === 'cooldown',
                             'bg-[var(--apple-red)]': cred.status === 'auth_error' || cred.status === 'quota_exhausted',
                             'bg-[var(--apple-gray-3)]': !cred.enabled || cred.status === 'disabled'
                           }"></div>
                      <!-- Key display -->
                      <div class="flex-1 min-w-0">
                        <span class="text-xs font-mono text-[var(--apple-text-secondary)] break-all"
                              x-text="revealedCreds[cred.id] || cred.secretPreview || '••••••••'"></span>
                        <span x-show="cred.lastError" class="block text-xs text-[var(--apple-red)] truncate" x-text="cred.lastError"></span>
                      </div>
                      <!-- Actions -->
                      <div class="flex items-center gap-0.5 flex-shrink-0">
                        <button @click="testCred(conn, cred)" class="btn-icon" style="width:28px;height:28px"
                                :class="testing[cred.id] ? 'opacity-50 pointer-events-none' : ''"
                                :title="t('connections.testApi')">
                          <i :data-lucide="testing[cred.id] ? 'loader' : 'zap'" class="w-3.5 h-3.5"
                             :class="testing[cred.id] ? 'animate-spin' : ''"></i>
                        </button>
                        <button @click="revealCred(conn, cred)" class="btn-icon" style="width:28px;height:28px"
                                :title="revealedCreds[cred.id] ? '隐藏' : '显示'">
                          <i :data-lucide="revealedCreds[cred.id] ? 'eye-off' : 'eye'" class="w-3.5 h-3.5"></i>
                        </button>
                        <button x-show="cred.status !== 'ready' && cred.enabled" @click="resetCredential(conn, cred)"
                                class="btn-icon" style="width:28px;height:28px" :title="t('connections.resetStatus')">
                          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                        </button>
                        <button @click="toggleCredential(conn, cred)" class="btn-icon" style="width:28px;height:28px">
                          <i :data-lucide="cred.enabled ? 'pause-circle' : 'play-circle'" class="w-3.5 h-3.5"></i>
                        </button>
                        <button @click="openEditCredential(conn, cred)" class="btn-icon" style="width:28px;height:28px">
                          <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
                        </button>
                        <button @click="deleteCredential(conn, cred)" class="btn-icon" style="width:28px;height:28px;color:var(--apple-red)">
                          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                      </div>
                    </div>
                  </template>
                  <p x-show="!conn.credentials || conn.credentials.length === 0"
                     class="text-sm text-[var(--apple-text-tertiary)] italic py-1 px-1"
                     x-text="t('connections.noCredentials')"></p>
                </div>
              </div>

              <!-- Models section -->
              <div class="border-t border-[var(--apple-gray-5)] px-5 py-3">
                <div class="flex items-center justify-between mb-2">
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-semibold text-[var(--apple-text-tertiary)] uppercase tracking-wider" x-text="t('connections.models')"></span>
                    <span class="tag tag-sm tag-muted" x-text="conn.models?.length || 0"></span>
                  </div>
                  <button @click="openAddModel(conn)" class="btn btn-sm btn-ghost" style="padding:3px 8px;font-size:12px">
                    <i data-lucide="plus" class="w-3 h-3"></i>
                    <span x-text="t('connections.addModel')"></span>
                  </button>
                </div>
                <div class="flex flex-wrap gap-1">
                  <template x-for="m in (conn.models || []).slice(0, 20)" :key="m.publicId">
                    <div class="group relative inline-flex items-center gap-0.5">
                      <span class="tag tag-sm cursor-pointer" :class="m.enabled ? 'tag-info' : 'tag-muted'"
                            @click="toggleModel(conn, m)" x-text="m.publicId"
                            :title="m.enabled ? t('connections.modelDisable') : t('connections.modelEnable')"></span>
                      <button @click.stop="openEditModel(conn, m)"
                              class="w-4 h-4 rounded-full bg-[var(--apple-gray-4)] text-[var(--apple-text-secondary)]
                                     flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"
                              style="font-size:10px;line-height:1">✎</button>
                      <button @click.stop="deleteModel(conn, m)"
                              class="w-4 h-4 rounded-full bg-[var(--apple-red)] text-white
                                     flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"
                              style="font-size:10px;line-height:1">×</button>
                    </div>
                  </template>
                  <span x-show="(conn.models?.length || 0) > 20" class="tag tag-sm tag-muted"
                        x-text="'+' + (conn.models.length - 20) + ' more'"></span>
                  <span x-show="!conn.models?.length" class="text-xs text-[var(--apple-text-tertiary)] italic">—</span>
                </div>
              </div>
            </div>
          </template>
        </div>

        <!-- Connection Modal -->
        <div x-show="showConnModal" class="modal-overlay" @click.self="showConnModal = false" x-cloak>
          <div class="modal">
            <div class="modal-header">
              <h3 class="text-title-3" x-text="connForm.id ? t('connections.edit') : t('connections.add')"></h3>
              <button @click="showConnModal = false" class="btn-icon">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>
            <div class="modal-body space-y-4">
              <div>
                <label class="form-label" x-text="t('connections.name')"></label>
                <input type="text" x-model="connForm.name" class="form-input" placeholder="DeepSeek Production">
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="form-label" x-text="t('connections.protocol')"></label>
                  <select x-model="connForm.protocol" class="form-input">
                    <option value="openai-compatible">openai-compatible</option>
                    <option value="anthropic-compatible">anthropic-compatible</option>
                  </select>
                </div>
                <div>
                  <label class="form-label" x-text="t('connections.priority')"></label>
                  <input type="number" x-model.number="connForm.priority" class="form-input" placeholder="10" min="0">
                </div>
              </div>
              <div>
                <label class="form-label" x-text="t('connections.baseUrl')"></label>
                <input type="text" x-model="connForm.baseUrl" class="form-input" placeholder="https://api.deepseek.com/v1">
                <p class="text-xs text-[var(--apple-text-tertiary)] mt-1.5" x-text="t('connections.baseUrlHint')"></p>
              </div>
              <div>
                <label class="form-label" x-text="t('connections.apiKey')"></label>
                <input type="password" x-model="connForm.apiKey" class="form-input"
                       :placeholder="connForm._credentialId ? t('connections.leaveBlank') : 'sk-...'">
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="form-label" x-text="t('connections.weight')"></label>
                  <input type="number" x-model.number="connForm.weight" class="form-input" placeholder="1" min="1">
                </div>
                <div class="flex items-end pb-0.5">
                  <label class="flex items-center gap-2.5 cursor-pointer">
                    <input type="checkbox" x-model="connForm.enabled" class="w-4 h-4 rounded accent-[var(--apple-blue)]">
                    <span class="text-sm font-medium" x-text="t('enabled')"></span>
                  </label>
                </div>
              </div>
              <div>
                <label class="form-label" x-text="t('connections.modelDiscovery')"></label>
                <div class="flex items-center gap-3">
                  <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" x-model="connForm.discoveryEnabled" class="w-4 h-4 rounded accent-[var(--apple-blue)]">
                    <span class="text-sm" x-text="t('connections.discoveryEnabled')"></span>
                  </label>
                  <select x-model="connForm.discoveryMode" class="form-input flex-1" :disabled="!connForm.discoveryEnabled">
                    <option value="merge">merge</option>
                    <option value="replace">replace</option>
                    <option value="manual-only">manual-only</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button @click="showConnModal = false" class="btn btn-secondary" x-text="t('cancel')"></button>
              <button @click="saveConn()" class="btn btn-primary" x-text="t('save')"></button>
            </div>
          </div>
        </div>

        <!-- Credential Modal -->
        <div x-show="showCredModal" class="modal-overlay" @click.self="showCredModal = false" x-cloak>
          <div class="modal">
            <div class="modal-header">
              <h3 class="text-title-3" x-text="credForm.id ? t('connections.editCredential') : t('connections.addCredential')"></h3>
              <button @click="showCredModal = false" class="btn-icon">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>
            <div class="modal-body space-y-2">
              <label class="form-label" x-text="t('connections.credValue')"></label>
              <textarea x-show="!credForm.id" x-model="credForm.value" class="form-input"
                        rows="5" placeholder="sk-xxx...&#10;sk-yyy...&#10;sk-zzz..."
                        style="resize:vertical;font-family:monospace;font-size:13px"></textarea>
              <input x-show="credForm.id" type="password" x-model="credForm.value" class="form-input"
                     :placeholder="t('connections.leaveBlank')">
              <p x-show="!credForm.id" class="text-xs text-[var(--apple-text-tertiary)]" x-text="t('connections.credBulkHint')"></p>
            </div>
            <div class="modal-footer">
              <button @click="showCredModal = false" class="btn btn-secondary" x-text="t('cancel')"></button>
              <button @click="saveCred()" class="btn btn-primary" x-text="t('save')"></button>
            </div>
          </div>
        </div>

        <!-- Model Modal -->
        <div x-show="showModelModal" class="modal-overlay" @click.self="showModelModal = false" style="display: none;">
          <div class="modal">
            <div class="modal-header">
              <h3 class="text-title-3" x-text="modelForm.originalPublicId ? t('connections.editModel') : t('connections.addModel')"></h3>
              <button @click="showModelModal = false" class="btn-icon"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="modal-body space-y-4">
              <div>
                <label class="form-label" x-text="t('connections.modelPublicId')"></label>
                <input type="text" x-model="modelForm.publicId" class="form-input" placeholder="deepseek-chat"
                       :disabled="!!modelForm.originalPublicId">
              </div>
              <div>
                <label class="form-label" x-text="t('connections.modelUpstreamId')"></label>
                <input type="text" x-model="modelForm.upstreamId" class="form-input"
                       :placeholder="modelForm.publicId || 'GLM-4'">
                <p class="text-xs text-[var(--apple-text-tertiary)] mt-1.5" x-text="t('connections.modelUpstreamIdHint')"></p>
              </div>
            </div>
            <div class="modal-footer">
              <button @click="showModelModal = false" class="btn btn-secondary" x-text="t('cancel')"></button>
              <button @click="saveModel()" class="btn btn-primary" x-text="t('save')"></button>
            </div>
          </div>
        </div>
      </div>

      <!-- Quota View -->
      <div x-show="currentView === 'quota'" x-data="quotaView()" x-init="init()" style="display: none;">
        <header class="flex justify-between items-center mb-8">
          <h2 class="text-headline" x-text="t('quota.title')"></h2>
          <div class="flex items-center gap-4">
            <button @click="showPricingModal = true" class="btn btn-secondary">
              <i data-lucide="settings" class="w-4 h-4"></i>
              <span x-text="t('quota.modelPricing')"></span>
            </button>
            <button @click="refresh()" class="btn btn-secondary" :class="{ 'opacity-75': refreshing }">
              <i data-lucide="refresh-cw" class="w-4 h-4" :class="{ 'animate-spin': refreshing }"></i>
              <span x-text="t('refresh')"></span>
            </button>
          </div>
        </header>

        <div x-show="loading" class="flex justify-center py-20">
          <div class="animate-spin h-12 w-12 border-4 border-[var(--apple-blue)] border-t-transparent rounded-full"></div>
        </div>

        <div x-show="!loading">
          <!-- Usage Statistics Summary -->
          <div class="mb-8">
            <div class="flex items-start justify-between mb-2 gap-3 flex-wrap">
              <h3 class="text-title-2" x-text="t('quota.usageStats')"></h3>
              <!-- Date Range Selector -->
              <div class="flex flex-wrap items-center gap-2 justify-end">
                <button @click="setRange('today')" class="btn btn-small" :class="dateRange === 'today' ? 'btn-primary' : 'btn-secondary'" x-text="t('quota.today')"></button>
                <button @click="setRange('week')" class="btn btn-small" :class="dateRange === 'week' ? 'btn-primary' : 'btn-secondary'" x-text="t('quota.week')"></button>
                <button @click="setRange('month')" class="btn btn-small" :class="dateRange === 'month' ? 'btn-primary' : 'btn-secondary'" x-text="t('quota.month')"></button>
                <button @click="setRange('lastMonth')" class="btn btn-small" :class="dateRange === 'lastMonth' ? 'btn-primary' : 'btn-secondary'" x-text="t('quota.lastMonth')"></button>
                <button @click="setRange('last30d')" class="btn btn-small" :class="dateRange === 'last30d' ? 'btn-primary' : 'btn-secondary'" x-text="t('quota.last30d')"></button>
                <button @click="setRange('all')" class="btn btn-small" :class="dateRange === 'all' ? 'btn-primary' : 'btn-secondary'" x-text="t('quota.all')"></button>
                <input
                  type="month"
                  class="input input-small"
                  :value="selectedMonth"
                  @change="setMonth($event.target.value)"
                  :title="t('quota.pickMonth')" />
              </div>
            </div>
            <p class="text-xs text-[var(--apple-text-secondary)] mb-4" x-show="usageSummary?.period?.startDate">
              <span x-text="t('quota.period')"></span>:
              <span x-text="usageSummary.period.startDate"></span>
              →
              <span x-text="usageSummary.period.endDate"></span>
            </p>

            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
              <div class="card p-4">
                <p class="text-sm text-[var(--apple-text-secondary)] mb-1" x-text="t('quota.requestsInRange')"></p>
                <p class="text-2xl font-bold" x-text="usageSummary.totals.requests || 0"></p>
              </div>
              <div class="card p-4">
                <p class="text-sm text-[var(--apple-text-secondary)] mb-1" x-text="t('quota.tokens.total')"></p>
                <p class="text-2xl font-bold" x-text="formatTokens(usageSummary.totals.totalTokens || 0)"></p>
              </div>
              <div class="card p-4">
                <p class="text-sm text-[var(--apple-text-secondary)] mb-1">
                  <span x-text="t('quota.tokens.prompt')"></span>
                  <span class="text-xs"> / </span>
                  <span x-text="t('quota.tokens.completion')"></span>
                </p>
                <p class="text-lg font-bold">
                  <span x-text="formatTokens(usageSummary.totals.promptTokens || 0)"></span>
                  <span class="text-sm text-[var(--apple-text-secondary)] mx-1">/</span>
                  <span x-text="formatTokens(usageSummary.totals.completionTokens || 0)"></span>
                </p>
                <p class="text-xs text-[var(--apple-text-tertiary)] mt-1" x-show="(usageSummary.totals.cacheReadTokens || 0) + (usageSummary.totals.cacheWriteTokens || 0) > 0">
                  <span x-text="t('quota.tokens.cacheRead') + ': ' + formatTokens(usageSummary.totals.cacheReadTokens || 0)"></span>
                  <span class="mx-1">·</span>
                  <span x-text="t('quota.tokens.cacheWrite') + ': ' + formatTokens(usageSummary.totals.cacheWriteTokens || 0)"></span>
                </p>
              </div>
              <div class="card p-4">
                <p class="text-sm text-[var(--apple-text-secondary)] mb-1" x-text="t('quota.cost')"></p>
                <p class="text-2xl font-bold" x-text="'$' + (usageSummary.totals.cost || 0).toFixed(4)"></p>
              </div>
            </div>
          </div>

          <!-- Two Column Layout -->
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <!-- Model Usage -->
            <div class="card p-6">
              <div class="flex items-start justify-between gap-4 mb-4">
                <div>
                  <h3 class="text-title-2 mb-1" x-text="t('quota.modelUsage')"></h3>
                  <p class="text-sm text-[var(--apple-text-secondary)]" x-text="t('quota.modelUsageDesc')"></p>
                </div>
                <div class="text-right text-xs text-[var(--apple-text-secondary)]" x-show="usageSummary.totals.totalTokens > 0">
                  <p>
                    <span x-text="t('quota.tokens.total')"></span>
                    <span class="mx-1">·</span>
                    <span x-text="formatTokens(usageSummary.totals.totalTokens || 0)"></span>
                  </p>
                </div>
              </div>
              <div class="space-y-4" x-show="Object.keys(usageSummary.byModel).length">
                <template x-for="([model, data]) in sortedModelUsage" :key="model">
                  <div class="rounded-2xl border border-[var(--apple-gray-5)] p-4 bg-[var(--apple-bg-secondary)]">
                    <div class="flex justify-between items-start gap-3 mb-3">
                      <div>
                        <span class="text-sm font-medium break-all" x-text="model"></span>
                        <p class="text-xs text-[var(--apple-text-secondary)] mt-1">
                          <span x-text="t('quota.modelUsageCount') + ': ' + (data.requests || 0)"></span>
                          <span class="mx-1">·</span>
                          <span x-text="t('quota.modelShare') + ': ' + formatPercent(getModelShare(data.totalTokens))"></span>
                        </p>
                      </div>
                      <div class="text-right shrink-0">
                        <p class="text-sm font-bold" x-text="formatTokens(data.totalTokens)"></p>
                        <p class="text-xs text-[var(--apple-text-secondary)] mt-1">
                          <span x-text="formatTokens(data.promptTokens || 0)"></span>
                          <span class="mx-1">/</span>
                          <span x-text="formatTokens(data.completionTokens || 0)"></span>
                        </p>
                        <p class="text-xs text-[var(--apple-blue)] mt-1" x-text="'$' + (data.cost || 0).toFixed(4)"></p>
