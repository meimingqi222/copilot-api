                      </div>
                    </div>
                    <div class="progress-bar mb-2">
                      <div class="progress-fill bg-[var(--apple-blue)]"
                           :style="`width: ${getModelShare(data.totalTokens) * 100}%`"></div>
                    </div>
                    <div class="flex flex-wrap gap-3 text-xs text-[var(--apple-text-tertiary)]">
                      <span x-text="t('quota.tokens.prompt') + ': ' + formatTokens(data.promptTokens || 0)"></span>
                      <span x-text="t('quota.tokens.completion') + ': ' + formatTokens(data.completionTokens || 0)"></span>
                      <span x-show="(data.cacheReadTokens || 0) > 0" x-text="t('quota.tokens.cacheRead') + ': ' + formatTokens(data.cacheReadTokens || 0)"></span>
                      <span x-show="(data.cacheWriteTokens || 0) > 0" x-text="t('quota.tokens.cacheWrite') + ': ' + formatTokens(data.cacheWriteTokens || 0)"></span>
                    </div>
                  </div>
                </template>
              </div>
              <div x-show="!Object.keys(usageSummary.byModel).length" class="empty-state">
                <i data-lucide="cpu" class="empty-state-icon"></i>
                <p class="text-body text-[var(--apple-text-secondary)]">暂无模型使用数据</p>
              </div>
            </div>

            <!-- User Usage -->
            <div class="card p-6">
              <h3 class="text-title-2 mb-4" x-text="t('quota.userUsage')"></h3>
              <div class="space-y-4" x-show="Object.keys(usageSummary.byUser || {}).length">
                <template x-for="(data, userId) in usageSummary.byUser" :key="userId">
                  <div class="pb-4 border-b border-[var(--apple-gray-5)] last:border-0 last:pb-0">
                    <div class="flex justify-between items-center mb-2">
                      <span class="font-medium" x-text="data.username"></span>
                      <div class="text-right">
                        <p class="text-sm font-bold" x-text="formatTokens(data.totalTokens)"></p>
                        <p class="text-xs text-[var(--apple-text-secondary)]" x-text="data.requests + ' requests'"></p>
                      </div>
                    </div>
                    <div class="flex justify-between text-xs text-[var(--apple-text-secondary)]">
                      <span x-text="'Prompt: ' + formatTokens(data.promptTokens)"></span>
                      <span x-text="'Completion: ' + formatTokens(data.completionTokens)"></span>
                      <span class="text-[var(--apple-blue)]" x-text="'$' + (data.cost || 0).toFixed(4)"></span>
                    </div>
                  </div>
                </template>
              </div>
              <div x-show="!Object.keys(usageSummary.byUser || {}).length" class="empty-state">
                <i data-lucide="users" class="empty-state-icon"></i>
                <p class="text-body text-[var(--apple-text-secondary)]" x-text="t('quota.noUsageData')"></p>
              </div>
            </div>

            <!-- Account Usage -->
            <div class="card p-6">
              <h3 class="text-title-2 mb-4" x-text="t('quota.accountUsage')"></h3>
              <div class="space-y-4" x-show="Object.keys(usageSummary.byAccount).length">
                <template x-for="(data, accountId) in usageSummary.byAccount" :key="accountId">
                  <div class="pb-4 border-b border-[var(--apple-gray-5)] last:border-0 last:pb-0">
                    <div class="flex justify-between items-center mb-2">
                      <span class="font-medium" x-text="data.label"></span>
                      <div class="text-right">
                        <p class="text-sm font-bold" x-text="formatTokens(data.totalTokens)"></p>
                        <p class="text-xs text-[var(--apple-text-secondary)]" x-text="data.requests + ' requests'"></p>
                      </div>
                    </div>
                    <div class="flex justify-between text-xs text-[var(--apple-text-secondary)]">
                      <span x-text="'Prompt: ' + formatTokens(data.promptTokens)"></span>
                      <span x-text="'Completion: ' + formatTokens(data.completionTokens)"></span>
                      <span class="text-[var(--apple-blue)]" x-text="'$' + (data.cost || 0).toFixed(4)"></span>
                    </div>
                    <div class="flex gap-3 text-xs text-[var(--apple-text-tertiary)] mt-1" x-show="(data.cacheReadTokens || 0) + (data.cacheWriteTokens || 0) > 0">
                      <span x-text="t('quota.tokens.cacheRead') + ': ' + formatTokens(data.cacheReadTokens || 0)"></span>
                      <span x-text="t('quota.tokens.cacheWrite') + ': ' + formatTokens(data.cacheWriteTokens || 0)"></span>
                    </div>
                  </div>
                </template>
              </div>
              <div x-show="!Object.keys(usageSummary.byAccount).length" class="empty-state">
                <i data-lucide="git-branch" class="empty-state-icon"></i>
                <p class="text-body text-[var(--apple-text-secondary)]">暂无账户使用数据</p>
              </div>
            </div>
          </div>

          <!-- GitHub Account Quotas (Original Content) -->
          <div class="card p-6">
            <h3 class="text-title-2 mb-2" x-text="t('quota.accountQuotasAll')"></h3>
            <p class="text-sm text-[var(--apple-text-secondary)] mb-6" x-text="t('quota.accountQuotasAllDesc')"></p>
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
              <template x-for="account in accounts" :key="account.id">
                <div class="quota-account-card flex flex-col h-full" :class="getQuotaCardClass(account.provider)">
                  <div class="quota-card-accent"></div>
                  <div class="quota-card-body flex flex-col flex-1">
                    <div class="flex items-start gap-3 mb-3">
                      <div class="min-w-0 flex-1">
                        <div class="flex items-center gap-2 flex-wrap mb-1">
                          <span class="quota-provider-badge" :class="getQuotaBadgeClass(account.provider)" x-text="getProviderDisplayName(account.provider || 'copilot')"></span>
                          <span x-show="account.isActive" class="quota-status-pill bg-[var(--apple-blue)] text-white" x-text="t('accounts.status.current')"></span>
                        </div>
                        <p class="font-medium text-body truncate" :title="account.label" x-text="account.label"></p>
                        <p x-show="account.subtitle" class="text-xs text-[var(--apple-text-tertiary)] truncate mt-0.5" :title="account.subtitle" x-text="account.subtitle"></p>
                      </div>
                      <button
                        x-show="account.supportsQuota !== false"
                        @click="refreshAccountQuota(account)"
                        class="btn-icon shrink-0"
                        :class="{ 'opacity-75': refreshingAccountId === account.id }"
                        :title="t('quota.refreshAccount')">
                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5" :class="{ 'animate-spin': refreshingAccountId === account.id }"></i>
                      </button>
                    </div>

                    <div class="flex flex-wrap gap-1.5 mb-3">
                      <span class="quota-status-pill bg-[var(--apple-gray-5)] text-[var(--apple-text-secondary)]">
                        <span x-text="t('accounts.priority') + ' ' + (account.priority ?? 0)"></span>
                      </span>
                      <span class="quota-status-pill"
                            :class="account.enabled ? 'bg-[rgba(52,199,89,0.12)] text-[#248a3d]' : 'bg-[var(--apple-gray-5)] text-[var(--apple-text-secondary)]'"
                            x-text="t(account.enabled ? 'accounts.status.enabled' : 'accounts.status.disabled')">
                      </span>
                      <span x-show="account.isExhausted" class="quota-status-pill bg-[rgba(255,59,48,0.12)] text-[#c41c14]" x-text="t('accounts.status.exhausted')"></span>
                    </div>

                    <div class="quota-card-summary flex-1">
                      <div x-show="account.supportsQuota === false" class="text-sm text-[var(--apple-text-tertiary)]" x-text="t('quota.unavailable')"></div>

                      <div x-show="account.supportsQuota !== false && !account.quotaInfo" class="text-sm text-[var(--apple-text-tertiary)]" x-text="t('quota.noData')"></div>

                      <div x-show="account.supportsQuota !== false && account.quotaInfo?.unlimited" class="text-sm text-[var(--apple-green)] font-medium" x-text="t('quota.unlimited')"></div>

                      <template x-for="row in getQuotaRows(account)" :key="row.id">
                        <div class="mb-2.5 last:mb-0">
                          <div class="flex justify-between items-start gap-2 mb-1">
                            <span class="text-xs leading-snug"
                                  :class="row.hideBar ? 'text-[var(--apple-text-tertiary)]' : 'text-[var(--apple-text-secondary)]'"
                                  x-text="row.label"></span>
                            <div class="text-xs font-medium text-right shrink-0">
                              <span x-text="row.valueText"></span>
                              <span x-show="row.resetText" class="block text-[10px] text-[var(--apple-text-tertiary)] font-normal mt-0.5" x-text="row.resetText"></span>
                            </div>
                          </div>
                          <div class="progress-bar h-1.5" x-show="!row.hideBar && row.remainingPercent !== undefined">
                            <div class="progress-fill"
                                 :class="getQuotaBarColor(row)"
                                 :style="`width: ${row.remainingPercent || 0}%`"></div>
                          </div>
                          <div x-show="row.cycleUsageText"
                               class="mt-1 text-[10px] text-[var(--apple-text-tertiary)] leading-snug">
                            <span x-text="row.cycleUsageText"></span>
                            <span x-show="row.cycleUsageHint"
                                  class="block text-[9px] opacity-80"
                                  x-text="row.cycleUsageHint"></span>
                          </div>
                        </div>
                      </template>
                    </div>

                    <div x-show="account.provider === 'codex' && canResetCodexQuota(account)"
                         class="mt-3 flex flex-wrap gap-2 justify-center">
                      <button
                        @click="resetAccountQuota(account)"
                        class="btn btn-secondary btn-small"
                        :class="{ 'opacity-75': resettingAccountId === account.id }"
                        :disabled="refreshingAccountId === account.id || resettingAccountId === account.id">
                        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 inline-block mr-1" :class="{ 'animate-spin': resettingAccountId === account.id }"></i>
                        <span x-text="t('quota.oauth.codex.resetButton')"></span>
                      </button>
                    </div>

                    <div class="mt-3 pt-3 border-t border-[var(--apple-gray-5)]">
                      <h4 class="text-xs font-medium text-[var(--apple-text-tertiary)] mb-2 uppercase tracking-wide" x-text="t('quota.accountModelUsage')"></h4>
                      <div class="space-y-1.5 max-h-28 overflow-y-auto">
                        <template x-for="(modelData, modelName) in (usageSummary.byAccount[account.id]?.models || {})" :key="modelName">
                          <div class="flex items-center justify-between gap-2 text-xs">
                            <span class="font-mono text-[var(--apple-blue)] truncate min-w-0" :title="modelName" x-text="modelName"></span>
                            <div class="flex items-center gap-2 shrink-0 text-[var(--apple-text-secondary)]">
                              <span x-text="modelData.requests + ' ' + t('quota.requests')"></span>
                              <span class="w-14 text-right" x-text="formatTokens(modelData.totalTokens)"></span>
                              <span class="w-14 text-right" x-text="'$' + (modelData.cost || 0).toFixed(2)"></span>
                            </div>
                          </div>
                        </template>
                        <div x-show="!usageSummary.byAccount[account.id]?.models || Object.keys(usageSummary.byAccount[account.id]?.models || {}).length === 0" class="text-xs text-[var(--apple-text-tertiary)] text-center py-2" x-text="t('quota.noUsageData')"></div>
                      </div>
                    </div>
                  </div>
                </div>
              </template>
              <div x-show="!accounts.length" class="empty-state col-span-full">
                <i data-lucide="git-branch" class="empty-state-icon"></i>
                <p class="text-body text-[var(--apple-text-secondary)]" x-text="t('accounts.noAccounts')"></p>
              </div>
            </div>
          </div>

          <!-- Usage Trend Chart -->
          <div class="card p-6 mt-8">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h3 class="text-title-2 mb-1" x-text="t('quota.usageTrend')"></h3>
                <p class="text-sm text-[var(--apple-text-secondary)]" x-text="t('quota.usageTrendDesc')"></p>
              </div>
            </div>
            <div class="relative h-80">
              <canvas id="usageTrendChart"></canvas>
            </div>
          </div>
        </div>

        <!-- Model Pricing Modal -->
        <div x-show="showPricingModal" class="fixed inset-0 modal-backdrop flex items-center justify-center z-50" x-cloak>
          <div class="modal-content p-0 w-full max-w-6xl max-h-[85vh] overflow-hidden flex flex-col" @click.away="showPricingModal = false">
            <!-- Header -->
            <div class="flex justify-between items-center p-6 border-b border-[var(--apple-gray-5)] bg-gradient-to-r from-[var(--apple-bg-secondary)] to-[var(--apple-bg)]">
              <div>
                <h3 class="text-title-2 mb-1" x-text="t('quota.modelPricing')"></h3>
                <p class="text-sm text-[var(--apple-text-secondary)]">配置每个模型的价格（每 1M tokens，USD）</p>
              </div>
              <button @click="showPricingModal = false" class="text-[var(--apple-text-secondary)] hover:text-[var(--apple-text)] transition-colors p-2 hover:bg-[var(--apple-gray-3)] rounded-lg">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>
            
            <!-- Scrollable Content -->
            <div class="overflow-y-auto flex-1 p-6">
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <template x-for="(price, model) in modelPrices" :key="model">
                  <div class="bg-[var(--apple-bg-secondary)] rounded-xl p-4 border border-[var(--apple-gray-5)] hover:border-[var(--apple-blue)] transition-colors">
                    <!-- Model Name -->
                    <div class="flex items-start justify-between mb-3">
                      <h4 class="font-medium text-sm text-[var(--apple-text)] truncate flex-1 mr-2" :title="model" x-text="model"></h4>
                      <button @click="saveModelPricing(model)" class="btn btn-primary btn-small px-3 py-1 text-xs shrink-0">
                        <i data-lucide="check" class="w-3.5 h-3.5 mr-1"></i>
                        保存
                      </button>
                    </div>
                    
                    <p x-show="isPricingUnmatched(model)"
                       class="mb-3 text-[10px] leading-snug text-[var(--apple-orange)]"
                       x-text="t('quota.pricingUnmatched')"></p>

                    <!-- Price Inputs Grid -->
                    <div class="grid grid-cols-2 gap-3">
                      <div>
                        <label class="block text-xs text-[var(--apple-text-secondary)] mb-1">Prompt <span class="text-[10px] opacity-70">($/1M)</span></label>
                        <div class="relative">
                          <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-xs text-[var(--apple-text-tertiary)]">$</span>
                          <input type="number" step="0.01" x-model="price.promptPricePer1m" 
                                 class="input w-full pl-5 py-1.5 text-sm text-right" placeholder="0.00">
                        </div>
                      </div>
                      <div>
                        <label class="block text-xs text-[var(--apple-text-secondary)] mb-1">Completion <span class="text-[10px] opacity-70">($/1M)</span></label>
                        <div class="relative">
                          <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-xs text-[var(--apple-text-tertiary)]">$</span>
                          <input type="number" step="0.01" x-model="price.completionPricePer1m" 
                                 class="input w-full pl-5 py-1.5 text-sm text-right" placeholder="0.00">
                        </div>
                      </div>
                      <div>
                        <label class="block text-xs text-[var(--apple-text-secondary)] mb-1">缓存读取 <span class="text-[10px] opacity-70">($/1M)</span></label>
                        <div class="relative">
                          <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-xs text-[var(--apple-text-tertiary)]">$</span>
                          <input type="number" step="0.01" x-model="price.cacheReadPricePer1m" 
                                 class="input w-full pl-5 py-1.5 text-sm text-right" placeholder="0.00">
                        </div>
                      </div>
                      <div>
                        <label class="block text-xs text-[var(--apple-text-secondary)] mb-1">缓存写入 <span class="text-[10px] opacity-70">($/1M)</span></label>
                        <div class="relative">
                          <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-xs text-[var(--apple-text-tertiary)]">$</span>
                          <input type="number" step="0.01" x-model="price.cacheWritePricePer1m" 
                                 class="input w-full pl-5 py-1.5 text-sm text-right" placeholder="0.00">
                        </div>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
              
              <div x-show="Object.keys(modelPrices).length === 0" class="empty-state py-16">
                <i data-lucide="cpu" class="empty-state-icon"></i>
                <p class="text-body text-[var(--apple-text-secondary)] mt-3">暂无模型价格配置</p>
              </div>
            </div>

            <!-- Footer -->
            <div class="flex justify-end gap-3 p-4 border-t border-[var(--apple-gray-5)] bg-[var(--apple-bg-secondary)]">
              <button @click="showPricingModal = false" class="btn btn-secondary px-6" x-text="t('close')"></button>
            </div>
          </div>
        </div>
      </div>

      <!-- Performance View -->
      <div x-show="currentView === 'performance'" x-data="performanceView()" x-init="init()" style="display: none;">
        <header class="flex justify-between items-center mb-8">
          <h2 class="text-headline" x-text="t('perf.title')"></h2>
        </header>

        <div x-show="loading" class="flex justify-center py-20">
          <div class="animate-spin h-12 w-12 border-4 border-[var(--apple-blue)] border-t-transparent rounded-full"></div>
        </div>

        <div x-show="!loading">
          <div class="mb-8">
            <div class="flex items-start justify-between mb-2 gap-3 flex-wrap">
              <h3 class="text-title-2 flex items-center gap-2">
                <i data-lucide="gauge" class="w-5 h-5"></i>
                <span>TPS / TTFT</span>
              </h3>
              <div class="flex flex-wrap items-center gap-2 justify-end">
                <button @click="setRange('today')" class="btn btn-small" :class="dateRange === 'today' ? 'btn-primary' : 'btn-secondary'" x-text="t('quota.today')"></button>
                <button @click="setRange('week')" class="btn btn-small" :class="dateRange === 'week' ? 'btn-primary' : 'btn-secondary'" x-text="t('quota.week')"></button>
                <button @click="setRange('month')" class="btn btn-small" :class="dateRange === 'month' ? 'btn-primary' : 'btn-secondary'" x-text="t('quota.month')"></button>
                <button @click="setRange('last30d')" class="btn btn-small" :class="dateRange === 'last30d' ? 'btn-primary' : 'btn-secondary'" x-text="t('quota.last30d')"></button>
                <button @click="setRange('all')" class="btn btn-small" :class="dateRange === 'all' ? 'btn-primary' : 'btn-secondary'" x-text="t('quota.all')"></button>
                <input
                  type="month"
                  class="input input-small"
                  :value="selectedMonth"
                  @change="setMonth($event.target.value)"
                  :title="t('quota.pickMonth')" />
              </div>
            </div>
            <p class="text-xs text-[var(--apple-text-secondary)] mb-4" x-show="period.startDate">
              <span x-text="t('quota.period')"></span>:
              <span x-text="period.startDate"></span>
              →
              <span x-text="period.endDate"></span>
            </p>

            <!-- Explanation Cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
              <div class="card p-4 bg-[var(--apple-bg-secondary)]">
                <div class="flex items-start gap-3">
                  <i data-lucide="timer" class="w-5 h-5 text-[var(--apple-blue)] mt-0.5 shrink-0"></i>
                  <div>
                    <p class="text-sm font-medium">TTFT（首字耗时）</p>
                    <p class="text-xs text-[var(--apple-text-secondary)] mt-1" x-text="t('perf.ttftDesc')"></p>
                  </div>
                </div>
              </div>
              <div class="card p-4 bg-[var(--apple-bg-secondary)]">
                <div class="flex items-start gap-3">
                  <i data-lucide="zap" class="w-5 h-5 text-[var(--apple-purple)] mt-0.5 shrink-0"></i>
                  <div>
                    <p class="text-sm font-medium">TPS（Tokens Per Second）</p>
                    <p class="text-xs text-[var(--apple-text-secondary)] mt-1" x-text="t('perf.streamingTpsDesc')"></p>
                  </div>
                </div>
              </div>
            </div>

            <!-- Model Performance Table -->
            <div class="card p-6" x-show="performance.length">
              <div class="table-container">
                <table class="table" style="table-layout: fixed;">
                  <colgroup>
                    <col style="width: 34%;">
                    <col style="width: 13.2%;">
                    <col style="width: 13.2%;">
                    <col style="width: 13.2%;">
                    <col style="width: 13.2%;">
                    <col style="width: 13.2%;">
                  </colgroup>
                  <thead>
                    <tr>
                      <th x-text="t('perf.model')"></th>
                      <th class="!text-center whitespace-nowrap" x-text="t('perf.requests')"></th>
                      <th class="!text-center whitespace-nowrap" x-text="t('perf.streaming')"></th>
                      <th class="!text-center whitespace-nowrap" x-text="t('perf.avgTtft')"></th>
                      <th class="!text-center whitespace-nowrap" x-text="t('perf.streamingTps')"></th>
                      <th class="!text-center whitespace-nowrap" x-text="t('perf.nonStreamingTps')"></th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="row in performance" :key="row.model">
                      <tr class="hover:bg-[var(--apple-gray-5)]">
                        <td class="font-medium text-sm break-all" x-text="row.model"></td>
                        <td class="!text-center text-sm whitespace-nowrap" x-text="row.requests"></td>
                        <td class="!text-center text-sm whitespace-nowrap" x-text="row.streamingRequests || 0"></td>
                        <td class="!text-center text-sm font-medium whitespace-nowrap" :class="getTtftClass(row.avgTtftMs)" x-text="formatMs(row.avgTtftMs)"></td>
                        <td class="!text-center text-sm font-medium whitespace-nowrap" :class="getTpsClass(row.avgStreamingTps)" x-text="formatTps(row.avgStreamingTps)"></td>
                        <td class="!text-center text-sm font-medium whitespace-nowrap" x-text="formatTps(row.avgNonStreamingTps)"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>

            <div x-show="!performance.length" class="empty-state">
              <i data-lucide="gauge" class="empty-state-icon"></i>
              <p class="text-body text-[var(--apple-text-secondary)]" x-text="t('perf.noData')"></p>
            </div>
          </div>
        </div>
      </div>

      <!-- Guard View -->
      <div x-show="currentView === 'guard'" x-data="guardView()" x-init="load()" style="display: none;">
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
          <div>
            <h2 class="text-headline" x-text="t('guard.title')"></h2>
            <p class="text-body text-[var(--apple-text-secondary)] mt-2" x-show="tab === 'ip' || tab === 'ua'">
              <span x-text="t('guard.recommendedBlocks')"></span>
              <span class="mx-2">·</span>
              <span x-text="overview.recommended"></span>
            </p>
          </div>
          <button class="btn btn-secondary w-full sm:w-auto" @click="load()" :class="{ 'opacity-75': loading }">
            <i data-lucide="refresh-cw" class="w-4 h-4 mr-2" :class="{ 'animate-spin': loading }"></i>
            <span x-text="t('refresh')"></span>
          </button>
        </header>

        <!-- Tab bar: IPs / UAs / Blacklist -->
        <div class="flex flex-wrap gap-2 mb-6">
          <button class="btn min-h-[44px]" :class="tab === 'ip' ? 'btn-primary' : 'btn-secondary'" @click="tab = 'ip'; load()">
            <i data-lucide="globe" class="w-4 h-4 mr-1"></i>
            <span x-text="t('guard.clientIps')"></span>
          </button>
          <button class="btn min-h-[44px]" :class="tab === 'ua' ? 'btn-primary' : 'btn-secondary'" @click="tab = 'ua'; load()">
            <i data-lucide="monitor" class="w-4 h-4 mr-1"></i>
            <span x-text="t('guard.clientUas')"></span>
          </button>
          <button class="btn min-h-[44px]" :class="tab === 'blacklist' ? 'btn-primary' : 'btn-secondary'" @click="tab = 'blacklist'; loadBlacklist()">
            <i data-lucide="ban" class="w-4 h-4 mr-1"></i>
            <span x-text="t('guard.blacklist')"></span>
          </button>
          <button class="btn min-h-[44px]" :class="tab === 'whitelist' ? 'btn-primary' : 'btn-secondary'" @click="tab = 'whitelist'; loadWhitelist()">
            <i data-lucide="shield-check" class="w-4 h-4 mr-1"></i>
            <span x-text="t('guard.whitelist')"></span>
          </button>
        </div>

        <!-- Overview -->
        <div x-show="!loading && (tab === 'ip' || tab === 'ua')" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 mb-6">
          <div class="card p-5">
            <div class="text-caption text-[var(--apple-text-secondary)] mb-2" x-text="t('guard.totalClients')"></div>
            <div class="text-title-1" x-text="overview.total"></div>
          </div>
          <div class="card p-5">
            <div class="text-caption text-[var(--apple-text-secondary)] mb-2" x-text="t('guard.suspicious')"></div>
            <div class="text-title-1 text-[var(--apple-orange)]" x-text="overview.suspicious"></div>
          </div>
          <div class="card p-5">
            <div class="text-caption text-[var(--apple-text-secondary)] mb-2" x-text="t('guard.activeBlocks')"></div>
            <div class="text-title-1 text-[var(--apple-red)]" x-text="overview.blocked"></div>
          </div>
          <div class="card p-5">
            <div class="text-caption text-[var(--apple-text-secondary)] mb-2" x-text="t('guard.recommendedBlocks')"></div>
            <div class="text-title-1 text-[var(--apple-blue)]" x-text="overview.recommended"></div>
          </div>
        </div>

        <!-- Filters -->
        <div x-show="!loading && (tab === 'ip' || tab === 'ua')" class="card p-4 mb-6">
          <div class="flex flex-col xl:flex-row gap-4 xl:items-center xl:justify-between">
            <div class="w-full xl:max-w-md">
              <input type="text" x-model="search" class="input" :placeholder="t('guard.searchPlaceholder')">
            </div>
            <div class="flex flex-wrap gap-2">
              <button class="btn btn-small" :class="filter === 'all' ? 'btn-primary' : 'btn-secondary'" @click="filter = 'all'">
                <span x-text="t('guard.filter.all')"></span>
              </button>
              <button class="btn btn-small" :class="filter === 'suspicious' ? 'btn-primary' : 'btn-secondary'" @click="filter = 'suspicious'">
                <span x-text="t('guard.filter.suspicious')"></span>
              </button>
              <button class="btn btn-small" :class="filter === 'blocked' ? 'btn-primary' : 'btn-secondary'" @click="filter = 'blocked'">
                <span x-text="t('guard.filter.blocked')"></span>
              </button>
              <button class="btn btn-small" :class="filter === 'recommended' ? 'btn-primary' : 'btn-secondary'" @click="filter = 'recommended'">
                <span x-text="t('guard.filter.recommended')"></span>
              </button>
            </div>
          </div>
        </div>

        <!-- Loading -->
        <div x-show="loading" class="text-center py-12">
          <div class="loading-spinner mx-auto mb-4"></div>
        </div>

        <!-- Clients table (IP / UA) -->
        <div x-show="!loading && (tab === 'ip' || tab === 'ua')" class="card overflow-x-auto">
          <table class="w-full text-sm min-w-[1100px]">
            <thead>
              <tr class="border-b border-[var(--apple-gray-5)] bg-[var(--apple-bg-secondary)]">
                <th class="text-left p-3 w-[180px]" x-text="t('guard.risk')"></th>
                <th class="text-left p-3 min-w-[240px]" x-text="tab === 'ip' ? 'IP' : 'User-Agent'"></th>
                <th class="text-left p-3 min-w-[180px]" x-text="t('guard.traffic')"></th>
                <th class="text-left p-3 min-w-[260px]" x-text="t('guard.signals')"></th>
                <th class="text-left p-3 min-w-[200px]" x-text="t('guard.users')"></th>
                <th class="text-left p-3 min-w-[160px]" x-text="t('guard.lastSeen')"></th>
                <th class="text-left p-3 min-w-[140px]" x-text="t('guard.actions')"></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="client in filteredClients" :key="client.key">
                <tr class="border-b border-[var(--apple-gray-5)] last:border-0 hover:bg-[var(--apple-bg-secondary)]"
                    :class="{ 'opacity-70': client.blocked, 'bg-red-50 dark:bg-red-950/20': client.riskLevel === 'critical' && !client.blocked }">
                  <td class="p-3">
                    <div class="flex flex-col gap-2">
                      <div class="flex items-center gap-2">
                        <span class="badge" :class="riskBadgeClass(client.riskLevel)" x-text="t('guard.risk.' + client.riskLevel)"></span>
                        <span class="text-xs font-medium text-[var(--apple-text-secondary)]">
                          <span x-text="t('guard.score')"></span>
                          <span class="ml-1" x-text="client.suspiciousScore"></span>
                        </span>
                      </div>
                      <div class="text-xs" :class="client.recommendedAction === 'temporary_block' ? 'text-[var(--apple-red)] font-medium' : 'text-[var(--apple-text-secondary)]'" x-text="t('guard.action.' + client.recommendedAction)"></div>
                    </div>
                  </td>
                  <td class="p-3">
                    <div class="font-mono text-xs break-all leading-5" x-text="client.key"></div>
                    <div class="mt-2">
                      <div class="text-caption text-[var(--apple-text-tertiary)] mb-1" x-text="t('guard.topPaths')"></div>
                      <div class="flex flex-wrap gap-1.5">
                        <template x-for="path in client.topPaths" :key="path.path">
                          <span class="badge bg-[var(--apple-gray-6)] text-[var(--apple-text-secondary)] normal-case text-[10px]">
                            <span x-text="path.path"></span>
                            <span class="ml-1" x-text="'×' + path.count"></span>
                          </span>
                        </template>
                      </div>
                    </div>
                    <details class="mt-3" x-show="client.flaggedRequests?.length">
                      <summary class="text-caption text-[var(--apple-blue)] cursor-pointer" x-text="t('guard.requestSamples')"></summary>
                      <div class="space-y-2 mt-2">
                        <template x-for="sample in client.flaggedRequests || []" :key="sample.at + sample.path">
                          <div class="rounded-xl bg-[var(--apple-gray-6)] p-3">
                            <div class="text-caption text-[var(--apple-text-secondary)] mb-1">
                              <span x-text="sample.path"></span>
                              <span class="mx-1">·</span>
                              <span x-text="sample.statusCode || '-'"></span>
                              <span class="mx-1">·</span>
                              <span x-text="formatTime(sample.at)"></span>
                            </div>
                            <pre class="font-mono text-[10px] leading-4 whitespace-pre-wrap break-all" x-text="sample.preview"></pre>
                          </div>
                        </template>
                      </div>
                    </details>
                  </td>
                  <td class="p-3">
                    <div class="space-y-2 text-xs">
                      <div class="flex items-center justify-between gap-3">
                        <span class="text-[var(--apple-text-secondary)]" x-text="t('guard.requests')"></span>
                        <span class="font-medium" x-text="client.requests"></span>
                      </div>
                      <div class="flex items-center justify-between gap-3">
                        <span class="text-[var(--apple-text-secondary)]" x-text="t('guard.errors')"></span>
                        <span :class="client.errors > 0 ? 'text-[var(--apple-red)] font-medium' : ''" x-text="client.errors + ' (' + formatPercent(client.errorRate) + ')'"></span>
                      </div>
                      <div class="flex items-center justify-between gap-3">
                        <span class="text-[var(--apple-text-secondary)]" x-text="t('guard.recentWindow')"></span>
                        <span x-text="client.recentRequests"></span>
                      </div>
                      <div class="flex items-center justify-between gap-3">
                        <span class="text-[var(--apple-text-secondary)]" x-text="t('guard.recentBurst')"></span>
                        <span :class="client.burstRequests >= 20 ? 'text-[var(--apple-red)] font-medium' : ''" x-text="client.burstRequests"></span>
                      </div>
                    </div>
                  </td>
                  <td class="p-3">
                    <div class="flex flex-wrap gap-1.5 mb-2" x-show="client.suspiciousReasons.length">
                      <template x-for="reason in client.suspiciousReasons" :key="reason">
                        <span class="badge normal-case text-[10px]" :class="signalBadgeClass(reason)" x-text="t('guard.reason.' + reason)"></span>
                      </template>
                    </div>
                    <div x-show="!client.suspiciousReasons.length" class="text-xs text-[var(--apple-text-secondary)]" x-text="t('guard.noSignals')"></div>
                    <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-xs mt-2">
                      <div class="text-[var(--apple-text-secondary)]" x-text="t('guard.authFailures')"></div>
                      <div x-text="client.authFailures"></div>
                      <div class="text-[var(--apple-text-secondary)]" x-text="t('guard.notFounds')"></div>
                      <div x-text="client.notFounds"></div>
                    </div>
                  </td>
                  <td class="p-3">
                    <div class="text-xs leading-5">
                      <div class="mb-2" x-show="client.usernames.length">
                        <span class="text-[var(--apple-text-secondary)] mr-1">Users:</span>
                        <span class="font-medium" x-text="client.usernames.join(', ')"></span>
                      </div>
                      <div class="text-[var(--apple-text-secondary)]">
                        <span x-text="t('guard.initiator')"></span>
                        <span class="mx-1">·</span>
                        <span :class="client.userInitiatorCount > 0 && client.agentInitiatorCount === 0 ? 'text-[var(--apple-red)] font-medium' : ''" x-text="'U:' + client.userInitiatorCount"></span>
                        <span class="mx-1">/</span>
                        <span :class="client.agentInitiatorCount > 0 ? 'text-[var(--apple-green)] font-medium' : ''" x-text="'A:' + client.agentInitiatorCount"></span>
                      </div>
                    </div>
                  </td>
                  <td class="p-3">
                    <div class="text-xs" x-text="formatTime(client.lastSeenAt)"></div>
                    <div class="text-caption text-[var(--apple-text-secondary)] mt-1">
                      <span x-text="t('guard.firstSeen')"></span>
                      <span class="mx-1">·</span>
                      <span x-text="formatTime(client.firstSeenAt)"></span>
                    </div>
                  </td>
                  <td class="p-3 text-right whitespace-nowrap">
                    <template x-if="client.blocked">
                      <span class="badge bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400" x-text="t('guard.blocked')"></span>
                    </template>
                    <template x-if="!client.blocked">
                      <button class="btn text-xs px-3 py-2 min-h-[36px]" :class="client.recommendedAction === 'temporary_block' ? 'btn-danger' : 'btn-secondary'" @click="openBlockModal(client)">
                        <i data-lucide="ban" class="w-3 h-3 mr-1"></i>
                        <span x-text="t('guard.block')"></span>
                      </button>
                    </template>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
          <div x-show="!filteredClients.length" class="empty-state py-12">
            <i data-lucide="shield" class="empty-state-icon"></i>
            <p class="text-body text-[var(--apple-text-secondary)]" x-text="t('guard.noClients')"></p>
          </div>
        </div>

        <!-- Blacklist table -->
        <div x-show="!loading && tab === 'blacklist'" class="card overflow-x-auto">
          <table class="w-full text-sm min-w-[860px]">
            <thead>
              <tr class="border-b border-[var(--apple-gray-5)] bg-[var(--apple-bg-secondary)]">
                <th class="text-left p-3" x-text="t('guard.type')"></th>
                <th class="text-left p-3" x-text="t('guard.value')"></th>
                <th class="text-left p-3" x-text="t('guard.source')"></th>
                <th class="text-left p-3" x-text="t('guard.reason')"></th>
                <th class="text-left p-3" x-text="t('guard.expiresAt')"></th>
                <th class="text-left p-3" x-text="t('guard.createdAt')"></th>
                <th class="text-left p-3"></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="entry in blacklist" :key="entry.value + entry.type">
                <tr class="border-b border-[var(--apple-gray-5)] last:border-0 hover:bg-[var(--apple-bg-secondary)]">
                  <td class="p-3">
                    <span class="badge" :class="entry.type === 'ip' ? 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400' : 'bg-purple-100 text-purple-700 dark:bg-purple-900/30 dark:text-purple-400'" x-text="entry.type.toUpperCase()"></span>
                  </td>
                  <td class="p-3 font-mono text-xs" x-text="entry.value"></td>
                  <td class="p-3">
                    <span class="badge normal-case" :class="entry.source === 'auto' ? 'badge-warning' : 'badge-info'" x-text="t('guard.source.' + (entry.source || 'manual'))"></span>
                  </td>
                  <td class="p-3 text-xs text-[var(--apple-text-secondary)]">
                    <div x-text="entry.reason || '-'"></div>
                    <div class="flex flex-wrap gap-1 mt-2" x-show="entry.triggerReasons?.length">
                      <template x-for="reason in entry.triggerReasons || []" :key="reason">
                        <span class="badge normal-case text-[10px]" :class="signalBadgeClass(reason)" x-text="t('guard.reason.' + reason)"></span>
                      </template>
                    </div>
                  </td>
                  <td class="p-3 text-xs text-[var(--apple-text-secondary)]" x-text="formatExpiry(entry.expiresAt)"></td>
                  <td class="p-3 text-xs text-[var(--apple-text-secondary)]" x-text="formatTime(entry.createdAt)"></td>
                  <td class="p-3 text-right">
                    <button class="btn btn-secondary text-xs px-3 py-2 min-h-[36px]" @click="unblockEntry(entry)">
                      <i data-lucide="shield-off" class="w-3 h-3 mr-1"></i>
                      <span x-text="t('guard.unblock')"></span>
                    </button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
          <div x-show="!blacklist.length" class="empty-state py-12">
            <i data-lucide="shield-check" class="empty-state-icon"></i>
            <p class="text-body text-[var(--apple-text-secondary)]" x-text="t('guard.noBlacklist')"></p>
          </div>
        </div>

        <!-- Whitelist panel -->
        <div x-show="tab === 'whitelist'" class="space-y-6">
          <!-- Add custom pattern -->
          <div class="card p-4">
            <h3 class="text-subheadline font-medium mb-3" x-text="t('guard.addWhitelist')"></h3>
            <div class="flex flex-col sm:flex-row gap-3">
              <input type="text" x-model="newWhitelistPattern" :placeholder="t('guard.whitelistPattern')"
                     class="input flex-1" @keydown.enter="addWhitelistPattern()">
              <button class="btn btn-primary min-h-[44px]" @click="addWhitelistPattern()" :disabled="!newWhitelistPattern.trim()">
                <i data-lucide="plus" class="w-4 h-4 mr-1"></i>
                <span x-text="t('guard.addWhitelist')"></span>
              </button>
            </div>
          </div>

          <!-- Custom patterns -->
          <div class="card overflow-hidden">
            <div class="p-3 border-b border-[var(--apple-gray-5)] bg-[var(--apple-bg-secondary)]">
              <h3 class="text-subheadline font-medium" x-text="t('guard.whitelistCustom')"></h3>
            </div>
            <template x-if="whitelistCustom.length > 0">
              <div class="divide-y divide-[var(--apple-gray-5)]">
                <template x-for="pattern in whitelistCustom" :key="pattern">
                  <div class="flex items-center justify-between gap-3 p-3">
                    <span class="font-mono text-sm truncate" x-text="pattern"></span>
                    <button class="btn btn-secondary text-xs px-3 py-2 min-h-[36px] whitespace-nowrap" @click="removeWhitelistPattern(pattern)">
                      <i data-lucide="trash-2" class="w-3 h-3 mr-1"></i>
                      <span x-text="t('delete')"></span>
                    </button>
                  </div>
                </template>
              </div>
            </template>
            <div x-show="!whitelistCustom.length" class="p-4 text-center text-[var(--apple-text-secondary)] text-sm">-</div>
          </div>

          <!-- Built-in patterns -->
          <div class="card overflow-hidden">
            <div class="p-3 border-b border-[var(--apple-gray-5)] bg-[var(--apple-bg-secondary)]">
              <h3 class="text-subheadline font-medium" x-text="t('guard.whitelistBuiltin')"></h3>
            </div>
            <div class="flex flex-wrap gap-2 p-3">
              <template x-for="pattern in whitelistBuiltin" :key="pattern">
                <span class="badge bg-[var(--apple-gray-5)] text-[var(--apple-text-secondary)] px-2 py-1 text-xs font-mono" x-text="pattern"></span>
              </template>
            </div>
          </div>
        </div>

        <!-- Block Modal -->
        <div x-show="blockModalOpen" class="fixed inset-0 modal-backdrop flex items-center justify-center z-40 px-4" x-cloak>
          <div class="modal-content p-6 w-full max-w-lg" @click.away="closeBlockModal()">
            <div class="flex items-start justify-between gap-4 mb-6">
              <div>
                <h3 class="text-title-2" x-text="t('guard.blockClient')"></h3>
                <p class="text-sm text-[var(--apple-text-secondary)] mt-2" x-text="t('guard.blockExpiresHint')"></p>
              </div>
              <button class="btn btn-secondary btn-small" @click="closeBlockModal()" x-text="t('close')"></button>
            </div>

            <div class="space-y-4">
              <div>
                <label class="block text-sm text-[var(--apple-text-secondary)] mb-2" x-text="t('guard.blockTarget')"></label>
                <div class="card p-4 bg-[var(--apple-bg-secondary)]">
                  <div class="font-mono text-xs break-all" x-text="blockForm.target?.key || '-'"></div>
                  <div class="mt-3 flex items-center gap-2" x-show="blockForm.target">
                    <span class="badge" :class="blockForm.target ? riskBadgeClass(blockForm.target.riskLevel) : 'badge-info'" x-text="blockForm.target ? t('guard.risk.' + blockForm.target.riskLevel) : '-'"></span>
                    <span class="text-xs text-[var(--apple-text-secondary)]" x-show="blockForm.target" x-text="blockForm.target ? (t('guard.score') + ' ' + blockForm.target.suspiciousScore) : ''"></span>
                  </div>
                </div>
              </div>

              <div>
                <label class="block text-sm text-[var(--apple-text-secondary)] mb-2" x-text="t('guard.blockDuration')"></label>
                <select x-model="blockForm.duration" class="input select">
                  <option value="1h" x-text="t('guard.duration.1h')"></option>
                  <option value="24h" x-text="t('guard.duration.24h')"></option>
                  <option value="permanent" x-text="t('guard.duration.permanent')"></option>
                </select>
              </div>

              <div>
                <label class="block text-sm text-[var(--apple-text-secondary)] mb-2" x-text="t('guard.reason')"></label>
                <textarea x-model="blockForm.reason" class="input min-h-[110px] resize-y" :placeholder="t('guard.blockReason')"></textarea>
              </div>
            </div>

            <div class="flex justify-end gap-3 mt-6">
              <button class="btn btn-secondary" @click="closeBlockModal()" x-text="t('cancel')"></button>
              <button class="btn btn-danger" @click="submitBlock()" :disabled="blockSubmitting || !blockForm.target">
                <span x-text="blockSubmitting ? t('loading') : t('guard.submitBlock')"></span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Logs View -->
      <div x-show="currentView === 'logs'" x-data="logsView()" x-init="init(); load()" style="display: none;">
        <header class="flex justify-between items-center mb-8">
          <h2 class="text-headline" x-text="t('logs.title')"></h2>
          <div class="flex items-center gap-4">
            <button @click="autoRefresh = !autoRefresh" class="btn" :class="autoRefresh ? 'btn-primary' : 'btn-secondary'">
              <i data-lucide="clock" class="w-4 h-4 mr-1"></i>
              <span x-text="autoRefresh ? t('logs.autoRefreshOn') : t('logs.autoRefreshOff')"></span>
            </button>
            <button @click="load()" class="btn btn-secondary" :class="{ 'opacity-75': loading }">
              <i data-lucide="refresh-cw" class="w-4 h-4" :class="{ 'animate-spin': loading }"></i>
            </button>
          </div>
        </header>

        <!-- Filters -->
        <div class="card p-4 mb-6 flex flex-wrap gap-4 items-center">
          <select x-model="filters.level" @change="filters.offset = 0; load()" class="input w-32">
            <option value="" x-text="t('logs.allLevels')"></option>
            <option value="debug">Debug</option>
            <option value="info">Info</option>
            <option value="warn">Warn</option>
            <option value="error">Error</option>
          </select>
          <input x-model="filters.search" @keyup.enter="filters.offset = 0; load()" type="text" :placeholder="t('logs.search')" class="input flex-1 min-w-[200px]">
          <button @click="filters = { level: '', search: '', limit: 50, offset: 0 }; load()" class="btn btn-secondary" x-text="t('logs.clearFilters')"></button>
        </div>

        <div x-show="loading" class="flex justify-center py-20">
          <div class="animate-spin h-12 w-12 border-4 border-[var(--apple-blue)] border-t-transparent rounded-full"></div>
        </div>

        <div x-show="!loading" class="card overflow-hidden">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-[var(--apple-gray-5)] bg-[var(--apple-bg-secondary)]">
                <th class="text-left p-3" x-text="t('logs.time')"></th>
                <th class="text-left p-3" x-text="t('logs.level')"></th>
                <th class="text-left p-3" x-text="t('logs.path')"></th>
                <th class="text-left p-3" x-text="t('logs.user')"></th>
                <th class="text-left p-3" x-text="t('logs.clientIp')"></th>
                <th class="text-left p-3" x-text="t('logs.userAgent')"></th>
                <th class="text-left p-3" x-text="t('logs.model')"></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="log in entries" :key="log.id">
                <tr class="border-b border-[var(--apple-gray-5)] last:border-0 hover:bg-[var(--apple-bg-secondary)]">
                  <td class="p-3 text-[var(--apple-text-secondary)]" x-text="formatTime(log.timestamp)"></td>
                  <td class="p-3">
                    <span class="badge" :class="getLevelClass(log.level)" x-text="log.level"></span>
                  </td>
                  <td class="p-3 font-mono" x-text="log.path"></td>
                  <td class="p-3" x-text="log.username || '-'"></td>
                  <td class="p-3 font-mono text-xs" x-text="log.clientIp || '-'"></td>
                  <td class="p-3 text-xs max-w-[200px] truncate" :title="log.userAgent || ''" x-text="log.userAgent || '-'"></td>
                  <td class="p-3" x-text="log.model || '-'"></td>
                </tr>
              </template>
            </tbody>
          </table>
          <div x-show="!entries.length" class="empty-state py-12">
            <i data-lucide="scroll-text" class="empty-state-icon"></i>
            <p class="text-body text-[var(--apple-text-secondary)]" x-text="t('logs.noLogs')"></p>
          </div>
        </div>

        <!-- Pagination -->
        <div class="flex justify-between items-center mt-6" x-show="total > 0">
          <span class="text-body text-[var(--apple-text-secondary)]" x-text="`${filters.offset + 1} - ${Math.min(filters.offset + filters.limit, total)} of ${total}`"></span>
          <div class="flex gap-3">
            <button @click="prevPage()" :disabled="filters.offset === 0" class="btn btn-secondary btn-small" :class="{ 'opacity-50': filters.offset === 0 }" x-text="t('logs.previous')"></button>
            <button @click="nextPage()" :disabled="filters.offset + filters.limit >= total" class="btn btn-secondary btn-small" :class="{ 'opacity-50': filters.offset + filters.limit >= total }" x-text="t('logs.next')"></button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/admin/static/js/views/app.js"></script>
  <script src="/admin/static/js/views/dashboard.js"></script>
  <script src="/admin/static/js/views/users.js"></script>
  <script src="/admin/static/js/views/accounts.js"></script>
  <script src="/admin/static/js/views/connections.js"></script>
  <script src="/admin/static/js/views/quota.js"></script>
  <script src="/admin/static/js/views/performance.js"></script>
  <script src="/admin/static/js/views/guard.js"></script>
  <script src="/admin/static/js/views/logs.js"></script>
</body>
</html>
