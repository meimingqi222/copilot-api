<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copilot API Admin</title>
  <link rel="stylesheet" href="/admin/static/css/apple-theme.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/admin/static/js/i18n.js"></script>
  <script src="/admin/static/js/api.js"></script>
</head>
<body x-data="adminApp()" x-init="init()" x-cloak>
  <!-- Toast Notifications -->
  <div class="fixed top-6 right-6 z-50 space-y-3">
    <template x-for="toast in toasts" :key="toast.id">
      <div class="toast flex items-center gap-3"
           :class="toast.type === 'error' ? 'border-l-4 border-l-[var(--apple-red)]' : (toast.type === 'success' ? 'border-l-4 border-l-[var(--apple-green)]' : 'border-l-4 border-l-[var(--apple-blue)]')">
        <i :data-lucide="toast.type === 'error' ? 'alert-circle' : (toast.type === 'success' ? 'check-circle' : 'info')" class="w-5 h-5"></i>
        <span x-text="toast.message"></span>
      </div>
    </template>
  </div>

  <div class="flex h-screen" x-show="initialized">
    <!-- Mobile Header -->
    <div class="mobile-header">
      <button @click="sidebarOpen = !sidebarOpen" class="hamburger-btn" :class="{ 'open': sidebarOpen }">
        <div class="hamburger-icon"><span></span><span></span><span></span></div>
      </button>
      <h1 class="text-title-3 flex items-center gap-2">
        <div class="w-7 h-7 bg-gradient-to-br from-[var(--apple-blue)] to-[var(--apple-purple)] rounded-lg flex items-center justify-center">
          <i data-lucide="cpu" class="w-4 h-4 text-white"></i>
        </div>
        <span x-text="t('app.name')"></span>
      </h1>
      <div class="w-10"></div>
    </div>
    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" :class="{ 'open': sidebarOpen }" @click="sidebarOpen = false"></div>
    <!-- Sidebar -->
    <aside class="sidebar w-64 flex flex-col" :class="{ 'open': sidebarOpen }">
      <div class="p-6 border-b border-[var(--apple-gray-5)]">
        <h1 class="text-title-3 flex items-center gap-3">
          <div class="w-8 h-8 bg-gradient-to-br from-[var(--apple-blue)] to-[var(--apple-purple)] rounded-lg flex items-center justify-center">
            <i data-lucide="cpu" class="w-5 h-5 text-white"></i>
          </div>
          <span x-text="t('app.name')"></span>
        </h1>
      </div>

      <nav class="flex-1 py-4">
        <template x-for="item in navItems" :key="item.id">
          <a href="#" 
             @click.prevent="currentView = item.id; window.location.hash = item.id; sidebarOpen = false"
             class="nav-item"
             :class="{ 'active': currentView === item.id }">
            <i :data-lucide="item.icon" class="w-5 h-5"></i>
            <span x-text="item.label"></span>
          </a>
        </template>
      </nav>

      <div class="p-4 border-t border-[var(--apple-gray-5)] space-y-4">
        <!-- Language Switcher -->
        <div class="lang-switcher">
          <button @click="setLang('zh')" :class="{ 'active': currentLang === 'zh' }">中文</button>
          <button @click="setLang('en')" :class="{ 'active': currentLang === 'en' }">EN</button>
        </div>

        <button @click="logout()" class="nav-item w-full !mx-0 !text-[var(--apple-text-secondary)] hover:!text-[var(--apple-text)]">
          <i data-lucide="log-out" class="w-5 h-5"></i>
          <span x-text="t('logout')"></span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-auto p-8 bg-[var(--apple-bg-secondary)]">
      <!-- Dashboard View -->
      <div x-show="currentView === 'dashboard'" x-data="dashboardView()" x-init="load()">
        <header class="flex justify-between items-center mb-8">
          <h2 class="text-headline" x-text="t('dashboard.title')"></h2>
          <div class="flex items-center gap-6">
            <span class="text-body text-[var(--apple-text-secondary)]" x-show="lastRefresh">
              <span x-text="t('dashboard.lastUpdated') + ': '"></span>
              <span x-text="formatTime(lastRefresh)"></span>
            </span>
            <button @click="load()" class="btn btn-secondary" :class="{ 'opacity-75': loading }">
              <i data-lucide="refresh-cw" class="w-4 h-4" :class="{ 'animate-spin': loading }"></i>
              <span x-text="t('refresh')"></span>
            </button>
          </div>
        </header>

        <div x-show="loading" class="flex justify-center items-center py-20">
          <div class="text-center">
            <div class="animate-spin h-12 w-12 border-4 border-[var(--apple-blue)] border-t-transparent rounded-full mx-auto mb-4"></div>
            <p class="text-body text-[var(--apple-text-secondary)]" x-text="t('loading')"></p>
          </div>
        </div>

        <div x-show="!loading" class="animate-slide-in">
          <!-- Stats Grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="stat-card card card-hover">
              <p class="stat-label mb-2" x-text="t('dashboard.activeUsers')"></p>
              <p class="stat-value" x-text="data.activeUsers || 0"></p>
            </div>
            <div class="stat-card card card-hover">
              <p class="stat-label mb-2" x-text="t('dashboard.activeAccounts')"></p>
              <p class="stat-value" x-text="data.activeAccounts || 0"></p>
              <p class="text-sm text-[var(--apple-text-tertiary)] mt-2" x-text="(data.activeAccounts || 0) + ' / ' + (data.totalAccounts || 0)"></p>
            </div>
            <div class="stat-card card card-hover">
              <p class="stat-label mb-2" x-text="t('dashboard.requestsToday')"></p>
              <p class="stat-value" x-text="data.requestsToday || 0"></p>
            </div>
            <div class="stat-card card card-hover">
              <p class="stat-label mb-2" x-text="t('dashboard.errorsToday')"></p>
              <p class="stat-value text-[var(--apple-red)]" x-text="data.errorsToday || 0"></p>
            </div>
          </div>

          <!-- Two Column Layout -->
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Quota Summary -->
            <div class="card p-6">
              <h3 class="text-title-2 mb-6" x-text="t('dashboard.quotaSummary')"></h3>
              <div x-show="data.activeAccountQuota || data.totalQuota">
                <!-- Total Quota (All Accounts) -->
                <div x-show="data.totalQuota" class="mb-6">
                  <div class="flex items-center gap-2 mb-3">
                    <i data-lucide="layers" class="w-4 h-4 text-[var(--apple-text-secondary)]"></i>
                    <span class="text-sm font-medium text-[var(--apple-text-secondary)]" x-text="t('quota.totalQuota') || '全部账户'"></span>
                  </div>
                  
                  <!-- Total Chat Quota -->
                  <div x-show="data.totalQuota?.chatTotal" class="mb-4">
                    <div class="flex items-center justify-between mb-2">
                      <div class="flex items-center gap-2">
                        <i data-lucide="message-square" class="w-4 h-4 text-[var(--apple-text-secondary)]"></i>
                        <span class="text-sm" x-text="t('quota.chat')"></span>
                      </div>
                      <span class="text-sm font-medium">
                        <span x-text="data.totalQuota?.chatRemaining ?? 'N/A'"></span>
                        <span class="text-[var(--apple-text-secondary)]">/ <span x-text="data.totalQuota?.chatTotal"></span></span>
                      </span>
                    </div>
                    <div class="progress-bar">
                      <div class="progress-fill" 
                           :class="totalQuotaColorClass"
                           :style="`width: ${totalChatQuotaPercent}%`"></div>
                    </div>
                  </div>

                  <!-- Total Premium -->
                  <div x-show="data.totalQuota?.premiumTotal">
                    <div class="flex items-center justify-between mb-2">
                      <div class="flex items-center gap-2">
                        <i data-lucide="sparkles" class="w-4 h-4 text-[var(--apple-text-secondary)]"></i>
                        <span class="text-sm text-[var(--apple-text-secondary)]" x-text="t('quota.premium')"></span>
                      </div>
                      <span class="text-sm font-medium">
                        <span x-text="data.totalQuota?.premiumRemaining ?? 'N/A'"></span>
                        <span class="text-[var(--apple-text-secondary)]">/ <span x-text="data.totalQuota?.premiumTotal"></span></span>
                      </span>
                    </div>
                    <div class="progress-bar">
                      <div class="progress-fill" 
                           :class="totalPremiumColorClass"
                           :style="`width: ${totalPremiumPercent}%`"></div>
                    </div>
                  </div>
                </div>

                <!-- Divider -->
                <div x-show="data.activeAccountQuota && data.totalQuota" class="border-t border-[var(--apple-gray-5)] my-4"></div>

                <!-- Active Account Quota -->
                <div x-show="data.activeAccountQuota">
                  <div class="flex items-center gap-2 mb-3">
                    <i data-lucide="user" class="w-4 h-4 text-[var(--apple-blue)]"></i>
                    <span class="text-sm font-medium text-[var(--apple-blue)]" x-text="t('quota.currentAccount') || '当前账户'"></span>
                  </div>

                  <!-- Chat Quota (Priority Display) -->
                  <div x-show="data.activeAccountQuota?.chatTotal" class="mb-4">
                    <div class="flex items-center justify-between mb-2">
                      <div class="flex items-center gap-2">
                        <i data-lucide="message-square" class="w-4 h-4 text-[var(--apple-text-secondary)]"></i>
                        <span class="text-sm font-medium" x-text="t('quota.chat')"></span>
                      </div>
                      <span class="text-title-3">
                        <span x-text="data.activeAccountQuota?.chatRemaining ?? 'N/A'"></span>
                        <span class="text-[var(--apple-text-secondary)]">/ <span x-text="data.activeAccountQuota?.chatTotal"></span></span>
                      </span>
                    </div>
                    <div class="progress-bar">
                      <div class="progress-fill" 
                           :class="chatQuotaColorClass"
                           :style="`width: ${chatQuotaPercent}%`"></div>
                    </div>
                  </div>

                  <!-- Premium Interactions -->
                  <div x-show="data.activeAccountQuota?.premiumTotal" class="py-3 border-t border-[var(--apple-gray-5)]">
                    <div class="flex items-center justify-between mb-2">
                      <div class="flex items-center gap-2">
                        <i data-lucide="sparkles" class="w-4 h-4 text-[var(--apple-text-secondary)]"></i>
                        <span class="text-sm text-[var(--apple-text-secondary)]" x-text="t('quota.premium')"></span>
                      </div>
                      <span class="text-sm font-medium">
                        <span x-text="data.activeAccountQuota?.premiumRemaining ?? 'N/A'"></span>
                        <span class="text-[var(--apple-text-secondary)]">/ <span x-text="data.activeAccountQuota?.premiumTotal"></span></span>
                      </span>
                    </div>
                    <div class="progress-bar">
                      <div class="progress-fill" 
                           :class="premiumQuotaColorClass"
                           :style="`width: ${premiumQuotaPercent}%`"></div>
                    </div>
                  </div>

                  <!-- Completions (Autocomplete) - Simplified -->
                  <div x-show="data.activeAccountQuota?.unlimited || data.activeAccountQuota?.completionsTotal" class="py-3 border-t border-[var(--apple-gray-5)]">
                    <div class="flex items-center justify-between">
                      <div class="flex items-center gap-2">
                        <i data-lucide="keyboard" class="w-4 h-4 text-[var(--apple-text-secondary)]"></i>
                        <span class="text-sm text-[var(--apple-text-secondary)]" x-text="t('quota.completions')"></span>
                      </div>
                      <span x-show="data.activeAccountQuota?.unlimited" class="text-sm text-[var(--apple-green)] font-medium">
                        <span x-text="t('quota.unlimited')"></span>
                      </span>
                      <span x-show="!data.activeAccountQuota?.unlimited" class="text-sm font-medium">
                        <span x-text="data.activeAccountQuota?.completionsRemaining ?? 'N/A'"></span>
                        <span class="text-[var(--apple-text-secondary)]">/ <span x-text="data.activeAccountQuota?.completionsTotal"></span></span>
                      </span>
                    </div>
                  </div>

                  <!-- No quota data -->
                  <div x-show="!data.activeAccountQuota?.chatTotal && !data.activeAccountQuota?.premiumTotal && !data.activeAccountQuota?.completionsTotal" class="text-center py-4">
                    <p class="text-sm text-[var(--apple-text-secondary)]" x-text="t('quota.noData') || '暂无配额数据'"></p>
                  </div>
                </div>
              </div>
            </div>

            <!-- Recent Activity -->
            <div class="card p-6">
              <h3 class="text-title-2 mb-6" x-text="t('dashboard.recentActivity')"></h3>
              <div class="space-y-4" x-show="recentLogs.length">
                <template x-for="log in recentLogs" :key="log.id">
                  <div class="flex items-center justify-between py-3 border-b border-[var(--apple-gray-5)] last:border-0">
                    <div class="flex items-center gap-3">
                      <span class="badge" :class="getLevelClass(log.level)" x-text="log.level"></span>
                      <span class="text-body" x-text="log.path"></span>
                    </div>
                    <span class="text-caption text-[var(--apple-text-secondary)]" x-text="formatTime(log.timestamp)"></span>
                  </div>
                </template>
              </div>
              <div x-show="!recentLogs.length" class="empty-state">
                <i data-lucide="activity" class="empty-state-icon"></i>
                <p class="text-body text-[var(--apple-text-secondary)]" x-text="t('dashboard.noActivity')"></p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Accounts View -->
      <div x-show="currentView === 'accounts'" x-data="accountsView()" x-init="load()" style="display: none;">
        <header class="flex justify-between items-center mb-8">
          <h2 class="text-headline" x-text="t('accounts.title')"></h2>
          <div class="flex items-center gap-4">
            <button @click="openAddModal()" class="btn btn-primary">
              <i data-lucide="plus" class="w-4 h-4 mr-1"></i>
              <span x-text="t('accounts.addAccount')"></span>
            </button>
            <button @click="load()" class="btn btn-secondary" :class="{ 'opacity-75': loading }">
              <i data-lucide="refresh-cw" class="w-4 h-4" :class="{ 'animate-spin': loading }"></i>
            </button>
          </div>
        </header>

        <div x-show="loading" class="flex justify-center py-20">
          <div class="animate-spin h-12 w-12 border-4 border-[var(--apple-blue)] border-t-transparent rounded-full"></div>
        </div>

        <div x-show="!loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <template x-for="account in accounts" :key="account.id">
            <div class="card p-6">
              <div class="flex items-start justify-between mb-4">
                <div class="flex items-center gap-3">
                  <i data-lucide="git-branch" class="w-8 h-8"></i>
                  <div>
                    <p class="font-medium" x-text="account.label || 'GitHub'"></p>
                    <!-- 允许编辑账户名称 -->
                    <input
                      x-show="editingLabel === account.id"
                      x-model="editLabelValue"
                      @blur="saveLabel(account)"
                      @keydown.enter="saveLabel(account)"
                      @keydown.escape="editingLabel = null"
                      class="input text-sm mt-1 p-1 h-8"
                      x-ref="labelInput"
                    >
                    <p
                      x-show="editingLabel !== account.id"
                      @dblclick="startEditLabel(account)"
                      class="text-sm text-[var(--apple-text-secondary)] cursor-pointer hover:underline"
                      x-text="t('accounts.doubleClickEdit') || '双击编辑名称'"></p>
                  </div>
                </div>
                <div class="flex flex-col items-end gap-1">
                  <!-- 用户控制的启用状态 -->
                  <span class="badge" :class="account.enabled ? 'badge-success' : 'badge-gray'" x-text="t(account.enabled ? 'accounts.status.enabled' : 'accounts.status.disabled')"></span>
                  <!-- 配额耗尽状态 -->
                  <span x-show="account.isExhausted" class="badge badge-danger" x-text="t('accounts.status.exhausted')"></span>
                </div>
              </div>
              <!-- Priority Setting -->
              <div class="mb-4 p-3 bg-[var(--apple-bg-secondary)] rounded-lg">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2">
                    <i data-lucide="list-ordered" class="w-4 h-4 text-[var(--apple-text-secondary)]"></i>
                    <span class="text-sm text-[var(--apple-text-secondary)]" x-text="t('accounts.priority')"></span>
                  </div>
                  <div class="flex items-center gap-2">
                    <button @click="increasePriority(account)" class="w-7 h-7 rounded flex items-center justify-center bg-[var(--apple-gray-4)] hover:bg-[var(--apple-gray-5)] transition-colors" :disabled="!account.enabled">
                      <i data-lucide="plus" class="w-4 h-4"></i>
                    </button>
                    <input type="number" x-model.number="account.priority" @change="savePriority(account)"
                           min="0" max="100" step="1"
                           class="input w-16 text-center text-sm py-1 px-2 h-8"
                           :disabled="!account.enabled">
                    <button @click="decreasePriority(account)" class="w-7 h-7 rounded flex items-center justify-center bg-[var(--apple-gray-4)] hover:bg-[var(--apple-gray-5)] transition-colors" :disabled="!account.enabled">
                      <i data-lucide="minus" class="w-4 h-4"></i>
                    </button>
                  </div>
                </div>
                <p class="text-xs text-[var(--apple-text-tertiary)] mt-1" x-text="t('accounts.priorityHint')"></p>
              </div>
              <!-- Available Models -->
              <div x-show="account.availableModels && account.availableModels.length" class="mb-4">
                <p class="text-xs text-[var(--apple-text-secondary)] mb-1.5" x-text="t('accounts.availableModels')"></p>
                <div class="flex flex-col gap-1 max-h-48 overflow-y-auto">
                  <template x-for="(model, idx) in (account.availableModels || [])" :key="idx">
                    <div class="flex items-center justify-between gap-1 text-xs px-1.5 py-1 rounded" style="background:rgba(0,113,227,0.07)">
                      <div class="flex items-center gap-1 min-w-0">
                        <!-- picker indicator -->
                        <span :title="model.pickerEnabled ? t('accounts.models.pickerOn') : t('accounts.models.pickerOff')"
                              :class="model.pickerEnabled ? 'text-[var(--apple-green)]' : 'text-[var(--apple-text-tertiary)]'">
                          <i :data-lucide="model.pickerEnabled ? 'eye' : 'eye-off'" class="w-3 h-3 inline-block"></i>
                        </span>
                        <span class="font-mono truncate" style="color:var(--apple-blue)" x-text="model.id"></span>
                      </div>
                      <!-- supported endpoints -->
                      <div class="flex gap-0.5 shrink-0">
                        <template x-for="ep in (model.supportedEndpoints || [])" :key="ep">
                          <span class="px-1 py-0.5 rounded text-[10px] font-medium"
                                :class="ep === '/v1/messages' ? 'bg-purple-100 text-purple-700' : 'bg-sky-100 text-sky-700'"
                                x-text="ep === '/v1/messages' ? 'ANT' : ep === '/chat/completions' ? 'OAI' : ep === '/responses' ? 'RSP' : ep"></span>
                        </template>
                        <span x-show="!model.supportedEndpoints || !model.supportedEndpoints.length"
                              class="px-1 py-0.5 rounded text-[10px] bg-gray-100 text-gray-500">all</span>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
              <div x-show="!account.availableModels || !account.availableModels.length" class="mb-4">
                <p class="text-xs text-[var(--apple-text-secondary)] italic" x-text="t('accounts.modelsLoading')"></p>
              </div>
              <div class="flex gap-2 flex-wrap">
                <!-- 启用/禁用按钮 -->
                <button @click="toggleEnabled(account)" class="btn btn-small flex-1"
                        :class="account.enabled ? 'btn-secondary' : 'btn-primary'"
                        x-text="t(account.enabled ? 'accounts.disable' : 'accounts.enable')">
                </button>
                <button @click="deleteAccount(account.id)" class="btn btn-danger btn-small" x-text="t('delete')"></button>
              </div>
            </div>
          </template>
          <div x-show="!accounts.length" class="col-span-full empty-state py-12">
            <i data-lucide="git-branch" class="empty-state-icon"></i>
            <p class="text-body text-[var(--apple-text-secondary)]" x-text="t('accounts.noAccounts')"></p>
          </div>
        </div>

        <!-- Add Modal -->
        <div x-show="showAddModal" class="fixed inset-0 modal-backdrop flex items-center justify-center z-40" x-cloak>
          <div class="modal-content p-8 w-full max-w-md" @click.away="closeAddModal()">
            <h3 class="text-title-2 mb-6" x-text="t('accounts.deviceFlow.title')"></h3>
            <div x-show="deviceFlowStep === 'input'">
              <div class="mb-6">
                <label class="block text-sm text-[var(--apple-text-secondary)] mb-2" x-text="t('accounts.label')"></label>
                <input x-model="newLabel" type="text" placeholder="work, personal..." class="input">
              </div>
              <div class="flex justify-end gap-3">
                <button @click="closeAddModal()" class="btn btn-secondary" x-text="t('cancel')"></button>
                <button @click="startDeviceFlow()" class="btn btn-primary" x-text="t('accounts.deviceFlow.step2')"></button>
              </div>
            </div>
            <div x-show="deviceFlowStep === 'pending'" class="text-center py-6">
              <div class="animate-spin h-10 w-10 border-4 border-[var(--apple-blue)] border-t-transparent rounded-full mx-auto mb-6"></div>
              <p class="text-body text-[var(--apple-text-secondary)] mb-4" x-text="t('accounts.deviceFlow.instruction')"></p>
              <a :href="deviceFlowData?.verificationUri" target="_blank" class="text-[var(--apple-blue)] hover:underline text-body" x-text="deviceFlowData?.verificationUri"></a>
              <p class="text-3xl font-mono font-bold my-6 tracking-widest" x-text="deviceFlowData?.userCode"></p>
              <p class="text-caption text-[var(--apple-text-secondary)]" x-text="t('accounts.deviceFlow.waiting')"></p>
            </div>
            <div x-show="deviceFlowStep === 'success'" class="text-center py-6">
              <div class="w-16 h-16 bg-[var(--apple-green)] rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="check" class="w-8 h-8 text-white"></i>
              </div>
              <h4 class="text-title-2 mb-2" x-text="t('accounts.deviceFlow.success')"></h4>
              <button @click="showAddModal = false; load()" class="btn btn-primary mt-4" x-text="t('done')"></button>
            </div>
          </div>
        </div>
      </div>

      <!-- Quota View -->
      <div x-show="currentView === 'quota'" x-data="quotaView()" x-init="init()" style="display: none;">
        <header class="flex justify-between items-center mb-8">
          <h2 class="text-headline" x-text="t('quota.title')"></h2>
          <div class="flex items-center gap-4">
            <button @click="showPricingModal = true" class="btn btn-secondary">
              <i data-lucide="settings" class="w-4 h-4"></i>
              <span x-text="t('quota.modelPricing')"></span>
            </button>
            <button @click="refresh()" class="btn btn-secondary" :class="{ 'opacity-75': refreshing }">
              <i data-lucide="refresh-cw" class="w-4 h-4" :class="{ 'animate-spin': refreshing }"></i>
              <span x-text="t('refresh')"></span>
            </button>
          </div>
        </header>

        <div x-show="loading" class="flex justify-center py-20">
          <div class="animate-spin h-12 w-12 border-4 border-[var(--apple-blue)] border-t-transparent rounded-full"></div>
        </div>

        <div x-show="!loading">
          <!-- Usage Statistics Summary -->
          <div class="mb-8">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-title-2" x-text="t('quota.usageStats')"></h3>
              <!-- Date Range Selector -->
              <div class="flex items-center gap-2">
                <button @click="setRange('today')" class="btn btn-small" :class="dateRange === 'today' ? 'btn-primary' : 'btn-secondary'" x-text="t('quota.today')"></button>
                <button @click="setRange('week')" class="btn btn-small" :class="dateRange === 'week' ? 'btn-primary' : 'btn-secondary'" x-text="t('quota.week')"></button>
                <button @click="setRange('month')" class="btn btn-small" :class="dateRange === 'month' ? 'btn-primary' : 'btn-secondary'" x-text="t('quota.month')"></button>
              </div>
            </div>

            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
              <div class="card p-4">
                <p class="text-sm text-[var(--apple-text-secondary)] mb-1" x-text="t('quota.requests' + dateRange.charAt(0).toUpperCase() + dateRange.slice(1))"></p>
                <p class="text-2xl font-bold" x-text="usageSummary.totals.requests || 0"></p>
              </div>
              <div class="card p-4">
                <p class="text-sm text-[var(--apple-text-secondary)] mb-1" x-text="t('quota.tokens.total')"></p>
                <p class="text-2xl font-bold" x-text="formatTokens(usageSummary.totals.totalTokens || 0)"></p>
              </div>
              <div class="card p-4">
                <p class="text-sm text-[var(--apple-text-secondary)] mb-1">
                  <span x-text="t('quota.tokens.prompt')"></span>
                  <span class="text-xs"> / </span>
                  <span x-text="t('quota.tokens.completion')"></span>
                </p>
                <p class="text-lg font-bold">
                  <span x-text="formatTokens(usageSummary.totals.promptTokens || 0)"></span>
                  <span class="text-sm text-[var(--apple-text-secondary)] mx-1">/</span>
                  <span x-text="formatTokens(usageSummary.totals.completionTokens || 0)"></span>
                </p>
                <p class="text-xs text-[var(--apple-text-tertiary)] mt-1" x-show="(usageSummary.totals.cacheReadTokens || 0) + (usageSummary.totals.cacheWriteTokens || 0) > 0">
                  <span x-text="t('quota.tokens.cacheRead') + ': ' + formatTokens(usageSummary.totals.cacheReadTokens || 0)"></span>
                  <span class="mx-1">·</span>
                  <span x-text="t('quota.tokens.cacheWrite') + ': ' + formatTokens(usageSummary.totals.cacheWriteTokens || 0)"></span>
                </p>
              </div>
              <div class="card p-4">
                <p class="text-sm text-[var(--apple-text-secondary)] mb-1" x-text="t('quota.cost')"></p>
                <p class="text-2xl font-bold" x-text="'$' + (usageSummary.totals.cost || 0).toFixed(4)"></p>
              </div>
            </div>
          </div>

          <!-- Two Column Layout -->
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <!-- Model Usage -->
            <div class="card p-6">
              <div class="flex items-start justify-between gap-4 mb-4">
                <div>
                  <h3 class="text-title-2 mb-1" x-text="t('quota.modelUsage')"></h3>
                  <p class="text-sm text-[var(--apple-text-secondary)]" x-text="t('quota.modelUsageDesc')"></p>
                </div>
                <div class="text-right text-xs text-[var(--apple-text-secondary)]" x-show="usageSummary.totals.totalTokens > 0">
                  <p>
                    <span x-text="t('quota.tokens.total')"></span>
                    <span class="mx-1">·</span>
                    <span x-text="formatTokens(usageSummary.totals.totalTokens || 0)"></span>
                  </p>
                </div>
              </div>
              <div class="space-y-4" x-show="Object.keys(usageSummary.byModel).length">
                <template x-for="([model, data]) in sortedModelUsage" :key="model">
                  <div class="rounded-2xl border border-[var(--apple-gray-5)] p-4 bg-[var(--apple-bg-secondary)]">
                    <div class="flex justify-between items-start gap-3 mb-3">
                      <div>
                        <span class="text-sm font-medium break-all" x-text="model"></span>
                        <p class="text-xs text-[var(--apple-text-secondary)] mt-1">
                          <span x-text="t('quota.modelUsageCount') + ': ' + (data.requests || 0)"></span>
                          <span class="mx-1">·</span>
                          <span x-text="t('quota.modelShare') + ': ' + formatPercent(getModelShare(data.totalTokens))"></span>
                        </p>
                      </div>
                      <div class="text-right shrink-0">
                        <p class="text-sm font-bold" x-text="formatTokens(data.totalTokens)"></p>
                        <p class="text-xs text-[var(--apple-text-secondary)] mt-1">
                          <span x-text="formatTokens(data.promptTokens || 0)"></span>
                          <span class="mx-1">/</span>
                          <span x-text="formatTokens(data.completionTokens || 0)"></span>
                        </p>
                        <p class="text-xs text-[var(--apple-blue)] mt-1" x-text="'$' + (data.cost || 0).toFixed(4)"></p>
                      </div>
                    </div>
                    <div class="progress-bar mb-2">
                      <div class="progress-fill bg-[var(--apple-blue)]"
                           :style="`width: ${getModelShare(data.totalTokens) * 100}%`"></div>
                    </div>
                    <div class="flex flex-wrap gap-3 text-xs text-[var(--apple-text-tertiary)]">
                      <span x-text="t('quota.tokens.prompt') + ': ' + formatTokens(data.promptTokens || 0)"></span>
                      <span x-text="t('quota.tokens.completion') + ': ' + formatTokens(data.completionTokens || 0)"></span>
                      <span x-show="(data.cacheReadTokens || 0) > 0" x-text="t('quota.tokens.cacheRead') + ': ' + formatTokens(data.cacheReadTokens || 0)"></span>
                      <span x-show="(data.cacheWriteTokens || 0) > 0" x-text="t('quota.tokens.cacheWrite') + ': ' + formatTokens(data.cacheWriteTokens || 0)"></span>
                    </div>
                  </div>
                </template>
              </div>
              <div x-show="!Object.keys(usageSummary.byModel).length" class="empty-state">
                <i data-lucide="cpu" class="empty-state-icon"></i>
                <p class="text-body text-[var(--apple-text-secondary)]">暂无模型使用数据</p>
              </div>
            </div>

            <!-- Account Usage -->
            <div class="card p-6">
              <h3 class="text-title-2 mb-4" x-text="t('quota.accountUsage')"></h3>
              <div class="space-y-4" x-show="Object.keys(usageSummary.byAccount).length">
                <template x-for="(data, accountId) in usageSummary.byAccount" :key="accountId">
                  <div class="pb-4 border-b border-[var(--apple-gray-5)] last:border-0 last:pb-0">
                    <div class="flex justify-between items-center mb-2">
                      <span class="font-medium" x-text="data.label"></span>
                      <div class="text-right">
                        <p class="text-sm font-bold" x-text="formatTokens(data.totalTokens)"></p>
                        <p class="text-xs text-[var(--apple-text-secondary)]" x-text="data.requests + ' requests'"></p>
                      </div>
                    </div>
                    <div class="flex justify-between text-xs text-[var(--apple-text-secondary)]">
                      <span x-text="'Prompt: ' + formatTokens(data.promptTokens)"></span>
                      <span x-text="'Completion: ' + formatTokens(data.completionTokens)"></span>
                      <span class="text-[var(--apple-blue)]" x-text="'$' + (data.cost || 0).toFixed(4)"></span>
                    </div>
                    <div class="flex gap-3 text-xs text-[var(--apple-text-tertiary)] mt-1" x-show="(data.cacheReadTokens || 0) + (data.cacheWriteTokens || 0) > 0">
                      <span x-text="t('quota.tokens.cacheRead') + ': ' + formatTokens(data.cacheReadTokens || 0)"></span>
                      <span x-text="t('quota.tokens.cacheWrite') + ': ' + formatTokens(data.cacheWriteTokens || 0)"></span>
                    </div>
                  </div>
                </template>
              </div>
              <div x-show="!Object.keys(usageSummary.byAccount).length" class="empty-state">
                <i data-lucide="git-branch" class="empty-state-icon"></i>
                <p class="text-body text-[var(--apple-text-secondary)]">暂无账户使用数据</p>
              </div>
            </div>
          </div>

          <!-- GitHub Account Quotas (Original Content) -->
          <div class="card p-6">
            <h3 class="text-title-2 mb-2" x-text="t('quota.accountQuotas')"></h3>
            <p class="text-sm text-[var(--apple-text-secondary)] mb-6" x-text="t('quota.accountQuotasDesc')"></p>
            <div class="space-y-6">
              <template x-for="account in accounts" :key="account.id">
                <div class="pb-6 border-b border-[var(--apple-gray-5)] last:border-0 last:pb-0">
                  <div class="flex items-center gap-3 mb-4 flex-wrap">
                    <i data-lucide="git-branch" class="w-5 h-5"></i>
                    <span class="font-medium text-body" x-text="account.label"></span>
                    <!-- 优先级 -->
                    <span class="px-2 py-0.5 text-xs font-medium rounded-full bg-[var(--apple-purple)] text-white">
                      <span x-text="t('accounts.priority') + ': ' + (account.priority ?? 0)"></span>
                    </span>
                    <!-- 启用状态 -->
                    <span class="px-2 py-0.5 text-xs font-medium rounded-full"
                          :class="account.enabled ? 'bg-[var(--apple-green)] text-white' : 'bg-gray-400 text-white'"
                          x-text="t(account.enabled ? 'accounts.status.enabled' : 'accounts.status.disabled')">
                    </span>
                    <!-- 配额耗尽状态 -->
                    <span x-show="account.isExhausted" class="px-2 py-0.5 text-xs font-medium bg-[var(--apple-red)] text-white rounded-full" x-text="t('accounts.status.exhausted')"></span>
                  </div>

                  <!-- Premium Interactions -->
                  <div class="mb-3">
                    <div class="flex justify-between items-center mb-1">
                      <span class="text-sm text-[var(--apple-text-secondary)]" x-text="t('quota.premium')"></span>
                      <span class="text-sm font-medium">
                        <span x-text="account.quotaInfo?.premiumInteractionsRemaining ?? 'N/A'"></span>
                        <span class="text-[var(--apple-text-secondary)]">/ <span x-text="account.quotaInfo?.premiumInteractionsTotal ?? 'N/A'"></span></span>
                      </span>
                    </div>
                    <div class="progress-bar" x-show="account.quotaInfo?.premiumInteractionsTotal">
                      <div class="progress-fill"
                           :class="getUsageColor(account.quotaInfo?.premiumInteractionsRemaining, account.quotaInfo?.premiumInteractionsTotal)"
                           :style="`width: ${(account.quotaInfo?.premiumInteractionsRemaining || 0) / (account.quotaInfo?.premiumInteractionsTotal || 1) * 100}%`"></div>
                    </div>
                  </div>

                  <!-- Chat -->
                  <div class="flex justify-between items-center py-1">
                    <span class="text-sm text-[var(--apple-text-secondary)]" x-text="t('quota.chat')"></span>
                    <span class="text-sm">
                      <span x-text="account.quotaInfo?.unlimited ? t('quota.unlimited') : (account.quotaInfo?.chatRemaining ?? 'N/A')"></span>
                    </span>
                  </div>

                  <!-- Completions -->
                  <div class="flex justify-between items-center py-1">
                    <span class="text-sm text-[var(--apple-text-secondary)]" x-text="t('quota.completions')"></span>
                    <span class="text-sm">
                      <span x-text="account.quotaInfo?.unlimited ? t('quota.unlimited') : (account.quotaInfo?.completionsRemaining ?? 'N/A')"></span>
                    </span>
                  </div>

                  <!-- Account Model Usage -->
                  <div class="mt-4 pt-4 border-t border-[var(--apple-gray-5)]">
                    <h4 class="text-sm font-medium text-[var(--apple-text-secondary)] mb-3" x-text="t('quota.accountModelUsage')"></h4>
                    <div class="space-y-2">
                      <template x-for="(modelData, modelName) in (usageSummary.byAccount[account.id]?.models || {})" :key="modelName">
                        <div class="flex items-center justify-between text-sm">
                          <span class="font-mono text-[var(--apple-blue)]" x-text="modelName"></span>
                          <div class="flex items-center gap-4">
                            <span class="text-[var(--apple-text-secondary)]">
                              <span x-text="modelData.requests"></span>
                              <span class="ml-1" x-text="t('quota.requests')"></span>
                            </span>
                            <span class="w-24 text-right">
                              <span x-text="formatTokens(modelData.totalTokens)"></span>
                            </span>
                            <span class="w-20 text-right text-[var(--apple-text-secondary)]">
                              <span x-text="'$' + (modelData.cost || 0).toFixed(4)"></span>
                            </span>
                          </div>
                        </div>
                      </template>
                      <div x-show="!usageSummary.byAccount[account.id]?.models || Object.keys(usageSummary.byAccount[account.id]?.models || {}).length === 0" class="text-sm text-[var(--apple-text-tertiary)] text-center py-2" x-text="t('quota.noUsageData')"></div>
                    </div>
                  </div>
                </div>
              </template>
              <div x-show="!accounts.length" class="empty-state">
                <i data-lucide="git-branch" class="empty-state-icon"></i>
                <p class="text-body text-[var(--apple-text-secondary)]" x-text="t('accounts.noAccounts')"></p>
              </div>
            </div>
          </div>

          <!-- Usage Trend Chart -->
          <div class="card p-6 mt-8">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h3 class="text-title-2 mb-1" x-text="t('quota.usageTrend')"></h3>
                <p class="text-sm text-[var(--apple-text-secondary)]" x-text="t('quota.usageTrendDesc')"></p>
              </div>
            </div>
            <div class="relative h-80">
              <canvas id="usageTrendChart"></canvas>
            </div>
          </div>
        </div>

        <!-- Model Pricing Modal -->
        <div x-show="showPricingModal" class="fixed inset-0 modal-backdrop flex items-center justify-center z-50" x-cloak>
          <div class="modal-content p-0 w-full max-w-6xl max-h-[85vh] overflow-hidden flex flex-col" @click.away="showPricingModal = false">
            <!-- Header -->
            <div class="flex justify-between items-center p-6 border-b border-[var(--apple-gray-5)] bg-gradient-to-r from-[var(--apple-bg-secondary)] to-[var(--apple-bg)]">
              <div>
                <h3 class="text-title-2 mb-1" x-text="t('quota.modelPricing')"></h3>
                <p class="text-sm text-[var(--apple-text-secondary)]">配置每个模型的价格（每 1M tokens，USD）</p>
              </div>
              <button @click="showPricingModal = false" class="text-[var(--apple-text-secondary)] hover:text-[var(--apple-text)] transition-colors p-2 hover:bg-[var(--apple-gray-3)] rounded-lg">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>
            
            <!-- Scrollable Content -->
            <div class="overflow-y-auto flex-1 p-6">
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <template x-for="(price, model) in modelPrices" :key="model">
                  <div class="bg-[var(--apple-bg-secondary)] rounded-xl p-4 border border-[var(--apple-gray-5)] hover:border-[var(--apple-blue)] transition-colors">
                    <!-- Model Name -->
                    <div class="flex items-start justify-between mb-3">
                      <h4 class="font-medium text-sm text-[var(--apple-text)] truncate flex-1 mr-2" :title="model" x-text="model"></h4>
                      <button @click="saveModelPricing(model)" class="btn btn-primary btn-small px-3 py-1 text-xs shrink-0">
                        <i data-lucide="check" class="w-3.5 h-3.5 mr-1"></i>
                        保存
                      </button>
                    </div>
                    
                    <!-- Price Inputs Grid -->
                    <div class="grid grid-cols-2 gap-3">
                      <div>
                        <label class="block text-xs text-[var(--apple-text-secondary)] mb-1">Prompt <span class="text-[10px] opacity-70">($/1M)</span></label>
                        <div class="relative">
                          <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-xs text-[var(--apple-text-tertiary)]">$</span>
                          <input type="number" step="0.01" x-model="price.promptPricePer1m" 
                                 class="input w-full pl-5 py-1.5 text-sm text-right" placeholder="0.00">
                        </div>
                      </div>
                      <div>
                        <label class="block text-xs text-[var(--apple-text-secondary)] mb-1">Completion <span class="text-[10px] opacity-70">($/1M)</span></label>
                        <div class="relative">
                          <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-xs text-[var(--apple-text-tertiary)]">$</span>
                          <input type="number" step="0.01" x-model="price.completionPricePer1m" 
                                 class="input w-full pl-5 py-1.5 text-sm text-right" placeholder="0.00">
                        </div>
                      </div>
                      <div>
                        <label class="block text-xs text-[var(--apple-text-secondary)] mb-1">缓存读取 <span class="text-[10px] opacity-70">($/1M)</span></label>
                        <div class="relative">
                          <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-xs text-[var(--apple-text-tertiary)]">$</span>
                          <input type="number" step="0.01" x-model="price.cacheReadPricePer1m" 
                                 class="input w-full pl-5 py-1.5 text-sm text-right" placeholder="0.00">
                        </div>
                      </div>
                      <div>
                        <label class="block text-xs text-[var(--apple-text-secondary)] mb-1">缓存写入 <span class="text-[10px] opacity-70">($/1M)</span></label>
                        <div class="relative">
                          <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-xs text-[var(--apple-text-tertiary)]">$</span>
                          <input type="number" step="0.01" x-model="price.cacheWritePricePer1m" 
                                 class="input w-full pl-5 py-1.5 text-sm text-right" placeholder="0.00">
                        </div>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
              
              <div x-show="Object.keys(modelPrices).length === 0" class="empty-state py-16">
                <i data-lucide="cpu" class="empty-state-icon"></i>
                <p class="text-body text-[var(--apple-text-secondary)] mt-3">暂无模型价格配置</p>
              </div>
            </div>

            <!-- Footer -->
            <div class="flex justify-end gap-3 p-4 border-t border-[var(--apple-gray-5)] bg-[var(--apple-bg-secondary)]">
              <button @click="showPricingModal = false" class="btn btn-secondary px-6" x-text="t('close')"></button>
            </div>
          </div>
        </div>
      </div>

      <!-- Logs View -->
      <div x-show="currentView === 'logs'" x-data="logsView()" x-init="init(); load()" style="display: none;">
        <header class="flex justify-between items-center mb-8">
          <h2 class="text-headline" x-text="t('logs.title')"></h2>
          <div class="flex items-center gap-4">
            <button @click="autoRefresh = !autoRefresh" class="btn" :class="autoRefresh ? 'btn-primary' : 'btn-secondary'">
              <i data-lucide="clock" class="w-4 h-4 mr-1"></i>
              <span x-text="autoRefresh ? t('logs.autoRefreshOn') : t('logs.autoRefreshOff')"></span>
            </button>
            <button @click="load()" class="btn btn-secondary" :class="{ 'opacity-75': loading }">
              <i data-lucide="refresh-cw" class="w-4 h-4" :class="{ 'animate-spin': loading }"></i>
            </button>
          </div>
        </header>

        <!-- Filters -->
        <div class="card p-4 mb-6 flex flex-wrap gap-4 items-center">
          <select x-model="filters.level" @change="filters.offset = 0; load()" class="input w-32">
            <option value="" x-text="t('logs.allLevels')"></option>
            <option value="debug">Debug</option>
            <option value="info">Info</option>
            <option value="warn">Warn</option>
            <option value="error">Error</option>
          </select>
          <input x-model="filters.search" @keyup.enter="filters.offset = 0; load()" type="text" :placeholder="t('logs.search')" class="input flex-1 min-w-[200px]">
          <button @click="filters = { level: '', search: '', limit: 50, offset: 0 }; load()" class="btn btn-secondary" x-text="t('logs.clearFilters')"></button>
        </div>

        <div x-show="loading" class="flex justify-center py-20">
          <div class="animate-spin h-12 w-12 border-4 border-[var(--apple-blue)] border-t-transparent rounded-full"></div>
        </div>

        <div x-show="!loading" class="card overflow-hidden">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-[var(--apple-gray-5)] bg-[var(--apple-bg-secondary)]">
                <th class="text-left p-3" x-text="t('logs.time')"></th>
                <th class="text-left p-3" x-text="t('logs.level')"></th>
                <th class="text-left p-3" x-text="t('logs.path')"></th>
                <th class="text-left p-3" x-text="t('logs.user')"></th>
                <th class="text-left p-3" x-text="t('logs.model')"></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="log in entries" :key="log.id">
                <tr class="border-b border-[var(--apple-gray-5)] last:border-0 hover:bg-[var(--apple-bg-secondary)]">
                  <td class="p-3 text-[var(--apple-text-secondary)]" x-text="formatTime(log.timestamp)"></td>
                  <td class="p-3">
                    <span class="badge" :class="getLevelClass(log.level)" x-text="log.level"></span>
                  </td>
                  <td class="p-3 font-mono" x-text="log.path"></td>
                  <td class="p-3" x-text="log.username || '-'"></td>
                  <td class="p-3" x-text="log.model || '-'"></td>
                </tr>
              </template>
            </tbody>
          </table>
          <div x-show="!entries.length" class="empty-state py-12">
            <i data-lucide="scroll-text" class="empty-state-icon"></i>
            <p class="text-body text-[var(--apple-text-secondary)]" x-text="t('logs.noLogs')"></p>
          </div>
        </div>

        <!-- Pagination -->
        <div class="flex justify-between items-center mt-6" x-show="total > 0">
          <span class="text-body text-[var(--apple-text-secondary)]" x-text="`${filters.offset + 1} - ${Math.min(filters.offset + filters.limit, total)} of ${total}`"></span>
          <div class="flex gap-3">
            <button @click="prevPage()" :disabled="filters.offset === 0" class="btn btn-secondary btn-small" :class="{ 'opacity-50': filters.offset === 0 }" x-text="t('logs.previous')"></button>
            <button @click="nextPage()" :disabled="filters.offset + filters.limit >= total" class="btn btn-secondary btn-small" :class="{ 'opacity-50': filters.offset + filters.limit >= total }" x-text="t('logs.next')"></button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Main Admin App
    function adminApp() {
      return {
        currentView: 'dashboard',
        initialized: false,
        toasts: [],
        lang: I18n.currentLang(),
        sidebarOpen: false,

        async init() {
          // Restore view from URL hash or default to dashboard
          const hash = window.location.hash.slice(1);
          if (hash && ['dashboard', 'accounts', 'quota', 'logs'].includes(hash)) {
            this.currentView = hash;
          }
          
          await this.checkAuth();
          this.initialized = true;
          lucide.createIcons();
          // Refresh quotas in background after login
          this.refreshQuotaInBackground();
          
          // Listen for hash changes
          window.addEventListener('hashchange', () => {
            const hash = window.location.hash.slice(1);
            if (hash && ['dashboard', 'accounts', 'quota', 'logs'].includes(hash)) {
              this.currentView = hash;
            }
          });

    function accountsView() {
      return {
        loading: false,
        accounts: [],
        showAddModal: false,
        newLabel: '',
        deviceFlowStep: 'input',
        deviceFlowData: null,
        pollTimer: null,
        editingLabel: null,
        editLabelValue: '',

        async load() {
          this.loading = true;
          try {
            const data = await API.accounts.list();
            this.accounts = data.accounts || [];
          } catch (e) {
            this.showToast(I18n.t('error.load'), 'error');
          } finally {
            this.loading = false;
            this.$nextTick(() => lucide.createIcons());
          }
        },

        startEditLabel(account) {
          this.editingLabel = account.id;
          this.editLabelValue = account.label;
          this.$nextTick(() => {
            const input = this.$refs.labelInput;
            if (input) input.focus();
          });
        },

        async saveLabel(account) {
          if (!this.editLabelValue.trim()) {
            this.editingLabel = null;
            return;
          }
          try {
            await API.accounts.update(account.id, { label: this.editLabelValue.trim() });
            this.showToast(I18n.t('accounts.updateSuccess') || 'Account name updated', 'success');
            await this.load();
          } catch (e) {
            this.showToast(I18n.t('error.update'), 'error');
          } finally {
            this.editingLabel = null;
          }
        },

        openAddModal() {
          this.newLabel = '';
          this.deviceFlowStep = 'input';
          this.deviceFlowData = null;
          this.showAddModal = true;
          if (this.pollTimer) clearTimeout(this.pollTimer);
          this.pollTimer = null;
        },

        closeAddModal() {
          this.showAddModal = false;
          this.deviceFlowStep = 'input';
          if (this.pollTimer) {
            clearTimeout(this.pollTimer);
            this.pollTimer = null;
          }
        },

        async startDeviceFlow() {
          this.pollTimer = null;
          try {
            const res = await API.accounts.create(this.newLabel);
            this.deviceFlowData = res;
            this.deviceFlowStep = 'pending';
            this.pollDeviceFlow();
          } catch (e) {
            this.showToast(I18n.t('error.create'), 'error');
          }
        },

        pollDeviceFlow() {
          let pollInterval = this.deviceFlowData.interval * 1000 || 5000;

          const doPoll = async () => {
            if (this.deviceFlowStep !== 'pending') {
              return;
            }
            try {
              const res = await API.accounts.poll(this.deviceFlowData.deviceCode);
              if (res.status === 'complete') {
                this.deviceFlowStep = 'success';
                // Refresh accounts list to show the new account
                await this.load();
                return;
              }
              if (res.status === 'expired') {
                this.deviceFlowStep = 'input';
                this.showToast(I18n.t('accounts.deviceFlow.expired') || 'Device flow expired. Please try again.', 'error');
                return;
              }
              // Update interval if server asks for slow_down
              if (res.interval) {
                pollInterval = res.interval * 1000;
              }
            } catch (e) {
              // Continue polling
            }
            // Schedule next poll with current interval
            this.pollTimer = setTimeout(doPoll, pollInterval);
          };

          this.pollTimer = setTimeout(doPoll, pollInterval);
        },

        async toggleEnabled(account) {
          try {
            await API.accounts.update(account.id, { enabled: !account.enabled });
            this.showToast(
              account.enabled
                ? I18n.t('accounts.disableSuccess')
                : I18n.t('accounts.enableSuccess'),
              'success'
            );
            await this.load();
          } catch (e) {
            this.showToast(I18n.t('error.update'), 'error');
          }
        },

        async savePriority(account) {
          const priority = Math.max(0, Math.min(100, account.priority ?? 0));
          try {
            await API.accounts.update(account.id, { priority });
            this.showToast(I18n.t('accounts.prioritySuccess') || 'Priority updated', 'success');
          } catch (e) {
            this.showToast(I18n.t('error.update'), 'error');
          }
        },

        async decreasePriority(account) {
          const newPriority = Math.max(0, (account.priority ?? 0) - 1);
          account.priority = newPriority;
          await this.savePriority(account);
        },

        async increasePriority(account) {
          const newPriority = Math.min(100, (account.priority ?? 0) + 1);
          account.priority = newPriority;
          await this.savePriority(account);
        },

        async deleteAccount(id) {
          if (!confirm(I18n.t('accounts.confirmDelete'))) return;
          try {
            await API.accounts.delete(id);
            this.showToast(I18n.t('accounts.deleteSuccess'), 'success');
            await this.load();
          } catch (e) {
            this.showToast(I18n.t('error.delete'), 'error');
          }
        },

        showToast(msg, type) {
          const app = document.querySelector('[x-data^=adminApp]');
          if (app) Alpine.$data(app).showToast(msg, type);
        },
        t(key, params) {
          // Access parent lang to establish reactive dependency
          const app = document.querySelector('[x-data^=adminApp]');
          if (app) void Alpine.$data(app).lang;
          return I18n.t(key, params);
        }
      };
    }

    // Quota View Component
    function quotaView() {
      return {
        loading: false,
        refreshing: false,
        accounts: [],
        users: [],
        dateRange: 'today',
        showPricingModal: false,
        modelPrices: {},
        usageSummary: {
          totals: {
            requests: 0,
            promptTokens: 0,
            completionTokens: 0,
            totalTokens: 0,
            cost: 0,
          },
          byAccount: {},
          byModel: {},
          timeSeries: [],
        },
        usageChart: null,
        chartRenderRetries: 0,
        maxChartRenderRetries: 10,

        init() {
          // Initial load
          this.load();
          // Reload when view becomes active (switched back to quota)
          const app = document.querySelector('[x-data^=adminApp]');
          if (app) {
            Alpine.$data(app).$watch('currentView', (view) => {
              if (view === 'quota') {
                this.load();
              } else {
                // Destroy chart when leaving quota view to prevent canvas errors
                this.destroyChart();
              }
            });
          }
        },

        destroyChart() {
          if (this.usageChart) {
            this.usageChart.destroy();
            this.usageChart = null;
          }
        },

        setRange(range) {
          this.dateRange = range;
          this.loadUsageStats().then(() => {
            this.$nextTick(() => this.renderChart());
          });
        },

        async load() {
          this.loading = true;
          try {
            const data = await API.quota.get();
            this.accounts = data.accounts || [];
            this.users = data.users || [];
            await this.loadUsageStats();
            await this.loadModelPricing();
          } catch (e) {
            this.showToast(I18n.t('error.load'), 'error');
          } finally {
            this.loading = false;
            this.$nextTick(() => {
              lucide.createIcons();
              this.renderChart();
            });
          }
        },

        async loadModelPricing() {
          try {
            const data = await API.usage.getPricing();
            // Convert from $/1K to $/1M for display (multiply by 1000)
            this.modelPrices = {};
            for (const [model, price] of Object.entries(data.pricing || {})) {
              this.modelPrices[model] = {
                promptPricePer1m: price.promptPricePer1k * 1000,
                completionPricePer1m: price.completionPricePer1k * 1000,
                cacheReadPricePer1m: price.cacheReadPricePer1k * 1000,
                cacheWritePricePer1m: price.cacheWritePricePer1k * 1000,
              };
            }
          } catch (e) {
            console.error('Failed to load model pricing:', e);
          }
        },

        async saveModelPricing(model) {
          try {
            const price = this.modelPrices[model];
            // Convert from $/1M to $/1K for storage (divide by 1000)
            await API.usage.updatePricing(model, {
              promptPricePer1k: (parseFloat(price.promptPricePer1m) || 0) / 1000,
              completionPricePer1k: (parseFloat(price.completionPricePer1m) || 0) / 1000,
              cacheReadPricePer1k: (parseFloat(price.cacheReadPricePer1m) || 0) / 1000,
              cacheWritePricePer1k: (parseFloat(price.cacheWritePricePer1m) || 0) / 1000,
            });
            this.showToast('模型价格已保存', 'success');
          } catch (e) {
            this.showToast('保存失败：' + e.message, 'error');
          }
        },

        async loadUsageStats() {
          try {
            const data = await API.usage.summary(this.dateRange);
            this.usageSummary = data;
          } catch (e) {
            console.error('Failed to load usage stats:', e);
          }
        },

        renderChart() {
          // Check if Chart.js is loaded
          if (typeof Chart === 'undefined') {
            console.warn('Chart.js not loaded');
            return;
          }

          const canvas = document.getElementById('usageTrendChart');
          if (!canvas) {
            if (this.chartRenderRetries < this.maxChartRenderRetries) {
              this.chartRenderRetries++;
              console.warn(`Canvas element not found, retrying... (${this.chartRenderRetries}/${this.maxChartRenderRetries})`);
              setTimeout(() => this.renderChart(), 100);
            } else {
              console.error('Max retries reached for canvas element');
            }
            return;
          }

          // Check if canvas is visible (not hidden by x-show)
          if (canvas.offsetParent === null) {
            if (this.chartRenderRetries < this.maxChartRenderRetries) {
              this.chartRenderRetries++;
              console.warn(`Canvas element not visible, retrying... (${this.chartRenderRetries}/${this.maxChartRenderRetries})`);
              setTimeout(() => this.renderChart(), 100);
            } else {
              console.error('Max retries reached for canvas visibility');
            }
            return;
          }

          const ctx = canvas.getContext('2d');
          if (!ctx) {
            console.warn('Failed to get canvas context');
            return;
          }

          // Reset retry counter on successful render
          this.chartRenderRetries = 0;

          // Destroy existing chart if any
          if (this.usageChart) {
            this.usageChart.destroy();
            this.usageChart = null;
          }

          const isToday = this.dateRange === 'today';
          const intervalSeries = this.usageSummary.intervalSeries || [];
          const timeSeries = this.usageSummary.timeSeries || [];

          // For today, prefer 15-min interval series; otherwise fall back to daily
          const useInterval = isToday && intervalSeries.length > 0;
          const hasDailyData = timeSeries.length > 0;
          if (!useInterval && !hasDailyData) return;

          // Get CSS variables for colors
          const root = getComputedStyle(document.documentElement);
          const blueColor = root.getPropertyValue('--apple-blue')?.trim() || '#007AFF';
          const greenColor = root.getPropertyValue('--apple-green')?.trim() || '#34C759';
          const orangeColor = root.getPropertyValue('--apple-orange')?.trim() || '#FF9500';
          const purpleColor = root.getPropertyValue('--apple-purple')?.trim() || '#AF52DE';
          const pinkColor = root.getPropertyValue('--apple-pink')?.trim() || '#FF2D55';
          const redColor = root.getPropertyValue('--apple-red')?.trim() || '#FF3B30';
          const textColor = root.getPropertyValue('--apple-text')?.trim() || '#1D1D1F';
          const textSecondaryColor = root.getPropertyValue('--apple-text-secondary')?.trim() || '#86868B';
          const palette = [blueColor, greenColor, orangeColor, purpleColor, pinkColor, redColor];

          let labels, sortedData;
          if (useInterval) {
            // 15-min slots: sort by slotTs, format as HH:MM
            sortedData = [...intervalSeries].sort((a, b) => a.slotTs - b.slotTs);
            labels = sortedData.map(d => {
              const date = new Date(d.slotTs);
              const hh = String(date.getHours()).padStart(2, '0');
              const mm = String(date.getMinutes()).padStart(2, '0');
              return `${hh}:${mm}`;
            });
          } else {
            // Daily: sort by date ascending
            sortedData = [...timeSeries].sort((a, b) => a.date.localeCompare(b.date));
            labels = sortedData.map(d => {
              const parts = d.date.split('-');
              return `${parseInt(parts[1], 10)}/${parseInt(parts[2], 10)}`;
            });
          }

          const datasets = [
            {
              label: this.t('quota.tokens.total'),
              data: sortedData.map(d => d.totalTokens),
              borderColor: blueColor,
              backgroundColor: blueColor + '20',
              fill: true,
              tension: 0.35,
              pointRadius: 3,
              pointHoverRadius: 5,
              borderWidth: 2,
            }
          ];

          for (const [index, [model]] of this.sortedModelUsage.entries()) {
            const color = palette[index % palette.length];
            datasets.push({
              label: `${model}`,
              data: sortedData.map(d => d.models?.[model]?.totalTokens || 0),
              borderColor: color,
              backgroundColor: 'transparent',
              fill: false,
              tension: 0.35,
              pointRadius: 2,
              pointHoverRadius: 4,
              borderWidth: 2,
            });
          }

          this.usageChart = new Chart(ctx, {
            type: 'line',
            data: {
              labels,
              datasets,
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              interaction: {
                mode: 'index',
                intersect: false,
              },
              plugins: {
                legend: {
                  position: 'top',
                  labels: {
                    color: textColor,
                    usePointStyle: true,
                    padding: 16,
                    boxWidth: 10,
                    boxHeight: 10,
                  }
                },
                tooltip: {
                  backgroundColor: 'rgba(0,0,0,0.82)',
                  titleColor: '#fff',
                  bodyColor: '#fff',
                  padding: 12,
                  cornerRadius: 10,
                  callbacks: {
                    label: (context) => {
                      let label = context.dataset.label || '';
                      if (label) label += ': ';
                      label += this.formatTokens(context.raw || 0);
                      return label;
                    }
                  }
                }
              },
              scales: {
                x: {
                  ticks: {
                    color: textSecondaryColor,
                  },
                  grid: {
                    color: 'rgba(0,0,0,0.05)',
                  }
                },
                y: {
                  type: 'linear',
                  display: true,
                  position: 'left',
                  ticks: {
                    color: textSecondaryColor,
                    callback: (value) => this.formatTokens(value),
                  },
                  grid: {
                    color: 'rgba(0,0,0,0.05)',
                  }
                }
              }
            }
          });
        },

        get sortedModelUsage() {
          return Object.entries(this.usageSummary.byModel || {}).sort(([, left], [, right]) => {
            return (right.totalTokens || 0) - (left.totalTokens || 0);
          });
        },

        getModelShare(tokens) {
          const totalTokens = this.usageSummary?.totals?.totalTokens || 0;
          if (!totalTokens) return 0;
          return Math.min(tokens / totalTokens, 1);
        },

        async refresh() {
          this.refreshing = true;
          try {
            await API.quota.refresh();
            this.showToast(I18n.t('quota.refreshSuccess'), 'success');
            await this.load();
          } catch (e) {
            this.showToast(I18n.t('quota.refreshError'), 'error');
          } finally {
            this.refreshing = false;
          }
        },

        calculatePercent(remaining, total) {
          if (!total) return 0;
          return Math.min(((total - (remaining || 0)) / total * 100), 100);
        },

        getUsageColor(remaining, limit) {
          if (!limit) return 'bg-[var(--apple-green)]';
          const pct = (remaining || 0) / limit;
          if (pct < 0.2) return 'bg-[var(--apple-red)]';
          if (pct < 0.5) return 'bg-[var(--apple-orange)]';
          return 'bg-[var(--apple-green)]';
        },

        formatPercent(value) {
          return (value * 100).toFixed(1) + '%';
        },

        // Format token count with appropriate unit (K, M, or raw)
        formatTokens(tokens) {
          const numericTokens = Number(tokens || 0);
          if (numericTokens === 0) return '0';
          if (numericTokens >= 1000000) {
            return (numericTokens / 1000000).toFixed(1) + 'M';
          }
          if (numericTokens >= 1000) {
            return (numericTokens / 1000).toFixed(1) + 'K';
          }
          return numericTokens.toString();
        },

        showToast(msg, type) {
          const app = document.querySelector('[x-data^=adminApp]');
          if (app) Alpine.$data(app).showToast(msg, type);
        },
        t(key, params) {
          // Access parent lang to establish reactive dependency
          const app = document.querySelector('[x-data^=adminApp]');
          if (app) void Alpine.$data(app).lang;
          return I18n.t(key, params);
        }
      };
    }

          if (!ts) return '-';
          const app = document.querySelector('[x-data^=adminApp]');
          return app ? Alpine.$data(app).formatTime(ts) : new Date(ts).toLocaleString();
        },
        t(key, params) {
          // Access parent lang to establish reactive dependency
          const app = document.querySelector('[x-data^=adminApp]');
          if (app) void Alpine.$data(app).lang;
          return I18n.t(key, params);
        }
      };
    }
  </script>
</body>
</html>
