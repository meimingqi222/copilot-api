              <button class="btn btn-small" :class="filter === 'suspicious' ? 'btn-primary' : 'btn-secondary'" @click="filter = 'suspicious'">
                <span x-text="t('guard.filter.suspicious')"></span>
              </button>
              <button class="btn btn-small" :class="filter === 'blocked' ? 'btn-primary' : 'btn-secondary'" @click="filter = 'blocked'">
                <span x-text="t('guard.filter.blocked')"></span>
              </button>
              <button class="btn btn-small" :class="filter === 'recommended' ? 'btn-primary' : 'btn-secondary'" @click="filter = 'recommended'">
                <span x-text="t('guard.filter.recommended')"></span>
              </button>
            </div>
          </div>
        </div>

        <!-- Loading -->
        <div x-show="loading" class="text-center py-12">
          <div class="loading-spinner mx-auto mb-4"></div>
        </div>

        <!-- Clients table (IP / UA) -->
        <div x-show="!loading && (tab === 'ip' || tab === 'ua')" class="card overflow-x-auto">
          <table class="w-full text-sm min-w-[1100px]">
            <thead>
              <tr class="border-b border-[var(--apple-gray-5)] bg-[var(--apple-bg-secondary)]">
                <th class="text-left p-3 w-[180px]" x-text="t('guard.risk')"></th>
                <th class="text-left p-3 min-w-[240px]" x-text="tab === 'ip' ? 'IP' : 'User-Agent'"></th>
                <th class="text-left p-3 min-w-[180px]" x-text="t('guard.traffic')"></th>
                <th class="text-left p-3 min-w-[260px]" x-text="t('guard.signals')"></th>
                <th class="text-left p-3 min-w-[200px]" x-text="t('guard.users')"></th>
                <th class="text-left p-3 min-w-[160px]" x-text="t('guard.lastSeen')"></th>
                <th class="text-left p-3 min-w-[140px]" x-text="t('guard.actions')"></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="client in filteredClients" :key="client.key">
                <tr class="border-b border-[var(--apple-gray-5)] last:border-0 hover:bg-[var(--apple-bg-secondary)]"
                    :class="{ 'opacity-70': client.blocked, 'bg-red-50 dark:bg-red-950/20': client.riskLevel === 'critical' && !client.blocked }">
                  <td class="p-3">
                    <div class="flex flex-col gap-2">
                      <div class="flex items-center gap-2">
                        <span class="badge" :class="riskBadgeClass(client.riskLevel)" x-text="t('guard.risk.' + client.riskLevel)"></span>
                        <span class="text-xs font-medium text-[var(--apple-text-secondary)]">
                          <span x-text="t('guard.score')"></span>
                          <span class="ml-1" x-text="client.suspiciousScore"></span>
                        </span>
                      </div>
                      <div class="text-xs" :class="client.recommendedAction === 'temporary_block' ? 'text-[var(--apple-red)] font-medium' : 'text-[var(--apple-text-secondary)]'" x-text="t('guard.action.' + client.recommendedAction)"></div>
                    </div>
                  </td>
                  <td class="p-3">
                    <div class="font-mono text-xs break-all leading-5" x-text="client.key"></div>
                    <div class="mt-2">
                      <div class="text-caption text-[var(--apple-text-tertiary)] mb-1" x-text="t('guard.topPaths')"></div>
                      <div class="flex flex-wrap gap-1.5">
                        <template x-for="path in client.topPaths" :key="path.path">
                          <span class="badge bg-[var(--apple-gray-6)] text-[var(--apple-text-secondary)] normal-case text-[10px]">
                            <span x-text="path.path"></span>
                            <span class="ml-1" x-text="'×' + path.count"></span>
                          </span>
                        </template>
                      </div>
                    </div>
                    <details class="mt-3" x-show="client.flaggedRequests?.length">
                      <summary class="text-caption text-[var(--apple-blue)] cursor-pointer" x-text="t('guard.requestSamples')"></summary>
                      <div class="space-y-2 mt-2">
                        <template x-for="sample in client.flaggedRequests || []" :key="sample.at + sample.path">
                          <div class="rounded-xl bg-[var(--apple-gray-6)] p-3">
                            <div class="text-caption text-[var(--apple-text-secondary)] mb-1">
                              <span x-text="sample.path"></span>
                              <span class="mx-1">·</span>
                              <span x-text="sample.statusCode || '-'"></span>
                              <span class="mx-1">·</span>
                              <span x-text="formatTime(sample.at)"></span>
                            </div>
                            <pre class="font-mono text-[10px] leading-4 whitespace-pre-wrap break-all" x-text="sample.preview"></pre>
                          </div>
                        </template>
                      </div>
                    </details>
                  </td>
                  <td class="p-3">
                    <div class="space-y-2 text-xs">
                      <div class="flex items-center justify-between gap-3">
                        <span class="text-[var(--apple-text-secondary)]" x-text="t('guard.requests')"></span>
                        <span class="font-medium" x-text="client.requests"></span>
                      </div>
                      <div class="flex items-center justify-between gap-3">
                        <span class="text-[var(--apple-text-secondary)]" x-text="t('guard.errors')"></span>
                        <span :class="client.errors > 0 ? 'text-[var(--apple-red)] font-medium' : ''" x-text="client.errors + ' (' + formatPercent(client.errorRate) + ')'"></span>
                      </div>
                      <div class="flex items-center justify-between gap-3">
                        <span class="text-[var(--apple-text-secondary)]" x-text="t('guard.recentWindow')"></span>
                        <span x-text="client.recentRequests"></span>
                      </div>
                      <div class="flex items-center justify-between gap-3">
                        <span class="text-[var(--apple-text-secondary)]" x-text="t('guard.recentBurst')"></span>
                        <span :class="client.burstRequests >= 20 ? 'text-[var(--apple-red)] font-medium' : ''" x-text="client.burstRequests"></span>
                      </div>
                    </div>
                  </td>
                  <td class="p-3">
                    <div class="flex flex-wrap gap-1.5 mb-2" x-show="client.suspiciousReasons.length">
                      <template x-for="reason in client.suspiciousReasons" :key="reason">
                        <span class="badge normal-case text-[10px]" :class="signalBadgeClass(reason)" x-text="t('guard.reason.' + reason)"></span>
                      </template>
                    </div>
                    <div x-show="!client.suspiciousReasons.length" class="text-xs text-[var(--apple-text-secondary)]" x-text="t('guard.noSignals')"></div>
                    <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-xs mt-2">
                      <div class="text-[var(--apple-text-secondary)]" x-text="t('guard.authFailures')"></div>
                      <div x-text="client.authFailures"></div>
                      <div class="text-[var(--apple-text-secondary)]" x-text="t('guard.notFounds')"></div>
                      <div x-text="client.notFounds"></div>
                    </div>
                  </td>
                  <td class="p-3">
                    <div class="text-xs leading-5">
                      <div class="mb-2" x-show="client.usernames.length">
                        <span class="text-[var(--apple-text-secondary)] mr-1">Users:</span>
                        <span class="font-medium" x-text="client.usernames.join(', ')"></span>
                      </div>
                      <div class="text-[var(--apple-text-secondary)]">
                        <span x-text="t('guard.initiator')"></span>
                        <span class="mx-1">·</span>
                        <span :class="client.userInitiatorCount > 0 && client.agentInitiatorCount === 0 ? 'text-[var(--apple-red)] font-medium' : ''" x-text="'U:' + client.userInitiatorCount"></span>
                        <span class="mx-1">/</span>
                        <span :class="client.agentInitiatorCount > 0 ? 'text-[var(--apple-green)] font-medium' : ''" x-text="'A:' + client.agentInitiatorCount"></span>
                      </div>
                    </div>
                  </td>
                  <td class="p-3">
                    <div class="text-xs" x-text="formatTime(client.lastSeenAt)"></div>
                    <div class="text-caption text-[var(--apple-text-secondary)] mt-1">
                      <span x-text="t('guard.firstSeen')"></span>
                      <span class="mx-1">·</span>
                      <span x-text="formatTime(client.firstSeenAt)"></span>
                    </div>
                  </td>
                  <td class="p-3 text-right whitespace-nowrap">
                    <template x-if="client.blocked">
                      <span class="badge bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400" x-text="t('guard.blocked')"></span>
                    </template>
                    <template x-if="!client.blocked">
                      <button class="btn text-xs px-3 py-2 min-h-[36px]" :class="client.recommendedAction === 'temporary_block' ? 'btn-danger' : 'btn-secondary'" @click="openBlockModal(client)">
                        <i data-lucide="ban" class="w-3 h-3 mr-1"></i>
                        <span x-text="t('guard.block')"></span>
                      </button>
                    </template>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
          <div x-show="!filteredClients.length" class="empty-state py-12">
            <i data-lucide="shield" class="empty-state-icon"></i>
            <p class="text-body text-[var(--apple-text-secondary)]" x-text="t('guard.noClients')"></p>
          </div>
        </div>

        <!-- Blacklist table -->
        <div x-show="!loading && tab === 'blacklist'" class="card overflow-x-auto">
          <table class="w-full text-sm min-w-[860px]">
            <thead>
              <tr class="border-b border-[var(--apple-gray-5)] bg-[var(--apple-bg-secondary)]">
                <th class="text-left p-3" x-text="t('guard.type')"></th>
                <th class="text-left p-3" x-text="t('guard.value')"></th>
                <th class="text-left p-3" x-text="t('guard.source')"></th>
                <th class="text-left p-3" x-text="t('guard.reason')"></th>
                <th class="text-left p-3" x-text="t('guard.expiresAt')"></th>
                <th class="text-left p-3" x-text="t('guard.createdAt')"></th>
                <th class="text-left p-3"></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="entry in blacklist" :key="entry.value + entry.type">
                <tr class="border-b border-[var(--apple-gray-5)] last:border-0 hover:bg-[var(--apple-bg-secondary)]">
                  <td class="p-3">
                    <span class="badge" :class="entry.type === 'ip' ? 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400' : 'bg-purple-100 text-purple-700 dark:bg-purple-900/30 dark:text-purple-400'" x-text="entry.type.toUpperCase()"></span>
                  </td>
                  <td class="p-3 font-mono text-xs" x-text="entry.value"></td>
                  <td class="p-3">
                    <span class="badge normal-case" :class="entry.source === 'auto' ? 'badge-warning' : 'badge-info'" x-text="t('guard.source.' + (entry.source || 'manual'))"></span>
                  </td>
                  <td class="p-3 text-xs text-[var(--apple-text-secondary)]">
                    <div x-text="entry.reason || '-'"></div>
                    <div class="flex flex-wrap gap-1 mt-2" x-show="entry.triggerReasons?.length">
                      <template x-for="reason in entry.triggerReasons || []" :key="reason">
                        <span class="badge normal-case text-[10px]" :class="signalBadgeClass(reason)" x-text="t('guard.reason.' + reason)"></span>
                      </template>
                    </div>
                  </td>
                  <td class="p-3 text-xs text-[var(--apple-text-secondary)]" x-text="formatExpiry(entry.expiresAt)"></td>
                  <td class="p-3 text-xs text-[var(--apple-text-secondary)]" x-text="formatTime(entry.createdAt)"></td>
                  <td class="p-3 text-right">
                    <button class="btn btn-secondary text-xs px-3 py-2 min-h-[36px]" @click="unblockEntry(entry)">
                      <i data-lucide="shield-off" class="w-3 h-3 mr-1"></i>
                      <span x-text="t('guard.unblock')"></span>
                    </button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
          <div x-show="!blacklist.length" class="empty-state py-12">
            <i data-lucide="shield-check" class="empty-state-icon"></i>
            <p class="text-body text-[var(--apple-text-secondary)]" x-text="t('guard.noBlacklist')"></p>
          </div>
        </div>

        <!-- Whitelist panel -->
        <div x-show="tab === 'whitelist'" class="space-y-6">
          <!-- Add custom pattern -->
          <div class="card p-4">
            <h3 class="text-subheadline font-medium mb-3" x-text="t('guard.addWhitelist')"></h3>
            <div class="flex flex-col sm:flex-row gap-3">
              <input type="text" x-model="newWhitelistPattern" :placeholder="t('guard.whitelistPattern')"
                     class="input flex-1" @keydown.enter="addWhitelistPattern()">
              <button class="btn btn-primary min-h-[44px]" @click="addWhitelistPattern()" :disabled="!newWhitelistPattern.trim()">
                <i data-lucide="plus" class="w-4 h-4 mr-1"></i>
                <span x-text="t('guard.addWhitelist')"></span>
              </button>
            </div>
          </div>

          <!-- Custom patterns -->
          <div class="card overflow-hidden">
            <div class="p-3 border-b border-[var(--apple-gray-5)] bg-[var(--apple-bg-secondary)]">
              <h3 class="text-subheadline font-medium" x-text="t('guard.whitelistCustom')"></h3>
            </div>
            <template x-if="whitelistCustom.length > 0">
              <div class="divide-y divide-[var(--apple-gray-5)]">
                <template x-for="pattern in whitelistCustom" :key="pattern">
                  <div class="flex items-center justify-between gap-3 p-3">
                    <span class="font-mono text-sm truncate" x-text="pattern"></span>
                    <button class="btn btn-secondary text-xs px-3 py-2 min-h-[36px] whitespace-nowrap" @click="removeWhitelistPattern(pattern)">
                      <i data-lucide="trash-2" class="w-3 h-3 mr-1"></i>
                      <span x-text="t('delete')"></span>
                    </button>
                  </div>
                </template>
              </div>
            </template>

          </div>

          <div class="card overflow-hidden">
            <div class="p-3 border-b border-[var(--apple-gray-5)] bg-[var(--apple-bg-secondary)]">
              <h3 class="text-subheadline font-medium" x-text="t('guard.whitelistBuiltin')"></h3>
            </div>
            <div class="flex flex-wrap gap-2 p-3">
              <template x-for="pattern in whitelistBuiltin" :key="pattern">
                <span class="badge bg-[var(--apple-gray-5)] text-[var(--apple-text-secondary)] px-2 py-1 text-xs font-mono" x-text="pattern"></span>
              </template>
            </div>
          </div>
        </div>

        <!-- Block Modal -->
        <div x-show="blockModalOpen" class="fixed inset-0 modal-backdrop flex items-center justify-center z-40 px-4" x-cloak>
          <div class="modal-content p-6 w-full max-w-lg" @click.away="closeBlockModal()">
            <div class="flex items-start justify-between gap-4 mb-6">
              <div>
                <h3 class="text-title-2" x-text="t('guard.blockClient')"></h3>
                <p class="text-sm text-[var(--apple-text-secondary)] mt-2" x-text="t('guard.blockExpiresHint')"></p>
              </div>
              <button class="btn btn-secondary btn-small" @click="closeBlockModal()" x-text="t('close')"></button>
            </div>

            <div class="space-y-4">
              <div>
                <label class="block text-sm text-[var(--apple-text-secondary)] mb-2" x-text="t('guard.blockTarget')"></label>
                <div class="card p-4 bg-[var(--apple-bg-secondary)]">
                  <div class="font-mono text-xs break-all" x-text="blockForm.target?.key || '-'"></div>
                  <div class="mt-3 flex items-center gap-2" x-show="blockForm.target">
                    <span class="badge" :class="blockForm.target ? riskBadgeClass(blockForm.target.riskLevel) : 'badge-info'" x-text="blockForm.target ? t('guard.risk.' + blockForm.target.riskLevel) : '-'"></span>
                    <span class="text-xs text-[var(--apple-text-secondary)]" x-show="blockForm.target" x-text="blockForm.target ? (t('guard.score') + ' ' + blockForm.target.suspiciousScore) : ''"></span>
                  </div>
                </div>
              </div>

              <div>
                <label class="block text-sm text-[var(--apple-text-secondary)] mb-2" x-text="t('guard.blockDuration')"></label>
                <select x-model="blockForm.duration" class="input select">
                  <option value="1h" x-text="t('guard.duration.1h')"></option>
                  <option value="24h" x-text="t('guard.duration.24h')"></option>
                  <option value="permanent" x-text="t('guard.duration.permanent')"></option>
                </select>
              </div>

              <div>
                <label class="block text-sm text-[var(--apple-text-secondary)] mb-2" x-text="t('guard.reason')"></label>
                <textarea x-model="blockForm.reason" class="input min-h-[110px] resize-y" :placeholder="t('guard.blockReason')"></textarea>
              </div>
            </div>

            <div class="flex justify-end gap-3 mt-6">
              <button class="btn btn-secondary" @click="closeBlockModal()" x-text="t('cancel')"></button>
              <button class="btn btn-danger" @click="submitBlock()" :disabled="blockSubmitting || !blockForm.target">
                <span x-text="blockSubmitting ? t('loading') : t('guard.submitBlock')"></span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Logs View -->
      <div x-show="currentView === 'logs'" x-data="logsView()" x-init="init(); load()" style="display: none;">
        <header class="flex justify-between items-center mb-8">
          <h2 class="text-headline" x-text="t('logs.title')"></h2>
          <div class="flex items-center gap-4">
            <button @click="autoRefresh = !autoRefresh" class="btn" :class="autoRefresh ? 'btn-primary' : 'btn-secondary'">
              <i data-lucide="clock" class="w-4 h-4 mr-1"></i>
              <span x-text="autoRefresh ? t('logs.autoRefreshOn') : t('logs.autoRefreshOff')"></span>
            </button>
            <button @click="load()" class="btn btn-secondary" :class="{ 'opacity-75': loading }">
              <i data-lucide="refresh-cw" class="w-4 h-4" :class="{ 'animate-spin': loading }"></i>
            </button>
          </div>
        </header>

        <!-- Filters -->
        <div class="card p-4 mb-6 flex flex-wrap gap-4 items-center">
          <select x-model="filters.level" @change="filters.offset = 0; load()" class="input w-32">
            <option value="" x-text="t('logs.allLevels')"></option>
            <option value="debug">Debug</option>
            <option value="info">Info</option>
            <option value="warn">Warn</option>
            <option value="error">Error</option>
          </select>
          <input x-model="filters.search" @keyup.enter="filters.offset = 0; load()" type="text" :placeholder="t('logs.search')" class="input flex-1 min-w-[200px]">
          <button @click="filters = { level: '', search: '', limit: 50, offset: 0 }; load()" class="btn btn-secondary" x-text="t('logs.clearFilters')"></button>
        </div>

        <div x-show="loading" class="flex justify-center py-20">
          <div class="animate-spin h-12 w-12 border-4 border-[var(--apple-blue)] border-t-transparent rounded-full"></div>
        </div>

        <div x-show="!loading" class="card overflow-hidden">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-[var(--apple-gray-5)] bg-[var(--apple-bg-secondary)]">
                <th class="text-left p-3" x-text="t('logs.time')"></th>
                <th class="text-left p-3" x-text="t('logs.level')"></th>
                <th class="text-left p-3" x-text="t('logs.path')"></th>
                <th class="text-left p-3" x-text="t('logs.user')"></th>
                <th class="text-left p-3" x-text="t('logs.clientIp')"></th>
                <th class="text-left p-3" x-text="t('logs.userAgent')"></th>
                <th class="text-left p-3" x-text="t('logs.model')"></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="log in entries" :key="log.id">
                <tr class="border-b border-[var(--apple-gray-5)] last:border-0 hover:bg-[var(--apple-bg-secondary)]">
                  <td class="p-3 text-[var(--apple-text-secondary)]" x-text="formatTime(log.timestamp)"></td>
                  <td class="p-3">
                    <span class="badge" :class="getLevelClass(log.level)" x-text="log.level"></span>
                  </td>
                  <td class="p-3 font-mono" x-text="log.path"></td>
                  <td class="p-3" x-text="log.username || '-'"></td>
                  <td class="p-3 font-mono text-xs" x-text="log.clientIp || '-'"></td>
                  <td class="p-3 text-xs max-w-[200px] truncate" :title="log.userAgent || ''" x-text="log.userAgent || '-'"></td>
                  <td class="p-3" x-text="log.model || '-'"></td>
                </tr>
              </template>
            </tbody>

          <div x-show="!entries.length" class="empty-state py-12">

        <!-- Pagination -->
        <div class="flex justify-between items-center mt-6" x-show="total > 0">
          <span class="text-body text-[var(--apple-text-secondary)]" x-text="`${filters.offset + 1} - ${Math.min(filters.offset + filters.limit, total)} of ${total}`"></span>
          <div class="flex gap-3">
            <button @click="prevPage()" :disabled="filters.offset === 0" class="btn btn-secondary btn-small" :class="{ 'opacity-50': filters.offset === 0 }" x-text="t('logs.previous')"></button>
            <button @click="nextPage()" :disabled="filters.offset + filters.limit >= total" class="btn btn-secondary btn-small" :class="{ 'opacity-50': filters.offset + filters.limit >= total }" x-text="t('logs.next')"></button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Main Admin App
    function adminApp() {
      return {
        currentView: 'dashboard',
        initialized: false,
        toasts: [],
        lang: I18n.currentLang(),
        sidebarOpen: false,

        async init() {
          // Restore view from URL hash or default to dashboard
          const hash = window.location.hash.slice(1);
          if (hash && ['dashboard', 'users', 'accounts', 'quota', 'guard', 'logs'].includes(hash)) {
            this.currentView = hash;
          }
          
          await this.checkAuth();
          this.initialized = true;
          lucide.createIcons();
          // Refresh quotas in background after login
          this.refreshQuotaInBackground();
          
          // Listen for hash changes
          window.addEventListener('hashchange', () => {
            const hash = window.location.hash.slice(1);
            if (hash && ['dashboard', 'users', 'accounts', 'quota', 'guard', 'logs'].includes(hash)) {
              this.currentView = hash;
            }
          });
          
          // Update hash when currentView changes
          this.$watch('currentView', (view) => {
            if (window.location.hash.slice(1) !== view) {
              window.location.hash = view;
            }
          });
        },

        async refreshQuotaInBackground() {
          try {
            // Silently refresh quotas from GitHub Copilot API
            await API.quota.refresh();
          } catch (e) {
            // Silent fail - quotas will be loaded from cache on quota view
            console.warn('Background quota refresh failed:', e);
          }
        },

        async checkAuth() {
          try {
            const isAuth = await API.auth.check();
            if (!isAuth) window.location.href = '/admin/login';
          } catch (e) {
            window.location.href = '/admin/login';
          }
        },

        // i18n helpers
        t(key, params = {}) {

    // Accounts View Component
    function accountsView() {
      return {
        loading: false,
        accounts: [],
        providers: [],
        showAddModal: false,
        showImportModal: false,
        importFile: null,
        importSkipDuplicates: true,
        defaultNewAccount() {
          return {
            label: '',
            provider: 'copilot',
            credentials: {},
            settings: {},
          };
        },
        newAccount: {
          label: '',
          provider: 'copilot',
          credentials: {},
          settings: {},
        },
        deviceFlowStep: 'input',
        deviceFlowData: null,
        pollTimer: null,
        editingLabel: null,
        editLabelValue: '',

        async load() {
          this.loading = true;
          try {
            const [data, providerData] = await Promise.all([
              API.accounts.list(),
              API.providers.list(),
            ]);
            this.accounts = data.accounts || [];
            this.providers = providerData.providers || [];
          } catch (e) {
            this.showToast(I18n.t('error.load'), 'error');
          } finally {
            this.loading = false;
            this.$nextTick(() => lucide.createIcons());
          }
        },

        providerIcon(providerId) {
          const provider = this.providers.find((item) => item.id === providerId);
          return provider?.icon || (providerId === 'codebuff' ? 'bot' : providerId === 'windsurf' ? 'wind' : 'github');
        },

        providerLabel(providerId) {
          const provider = this.providers.find((item) => item.id === providerId);
          return provider?.name || I18n.t(`accounts.provider.${providerId}.name`) || providerId;
        },

        selectedProvider() {
          return this.providers.find((provider) => provider.id === this.newAccount.provider) || null;
        },

        selectedProviderFields() {
          return this.selectedProvider()?.accountFields || [];
        },

        fieldLabel(field) {
          return I18n.t(field.labelKey) || field.key;
        },

        getAccountFieldValue(field) {
          if (field.key in (this.newAccount.credentials || {})) {
            return this.newAccount.credentials[field.key];
          }
          return this.newAccount.settings?.[field.key];
        },

        setAccountFieldValue(field, value) {
          const directCredentialKeys = ['authToken', 'apiKey'];
          if (directCredentialKeys.includes(field.key)) {
            this.newAccount.credentials = {
              ...(this.newAccount.credentials || {}),
              [field.key]: value,
            };
            return;
          }

          this.newAccount.settings = {
            ...(this.newAccount.settings || {}),
            [field.key]: value,
          };
        },

        startEditLabel(account) {
          this.editingLabel = account.id;
          this.editLabelValue = account.label;
          this.$nextTick(() => {
            const input = this.$refs.labelInput;
            if (input) input.focus();
          });
        },

        async saveLabel(account) {
          if (!this.editLabelValue.trim()) {
            this.editingLabel = null;
            return;
          }
          try {
            await API.accounts.update(account.id, { label: this.editLabelValue.trim() });
            this.showToast(I18n.t('accounts.updateSuccess') || 'Account name updated', 'success');
            await this.load();
          } catch (e) {
            this.showToast(I18n.t('error.update'), 'error');
          } finally {
            this.editingLabel = null;
          }
        },

        openAddModal() {
          this.newAccount = this.defaultNewAccount();
          this.deviceFlowStep = 'input';
          this.deviceFlowData = null;
          this.showAddModal = true;
          if (this.pollTimer) clearTimeout(this.pollTimer);
          this.pollTimer = null;
        },

        closeAddModal() {
          this.showAddModal = false;
          this.newAccount = this.defaultNewAccount();
          this.deviceFlowStep = 'input';
          this.deviceFlowData = null;
          if (this.pollTimer) {
            clearTimeout(this.pollTimer);
            this.pollTimer = null;
          }
        },

        async submitAccount() {
          this.pollTimer = null;
          try {
            const provider = this.newAccount.provider || 'copilot';
            const payload = {
              label: this.newAccount.label.trim() || undefined,
              provider,
              credentials: Object.fromEntries(
                Object.entries(this.newAccount.credentials || {}).filter(([, value]) => value !== '' && value !== undefined)
              ),
              settings: Object.fromEntries(
                Object.entries(this.newAccount.settings || {}).filter(([, value]) => value !== '' && value !== undefined)
              ),
            };
            const res = await API.accounts.create(payload);
            if (this.selectedProvider()?.authMode === 'device_flow') {
              if (!res?.flowId || !res?.userCode || !res?.verificationUri) {
                throw new Error('Invalid device flow response');
              }
              this.deviceFlowData = res;
              this.deviceFlowStep = 'pending';
              this.pollDeviceFlow();
              return;
            }
            if (res?.status && res.status !== 'complete') {
              throw new Error('Unexpected account creation status');
            }
            this.deviceFlowStep = 'success';
            await this.load();
          } catch (e) {
            this.showToast(I18n.t('error.create'), 'error');
          }
        },

        pollDeviceFlow() {
          let pollInterval = this.deviceFlowData?.interval * 1000 || 5000;

          const doPoll = async () => {
            if (this.deviceFlowStep !== 'pending') {
              return;
            }
            try {
              const flowId = this.deviceFlowData.flowId || this.deviceFlowData.deviceCode;
              const res = await API.accountFlows.poll(flowId);
              if (res.status === 'complete') {
                this.deviceFlowStep = 'success';
                // Refresh accounts list to show the new account
                await this.load();
                return;
              }
              if (res.status === 'expired') {
                this.deviceFlowStep = 'input';
                this.showToast(I18n.t('accounts.deviceFlow.expired') || 'Device flow expired. Please try again.', 'error');
                return;
              }
              // Update interval if server asks for slow_down
              if (res.interval) {
                pollInterval = res.interval * 1000;
              }
            } catch (e) {
              // Continue polling
            }
            // Schedule next poll with current interval
            this.pollTimer = setTimeout(doPoll, pollInterval);
          };

          this.pollTimer = setTimeout(doPoll, pollInterval);
        },

        async toggleEnabled(account) {
          try {
            await API.accounts.update(account.id, { enabled: !account.enabled });
            this.showToast(
              account.enabled
                ? I18n.t('accounts.disableSuccess')
                : I18n.t('accounts.enableSuccess'),
              'success'
            );
            await this.load();
          } catch (e) {
            this.showToast(I18n.t('error.update'), 'error');
          }
        },

        async savePriority(account) {
          const priority = Math.max(0, Math.min(100, account.priority ?? 0));
          try {
            await API.accounts.update(account.id, { priority });
            this.showToast(I18n.t('accounts.prioritySuccess') || 'Priority updated', 'success');
          } catch (e) {
            this.showToast(I18n.t('error.update'), 'error');
          }
        },

        async decreasePriority(account) {
          const newPriority = Math.max(0, (account.priority ?? 0) - 1);
          account.priority = newPriority;
          await this.savePriority(account);
        },

        async increasePriority(account) {
          const newPriority = Math.min(100, (account.priority ?? 0) + 1);
          account.priority = newPriority;
          await this.savePriority(account);
        },

        async deleteAccount(id) {
          if (!confirm(I18n.t('accounts.confirmDelete'))) return;
          try {
            await API.accounts.delete(id);
            this.showToast(I18n.t('accounts.deleteSuccess'), 'success');
            await this.load();
          } catch (e) {
            this.showToast(I18n.t('error.delete'), 'error');
          }
        },

        async exportAccounts() {
          try {
            const response = await API.accounts.export();
            const blob = await response.blob();
            const disposition = response.headers.get('Content-Disposition') || '';
            const match = disposition.match(/filename="?([^"]+)"?/);
            const filename = match ? match[1] : 'copilot-api-accounts.json';
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
            this.showToast(I18n.t('accounts.exportSuccess'), 'success');
          } catch (e) {
            this.showToast(e.message || I18n.t('error.load'), 'error');
          }
        },

        async exportOneAccount(account) {
          try {
            const response = await API.accounts.exportOne(account.id);
            const blob = await response.blob();
            const disposition = response.headers.get('Content-Disposition') || '';
            const match = disposition.match(/filename="?([^"]+)"?/);
            const filename = match ? match[1] : 'copilot-api-account.json';
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
            this.showToast(I18n.t('accounts.exportOneSuccess'), 'success');
          } catch (e) {
            this.showToast(e.message || I18n.t('error.load'), 'error');
          }
        },

        openImportModal() {
          this.importFile = null;
          this.importSkipDuplicates = true;
          this.showImportModal = true;
          this.$nextTick(() => {
            if (this.$refs.importFileInput) this.$refs.importFileInput.value = '';
          });
        },

        closeImportModal() {
          this.showImportModal = false;
          this.importFile = null;
        },

        importFileSelected(event) {
          this.importFile = event.target.files[0] || null;
        },

        async submitImport() {
          if (!this.importFile) {
            this.showToast(I18n.t('accounts.importNoFile'), 'error');
            return;
          }
          let parsed;
          try {
            const text = await this.importFile.text();
            parsed = JSON.parse(text);
          } catch {
            this.showToast(I18n.t('accounts.importInvalidFile'), 'error');
            return;
          }
          // Support both { accounts: [...] } and plain array
          const accounts = Array.isArray(parsed) ? parsed : (parsed.accounts || []);
          if (!accounts.length) {
            this.showToast(I18n.t('accounts.importInvalidFile'), 'error');
            return;
          }
          try {
            const result = await API.accounts.import({
              accounts,
              overwrite: !this.importSkipDuplicates,
            });
            let msg = I18n.t('accounts.importSuccess', { count: result.imported });
            if (result.skipped > 0) msg += I18n.t('accounts.importSkipped', { count: result.skipped });
            if (result.failed > 0) msg += I18n.t('accounts.importFailed', { count: result.failed });
            this.showToast(msg, result.imported > 0 ? 'success' : 'info');
            this.closeImportModal();
            await this.load();
          } catch (e) {
            this.showToast(e.message || I18n.t('error.create'), 'error');
          }
        },

        showToast(msg, type) {
          const app = document.querySelector('[x-data^=adminApp]');
          if (app) Alpine.$data(app).showToast(msg, type);
        },
        t(key, params) {
          // Access parent lang to establish reactive dependency
          const app = document.querySelector('[x-data^=adminApp]');
          if (app) void Alpine.$data(app).lang;
          return I18n.t(key, params);
        }
      };
    }

            priority: cred.priority ?? 0,
            weight: cred.weight ?? 1,
            enabled: cred.enabled,
          };
          this.showCredModal = true;
          this.$nextTick(() => lucide.createIcons());
        },

        async saveCred() {
          const form = this.credForm;
          const payload = {
            label: form.label || undefined,
            authMode: form.authMode,
            headerName: form.authMode === 'header' ? form.headerName || undefined : undefined,
            priority: form.priority,
            weight: form.weight,
            enabled: form.enabled,
          };
          if (form.value) payload.value = form.value;
          try {
            if (form.id) {
              await API.providerConnections.updateCredential(form.connectionId, form.id, payload);
            } else {
              if (!form.value) {
                this.showToast('Secret value is required', 'error');
                return;
              }
              await API.providerConnections.addCredential(form.connectionId, payload);
            }
            this.showCredModal = false;
            await this.load();
            this.showToast('Saved', 'success');
          } catch (e) {
            this.showToast(e.message || 'Save failed', 'error');
          }
        },

        async toggleCredential(conn, cred) {
          try {
            if (cred.enabled) {
              await API.providerConnections.disableCredential(conn.id, cred.id);
            } else {
              await API.providerConnections.enableCredential(conn.id, cred.id);
            }
            await this.load();
          } catch (e) {
            this.showToast(e.message || 'Failed', 'error');
          }
        },

        async resetCredential(conn, cred) {
          try {
            await API.providerConnections.resetCredentialStatus(conn.id, cred.id);
            await this.load();
            this.showToast('Status reset', 'success');
          } catch (e) {
            this.showToast(e.message || 'Failed', 'error');
          }
        },

        async deleteCredential(conn, cred) {
          if (!confirm('Delete credential?')) return;
          try {
            await API.providerConnections.deleteCredential(conn.id, cred.id);
            await this.load();
          } catch (e) {
            this.showToast(e.message || 'Failed', 'error');
          }
        },
      };
    }

    // Quota View Component
    function quotaView() {
      return {
        loading: false,
        refreshing: false,
        accounts: [],
        users: [],
        dateRange: 'today',
        showPricingModal: false,
        modelPrices: {},
        usageSummary: {
          totals: {
            requests: 0,
            promptTokens: 0,
            completionTokens: 0,
            totalTokens: 0,
            cost: 0,
          },
          byAccount: {},
          byModel: {},
          timeSeries: [],
        },
        usageChart: null,
        chartRenderToken: 0,

        init() {
          // Patch Chart.js bug #11743: destroy() doesn't cancel pending rAF,
          // so clear/draw can fire on a null canvas after destroy.
          // This only needs to run once.
          if (typeof Chart !== 'undefined' && !Chart._patchedNullCanvas) {
            Chart._patchedNullCanvas = true;
            const origClear = Chart.prototype.clear;
            Chart.prototype.clear = function() {
              if (!this.canvas) return this;
              return origClear.call(this);
            };
            const origDraw = Chart.prototype.draw;
            Chart.prototype.draw = function() {
              if (!this.canvas) return this;
              return origDraw.call(this);
            };
          }

          // Initial load
          this.load();
          // Reload when view becomes active (switched back to quota)
          const app = document.querySelector('[x-data^=adminApp]');
          if (app) {
            Alpine.$data(app).$watch('currentView', (view) => {
              if (view === 'quota') {
                this.load();
              } else {
                // Destroy chart when leaving quota view to prevent canvas errors
                this.destroyChart();
              }
            });
          }
        },

        destroyChart() {
          if (this.usageChart) {
            this.usageChart.destroy();
            this.usageChart = null;
          }
        },

        setRange(range) {
          this.dateRange = range;
          this.loadUsageStats().then(() => {
            this.$nextTick(() => this.renderChart());
          });
        },

        async load() {
          this.loading = true;
          try {
            const data = await API.quota.get();
            this.accounts = data.accounts || [];
            this.users = data.users || [];
            await this.loadUsageStats();
            await this.loadModelPricing();
          } catch (e) {
            this.showToast(I18n.t('error.load'), 'error');
          } finally {
            this.loading = false;
            this.$nextTick(() => {
              lucide.createIcons();
              this.renderChart();
            });
          }
        },

        async loadModelPricing() {
          try {
            const data = await API.usage.getPricing();
            // Convert from $/1K to $/1M for display (multiply by 1000)
            this.modelPrices = {};
            for (const [model, price] of Object.entries(data.pricing || {})) {
              this.modelPrices[model] = {
                promptPricePer1m: price.promptPricePer1k * 1000,
                completionPricePer1m: price.completionPricePer1k * 1000,
                cacheReadPricePer1m: price.cacheReadPricePer1k * 1000,
                cacheWritePricePer1m: price.cacheWritePricePer1k * 1000,
              };
            }
          } catch (e) {
            console.error('Failed to load model pricing:', e);
          }
        },

        async saveModelPricing(model) {
          try {
            const price = this.modelPrices[model];
            // Convert from $/1M to $/1K for storage (divide by 1000)
            await API.usage.updatePricing(model, {
              promptPricePer1k: (parseFloat(price.promptPricePer1m) || 0) / 1000,
              completionPricePer1k: (parseFloat(price.completionPricePer1m) || 0) / 1000,
              cacheReadPricePer1k: (parseFloat(price.cacheReadPricePer1m) || 0) / 1000,
              cacheWritePricePer1k: (parseFloat(price.cacheWritePricePer1m) || 0) / 1000,
            });
            this.showToast('模型价格已保存', 'success');
          } catch (e) {
            this.showToast('保存失败：' + e.message, 'error');
          }
        },

        async loadUsageStats() {
          try {
            const data = await API.usage.summary(this.dateRange);
            this.usageSummary = data;
          } catch (e) {
            console.error('Failed to load usage stats:', e);
          }
        },

        renderChart() {
          // Increment token so any pending retries from a previous call become stale
          const token = ++this.chartRenderToken;

          if (typeof Chart === 'undefined') return;

          const attempt = (retryCount = 0) => {
            // Bail out if a newer renderChart() call has started
            if (token !== this.chartRenderToken) return;

            const canvas = document.getElementById('usageTrendChart');
            // Check that canvas exists AND is actually visible (offsetParent is null
            // when the element or any ancestor has display:none)
            if (!canvas || canvas.offsetParent === null) {
              if (retryCount < 30) {
                setTimeout(() => attempt(retryCount + 1), 150);
              }
              return;
            }

            // Destroy existing chart but do NOT replace the canvas element.
            // Replacing the canvas causes Chart.js's internal rAF callbacks to
            // hold a stale reference → "Cannot read properties of null (reading 'getContext')".
            if (this.usageChart) {
              this.usageChart.destroy();
              this.usageChart = null;
            }

            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            const isToday = this.dateRange === 'today';
            const intervalSeries = this.usageSummary.intervalSeries || [];
            const timeSeries = this.usageSummary.timeSeries || [];

            // For today, prefer 15-min interval series; otherwise fall back to daily
            const useInterval = isToday && intervalSeries.length > 0;
            const hasDailyData = timeSeries.length > 0;
            if (!useInterval && !hasDailyData) return;

            // Get CSS variables for colors
            const root = getComputedStyle(document.documentElement);
            const blueColor = root.getPropertyValue('--apple-blue')?.trim() || '#007AFF';
            const greenColor = root.getPropertyValue('--apple-green')?.trim() || '#34C759';
            const orangeColor = root.getPropertyValue('--apple-orange')?.trim() || '#FF9500';
            const purpleColor = root.getPropertyValue('--apple-purple')?.trim() || '#AF52DE';
            const pinkColor = root.getPropertyValue('--apple-pink')?.trim() || '#FF2D55';
            const redColor = root.getPropertyValue('--apple-red')?.trim() || '#FF3B30';
            const textColor = root.getPropertyValue('--apple-text')?.trim() || '#1D1D1F';
            const textSecondaryColor = root.getPropertyValue('--apple-text-secondary')?.trim() || '#86868B';
            const palette = [blueColor, greenColor, orangeColor, purpleColor, pinkColor, redColor];

            let labels, sortedData;
            if (useInterval) {
              // 15-min slots: sort by slotTs, format as HH:MM
              sortedData = [...intervalSeries].sort((a, b) => a.slotTs - b.slotTs);
              labels = sortedData.map(d => {
                const date = new Date(d.slotTs);
                const hh = String(date.getHours()).padStart(2, '0');
                const mm = String(date.getMinutes()).padStart(2, '0');
                return `${hh}:${mm}`;
              });
            } else {
              // Daily: sort by date ascending
              sortedData = [...timeSeries].sort((a, b) => a.date.localeCompare(b.date));
              labels = sortedData.map(d => {
                const parts = d.date.split('-');
                return `${parseInt(parts[1], 10)}/${parseInt(parts[2], 10)}`;
              });
            }

            const datasets = [
              {
                label: this.t('quota.tokens.total'),
                data: sortedData.map(d => d.totalTokens),
                borderColor: blueColor,
                backgroundColor: blueColor + '20',
                fill: true,
                tension: 0.35,
                pointRadius: 3,
                pointHoverRadius: 5,
                borderWidth: 2,
              }
            ];

            for (const [index, [model]] of this.sortedModelUsage.entries()) {
              const color = palette[index % palette.length];
              datasets.push({
                label: `${model}`,
                data: sortedData.map(d => d.models?.[model]?.totalTokens || 0),
                borderColor: color,
                backgroundColor: 'transparent',
                fill: false,
                tension: 0.35,
                pointRadius: 2,
                pointHoverRadius: 4,
                borderWidth: 2,
              });
            }

            this.usageChart = new Chart(ctx, {
              type: 'line',
              data: { labels, datasets },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                  legend: {
                    position: 'top',
                    labels: {
                      color: textColor,
                      usePointStyle: true,
                      padding: 16,
                      boxWidth: 10,
                      boxHeight: 10,
                    }
                  },
                  tooltip: {
                    backgroundColor: 'rgba(0,0,0,0.82)',
                    titleColor: '#fff',
                    bodyColor: '#fff',
                    padding: 12,
                    cornerRadius: 10,
                    callbacks: {
                      label: (context) => {
                        let label = context.dataset.label || '';
                        if (label) label += ': ';
                        label += this.formatTokens(context.raw || 0);
                        return label;
                      }
                    }
                  }
                },
                scales: {
                  x: {
                    ticks: { color: textSecondaryColor },
                    grid: { color: 'rgba(0,0,0,0.05)' }
                  },
                  y: {
                    type: 'linear',
                    display: true,
                    position: 'left',
                    ticks: {
                      color: textSecondaryColor,
                      callback: (value) => this.formatTokens(value),
                    },
                    grid: { color: 'rgba(0,0,0,0.05)' }
                  }
                }
              }
            });
          };
          attempt();
        },

        get sortedModelUsage() {
          return Object.entries(this.usageSummary.byModel || {}).sort(([, left], [, right]) => {
            return (right.totalTokens || 0) - (left.totalTokens || 0);
          });
        },

        getModelShare(tokens) {
          const totalTokens = this.usageSummary?.totals?.totalTokens || 0;
          if (!totalTokens) return 0;
          return Math.min(tokens / totalTokens, 1);
        },

        async refresh() {
          this.refreshing = true;
          try {
            await API.quota.refresh();
            this.showToast(I18n.t('quota.refreshSuccess'), 'success');
            await this.load();
          } catch (e) {
            this.showToast(I18n.t('quota.refreshError'), 'error');
          } finally {
            this.refreshing = false;
          }
        },

        calculatePercent(remaining, total) {
          if (!total) return 0;
          return Math.min(((total - (remaining || 0)) / total * 100), 100);
        },

        getUsageColor(remaining, limit) {
          if (!limit) return 'bg-[var(--apple-green)]';
          const pct = (remaining || 0) / limit;
          if (pct < 0.2) return 'bg-[var(--apple-red)]';
          if (pct < 0.5) return 'bg-[var(--apple-orange)]';
          return 'bg-[var(--apple-green)]';
        },

        formatPercent(value) {
          return (value * 100).toFixed(1) + '%';
        },

        // Format token count with appropriate unit (K, M, or raw)
        formatTokens(tokens) {
          const numericTokens = Number(tokens || 0);
          if (numericTokens === 0) return '0';
          if (numericTokens >= 1000000) {
            return (numericTokens / 1000000).toFixed(1) + 'M';
          }
          if (numericTokens >= 1000) {
            return (numericTokens / 1000).toFixed(1) + 'K';
          }
          return numericTokens.toString();
        },

        showToast(msg, type) {
          const app = document.querySelector('[x-data^=adminApp]');
          if (app) Alpine.$data(app).showToast(msg, type);
        },
        t(key, params) {
          // Access parent lang to establish reactive dependency
          const app = document.querySelector('[x-data^=adminApp]');
          if (app) void Alpine.$data(app).lang;
          return I18n.t(key, params);
        }
      };
    }

    // Guard View Component
    function guardView() {
      return {
        loading: false,
        tab: 'ip',
        search: '',
        filter: 'all',
        clients: [],
        blacklist: [],
        whitelistBuiltin: [],
        whitelistCustom: [],
        newWhitelistPattern: '',
        blockModalOpen: false,
        blockSubmitting: false,
        blockForm: {
          target: null,
          duration: '1h',
          reason: '',
        },

        get overview() {
          const clients = this.clients || [];
          return {
            total: clients.length,
            suspicious: clients.filter(client => client.suspicious).length,
            blocked: clients.filter(client => client.blocked).length,
            recommended: clients.filter(
              client => !client.blocked && client.recommendedAction === 'temporary_block'
            ).length,
          };
        },

        get filteredClients() {
          const query = this.search.trim().toLowerCase();
          return (this.clients || []).filter((client) => {
            if (this.filter === 'suspicious' && !client.suspicious) return false;
            if (this.filter === 'blocked' && !client.blocked) return false;
            if (
              this.filter === 'recommended'
              && client.recommendedAction !== 'temporary_block'
            ) {
              return false;
            }

            if (!query) return true;

            const searchable = [
              client.key,
              ...(client.usernames || []),
              ...((client.topPaths || []).map(path => path.path)),
              ...((client.suspiciousReasons || []).map(reason => this.t('guard.reason.' + reason))),
            ]
              .join(' ')
              .toLowerCase();

            return searchable.includes(query);
          });
        },

        async load() {
          if (this.tab === 'blacklist') { await this.loadBlacklist(); return; }
          if (this.tab === 'whitelist') { await this.loadWhitelist(); return; }
          this.loading = true;
          try {
            const data = await API.guard.clients(this.tab);
            this.clients = data.clients || [];
          } catch (e) {
            this.showToast(I18n.t('error.load'), 'error');
          } finally {
            this.loading = false;
            this.$nextTick(() => lucide.createIcons());
          }
        },

        async loadBlacklist() {
          this.loading = true;
          try {
            const data = await API.guard.blacklist();
            this.blacklist = data.blacklist || [];
          } catch (e) {
            this.showToast(I18n.t('error.load'), 'error');
          } finally {
            this.loading = false;
            this.$nextTick(() => lucide.createIcons());
          }
        },

        async loadWhitelist() {
          this.loading = true;
          try {
            const data = await API.guard.uaWhitelist();
            this.whitelistBuiltin = data.builtin || [];
            this.whitelistCustom = data.custom || [];
          } catch (e) {
            this.showToast(I18n.t('error.load'), 'error');
          } finally {
            this.loading = false;
            this.$nextTick(() => lucide.createIcons());
          }
        },

        openBlockModal(client) {
          this.blockForm = {
            target: client,
            duration: client?.recommendedAction === 'temporary_block' ? '24h' : '1h',
            reason: '',
          };
          this.blockModalOpen = true;
          this.$nextTick(() => lucide.createIcons());
        },

        closeBlockModal() {
          this.blockModalOpen = false;
          this.blockSubmitting = false;
          this.blockForm = { target: null, duration: '1h', reason: '' };
        },

        async submitBlock() {
          if (!this.blockForm.target) return;

          let expiresAt;
          if (this.blockForm.duration === '1h') {
            expiresAt = Date.now() + 60 * 60 * 1000;
          } else if (this.blockForm.duration === '24h') {
            expiresAt = Date.now() + 24 * 60 * 60 * 1000;
          }

          this.blockSubmitting = true;
          try {
            await API.guard.block({
              value: this.blockForm.target.key,
              type: this.tab,
              reason: this.blockForm.reason.trim() || undefined,
              expiresAt,
            });
            this.showToast(I18n.t('guard.blockSuccess'), 'success');
            this.closeBlockModal();
            await this.load();
          } catch (e) {
            const errorMsg = e?.message || I18n.t('error.update');
            this.showToast(errorMsg, 'error');
          } finally {
            this.blockSubmitting = false;
          }
        },

        async addWhitelistPattern() {
          const pattern = this.newWhitelistPattern.trim();
          if (!pattern) return;
          try {
            await API.guard.addUaWhitelist(pattern);
            this.newWhitelistPattern = '';
            this.showToast(I18n.t('guard.whitelistAdded'), 'success');
            await this.loadWhitelist();
          } catch (e) {
            const errorMsg = e?.error || I18n.t('error.update');
            this.showToast(errorMsg, 'error');
          }
        },

        async removeWhitelistPattern(pattern) {
          if (!confirm(I18n.t('guard.confirmRemoveWhitelist'))) return;
          try {
            await API.guard.removeUaWhitelist(pattern);
            this.showToast(I18n.t('guard.whitelistRemoved'), 'success');
            await this.loadWhitelist();
          } catch (e) {
            this.showToast(I18n.t('error.update'), 'error');
          }
        },

        async unblockEntry(entry) {
          if (!confirm(I18n.t('guard.confirmUnblock'))) return;
          try {
            await API.guard.unblock({ value: entry.value, type: entry.type });
            this.showToast(I18n.t('guard.unblockSuccess'), 'success');
            await this.loadBlacklist();
          } catch (e) {
            this.showToast(I18n.t('error.update'), 'error');
          }
        },

        riskBadgeClass(level) {
          const map = {
            low: 'badge-success',
            medium: 'badge-warning',
            high: 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400',
            critical: 'badge-danger',
          };
          return map[level] || 'badge-info';
        },

        signalBadgeClass(reason) {
          const map = {
            premium_abuse: 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400',
            auth_failures: 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400',
            path_scanning: 'bg-orange-100 text-orange-700 dark:bg-orange-900/30 dark:text-orange-400',
            burst_traffic: 'bg-orange-100 text-orange-700 dark:bg-orange-900/30 dark:text-orange-400',
            high_error_rate: 'bg-orange-100 text-orange-700 dark:bg-orange-900/30 dark:text-orange-400',
            high_frequency: 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400',
            no_auth: 'bg-gray-100 text-gray-700 dark:bg-gray-900/30 dark:text-gray-400',
            unknown_ua: 'bg-gray-100 text-gray-700 dark:bg-gray-900/30 dark:text-gray-400',
          };
          return map[reason] || 'badge-info';
        },

        formatPercent(value) {
          return `${Math.round((Number(value) || 0) * 100)}%`;
        },

        formatExpiry(ts) {
          if (!ts) return this.t('guard.never');
          if (ts <= Date.now()) return this.t('guard.expired');
          return `${this.formatTime(ts)} · ${this.formatRelativeDuration(ts - Date.now())}`;
        },

        formatRelativeDuration(ms) {
          const minutes = Math.max(Math.round(ms / 60000), 1);
          if (minutes < 60) return `${minutes}m`;
          const hours = Math.round(minutes / 60);
          if (hours < 24) return `${hours}h`;
          const days = Math.round(hours / 24);
          return `${days}d`;
        },

        showToast(msg, type) {
          const app = document.querySelector('[x-data^=adminApp]');
          if (app) Alpine.$data(app).showToast(msg, type);
        },
        formatTime(ts) {
          if (!ts) return '-';
          const app = document.querySelector('[x-data^=adminApp]');
          return app ? Alpine.$data(app).formatTime(ts) : new Date(ts).toLocaleString();
        },
        t(key, params) {
          const app = document.querySelector('[x-data^=adminApp]');
          if (app) void Alpine.$data(app).lang;
          return I18n.t(key, params);
        }
      };
    }

    // Logs View Component
    function logsView() {
      return {
        loading: false,
        entries: [],
        total: 0,
        autoRefresh: false,
        refreshTimer: null,
        filters: { level: '', search: '', limit: 50, offset: 0 },

        init() {
          // Watch autoRefresh and start/stop timer accordingly
          this.$watch('autoRefresh', (enabled) => {
            if (enabled) {
              this.startAutoRefresh();
            } else {
              this.stopAutoRefresh();
            }
          });
        },

        startAutoRefresh() {
          // Refresh every 5 seconds when auto-refresh is enabled
          this.refreshTimer = setInterval(() => {
            this.load();
          }, 5000);
        },

        stopAutoRefresh() {
          if (this.refreshTimer) {
            clearInterval(this.refreshTimer);
            this.refreshTimer = null;
          }
        },

        async load() {
          this.loading = true;
          try {
            const data = await API.logs.get(this.filters);
            this.entries = data.entries || [];
            this.total = data.total || 0;
          } catch (e) {
            this.showToast(I18n.t('error.load'), 'error');
          } finally {
            this.loading = false;
            this.$nextTick(() => lucide.createIcons());
          }
        },

        prevPage() {
          if (this.filters.offset >= this.filters.limit) {
            this.filters.offset -= this.filters.limit;
            this.load();
          }
        },

        nextPage() {
          if (this.filters.offset + this.filters.limit < this.total) {
            this.filters.offset += this.filters.limit;
            this.load();
          }
        },

        getLevelClass(level) {
          const map = { debug: 'badge-info', info: 'badge-success', warn: 'badge-warning', error: 'badge-danger' };
          return map[level] || 'badge-info';
        },

        showToast(msg, type) {
          const app = document.querySelector('[x-data^=adminApp]');
          if (app) Alpine.$data(app).showToast(msg, type);
        },
        formatTime(ts) {
          if (!ts) return '-';
          const app = document.querySelector('[x-data^=adminApp]');
          return app ? Alpine.$data(app).formatTime(ts) : new Date(ts).toLocaleString();
        },
        t(key, params) {
          // Access parent lang to establish reactive dependency
          const app = document.querySelector('[x-data^=adminApp]');
          if (app) void Alpine.$data(app).lang;
          return I18n.t(key, params);
        }
      };
    }
  </script>
