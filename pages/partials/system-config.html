<div
  x-data="systemConfigView()"
  x-init="load(); $watch('currentView', view => { if (view === 'system-config') load() })"
>
  <header class="page-header">
    <div class="page-heading">
      <h2 class="text-headline" x-text="t('nav.system-config')"></h2>
      <p class="page-description" x-text="t('system.subtitle')"></p>
    </div>
    <button
      class="btn btn-secondary"
      @click="load()"
      :disabled="loading || saving"
      x-text="t('refresh')"
    ></button>
  </header>
  <p
    role="alert"
    class="text-sm text-red-600 mb-4"
    x-show="error"
    x-text="error"
  ></p>
  <template x-if="settings">
    <form
      @submit.prevent="save()"
      class="card p-5 space-y-5 max-w-3xl"
      @input="saved = false"
    >
      <p
        class="text-sm text-[var(--apple-text-secondary)]"
        x-text="t('system.source.' + source)"
      ></p>
      <label class="block">
        <span
          class="block text-sm font-medium mb-2"
          x-text="t('system.quotaDisplayMode')"
        ></span>
        <select
          class="input w-full"
          x-model="settings.quotaDisplayMode"
          :disabled="saving"
        >
          <option
            value="remaining"
            x-text="t('system.quotaMode.remaining')"
          ></option>
          <option value="used" x-text="t('system.quotaMode.used')"></option>
        </select>
        <span
          class="block text-sm text-[var(--apple-text-secondary)] mt-1"
          x-text="t('system.quotaDisplayHint')"
        ></span>
      </label>
      <fieldset class="space-y-3">
        <legend
          class="text-sm font-medium"
          x-text="t('system.codexModels')"
        ></legend>
        <label class="flex items-center gap-3">
          <input
            type="checkbox"
            :checked="settings.codexModelIds !== null"
            @change="setCustomCodexModels($event.target.checked)"
            :disabled="saving"
          />
          <span class="text-sm" x-text="t('system.codexModelsCustom')"></span>
        </label>
        <p
          class="text-sm text-[var(--apple-text-secondary)]"
          x-text="t('system.codexModelsHint')"
        ></p>
        <template x-if="settings.codexModelIds !== null">
          <div class="space-y-3">
            <p
              class="text-sm"
              x-text="t('system.codexModelsSelected') + ': ' + settings.codexModelIds.length + ' / 100'"
            ></p>
            <ol
              class="space-y-2 max-h-64 overflow-y-auto"
              :aria-label="t('system.codexModelsSelected')"
            >
              <template x-for="(id, index) in settings.codexModelIds" :key="id">
                <li class="flex items-center gap-2 text-sm">
                  <span class="flex-1 min-w-0 break-all">
                    <span x-text="codexModelName(id)"></span>
                    <span
                      class="block text-xs text-[var(--apple-text-secondary)]"
                      x-text="id"
                    ></span>
                  </span>
                  <button
                    type="button"
                    class="btn btn-secondary"
                    @click="moveCodexModel(index, -1)"
                    :disabled="saving || index === 0"
                    :aria-label="t('system.codexModelsUp')"
                  >
                    ↑
                  </button>
                  <button
                    type="button"
                    class="btn btn-secondary"
                    @click="moveCodexModel(index, 1)"
                    :disabled="saving || index === settings.codexModelIds.length - 1"
                    :aria-label="t('system.codexModelsDown')"
                  >
                    ↓
                  </button>
                  <button
                    type="button"
                    class="btn btn-secondary"
                    @click="toggleCodexModel(id, false)"
                    :disabled="saving"
                    x-text="t('system.codexModelsRemove')"
                  ></button>
                </li>
              </template>
            </ol>
            <input
              type="search"
              class="input w-full"
              x-model="codexModelSearch"
              :placeholder="t('system.codexModelsSearch')"
              :aria-label="t('system.codexModelsSearch')"
              :disabled="saving"
            />
            <div class="space-y-2 max-h-64 overflow-y-auto">
              <template x-for="model in filteredCodexModels" :key="model.id">
                <label class="flex items-start gap-3 text-sm">
                  <input
                    type="checkbox"
                    class="mt-1"
                    :checked="settings.codexModelIds.includes(model.id)"
                    @change="toggleCodexModel(model.id, $event.target.checked)"
                    :disabled="saving || (settings.codexModelIds.length >= 100 && !settings.codexModelIds.includes(model.id))"
                  />
                  <span>
                    <span x-text="model.name"></span>
                    <span
                      class="block text-xs text-[var(--apple-text-secondary)]"
                      x-text="model.id"
                    ></span>
                  </span>
                </label>
              </template>
              <p
                class="text-sm"
                x-show="filteredCodexModels.length === 0"
                x-text="t('system.codexModelsEmpty')"
              ></p>
            </div>
          </div>
        </template>
      </fieldset>
      <label class="block">
        <span
          class="block text-sm font-medium mb-2"
          x-text="t('system.logLevel')"
        ></span>
        <select
          class="input w-full"
          x-model="settings.logLevel"
          :disabled="saving"
        >
          <option value="warn" x-text="t('system.level.warn')"></option>
          <option value="info" x-text="t('system.level.info')"></option>
          <option value="debug" x-text="t('system.level.debug')"></option>
        </select>
        <span
          class="block text-sm text-[var(--apple-text-secondary)] mt-1"
          x-text="t('system.logHint')"
        ></span>
      </label>
      <template
        x-for="key in ['codexAutoReset', 'performanceDetails', 'memoryVerbose', 'requestDump']"
        :key="key"
      >
        <label class="flex items-start gap-3">
          <input
            type="checkbox"
            class="mt-1"
            x-model="settings[key]"
            :disabled="saving"
          />
          <span>
            <span
              class="block text-sm font-medium"
              x-text="t('system.' + key)"
            ></span>
            <span
              class="block text-sm text-[var(--apple-text-secondary)]"
              x-text="t('system.' + key + 'Hint')"
            ></span>
          </span>
        </label>
      </template>
      <fieldset class="space-y-3">
        <legend
          class="text-sm font-medium"
          x-text="t('system.logStorage')"
        ></legend>
        <div class="grid gap-3 sm:grid-cols-2">
          <label class="block">
            <span
              class="block text-sm mb-2"
              x-text="t('system.logRetentionDays')"
            ></span>
            <input
              type="number"
              class="input w-full"
              min="1"
              max="3650"
              step="1"
              required
              x-model.number="settings.logRetentionDays"
              :disabled="saving"
            />
          </label>
          <label class="block">
            <span
              class="block text-sm mb-2"
              x-text="t('system.logMaxTotalMiB')"
            ></span>
            <input
              type="number"
              class="input w-full"
              min="1"
              max="1048576"
              step="1"
              required
              x-model.number="maxLogMiB"
              :disabled="saving"
            />
          </label>
        </div>
        <p
          class="text-sm text-[var(--apple-text-secondary)]"
          x-text="t('system.logStorageHint')"
        ></p>
      </fieldset>
      <label class="flex items-start gap-3" x-show="settings.requestDump">
        <input
          type="checkbox"
          class="mt-1"
          x-model="acknowledgeSensitiveData"
          :disabled="saving"
        />
        <span class="text-sm" x-text="t('system.acknowledge')"></span>
      </label>
      <label
        class="block"
        x-show="settings.logLevel === 'debug' || settings.requestDump || settings.memoryVerbose"
      >
        <span
          class="block text-sm font-medium mb-2"
          x-text="t('system.duration')"
        ></span>
        <input
          type="number"
          class="input w-full"
          min="1"
          max="120"
          step="1"
          x-model.number="debugMinutes"
          :disabled="saving"
        />
        <span
          class="block text-sm text-[var(--apple-text-secondary)] mt-1"
          x-text="t('system.expiryHint')"
        ></span>
      </label>
      <p
        class="text-sm"
        x-show="expiresAt"
        x-text="t('system.expiresAt') + ': ' + formatTime(expiresAt)"
      ></p>
      <div class="flex flex-wrap items-center gap-3">
        <button
          type="submit"
          class="btn btn-primary"
          :disabled="saving || loading || (settings.requestDump && !acknowledgeSensitiveData)"
          x-text="t('system.save')"
        ></button>
        <button
          type="button"
          class="btn btn-secondary"
          @click="useRecommended()"
          :disabled="saving"
          x-text="t('system.recommended')"
        ></button>
        <span
          role="status"
          class="text-sm"
          x-show="saved"
          x-text="t('system.saved')"
        ></span>
      </div>
      <p
        class="text-sm text-[var(--apple-text-secondary)]"
        x-text="t('system.boundaries')"
      ></p>
    </form>
  </template>
</div>
