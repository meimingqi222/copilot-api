// ========================================================================
// Windsurf / Copilot API Protobuf Definitions
// ========================================================================
// Source:  language_server_windows_x64.exe binary analysis
//          + live traffic captures from GetChatMessage endpoint
//          + copilot-api source code (src/services/windsurf/)
//
// Protocol: application/connect+proto  (Connect-Protocol v1)
// Wire:     5-byte frame header (1b flags + 4B big-endian length) + payload
// ========================================================================

syntax = "proto3";

package exa;

// ========================================================================
// Common Types (codeium_common_pb)
// ========================================================================

message Metadata {
  string client_name        = 1;   // "windsurf-next"
  string app_version        = 2;   // "2026.8.1009"
  string api_key_or_jwt     = 3;   // API key or devin-session-token$<jwt>
  string language           = 4;   // "en"
  string os_label           = 5;   // "windows" / "macos" / "linux" (NOT JSON)
  string ls_version         = 7;   // language server version
  string client_name_2      = 12;  // duplicate client name
  // field 8  (hardware_json) — NOT sent by real client
  // field 21 (jwt)           — NOT sent (credential goes in field 3)
  // field 30 (platform_id)   — NOT sent by real client
}

message ChatToolCall {
  string id              = 1;
  string function_name   = 2;
  string arguments_json  = 3;
}

// ========================================================================
// Chat Messages (chat_pb)
// ========================================================================

message ChatMessage {
  string message_id            = 1;  // UUID (present in real captures)
  int32  role                  = 2;  // 1=user, 2=assistant, 4=tool
  string content               = 3;
  repeated ChatToolCall tool_calls = 6;
  string tool_call_id          = 7;  // tool result correlation
  string reasoning_text        = 11; // thinking (assistant only)
}

// ========================================================================
// Request Components
// ========================================================================

enum ChatMessageRequestType {
  CHAT_MESSAGE_REQUEST_TYPE_UNSPECIFIED     = 0;
  CHAT_MESSAGE_REQUEST_TYPE_GENERAL         = 1;
  CHAT_MESSAGE_REQUEST_TYPE_CONTEXT_CHECK   = 2;
  CHAT_MESSAGE_REQUEST_TYPE_PLAN            = 3;
  CHAT_MESSAGE_REQUEST_TYPE_COMMAND         = 4;
  CHAT_MESSAGE_REQUEST_TYPE_CASCADE         = 5;
  CHAT_MESSAGE_REQUEST_TYPE_EVAL            = 6;
  CHAT_MESSAGE_REQUEST_TYPE_WINDSURF_REVIEW = 7;
  CHAT_MESSAGE_REQUEST_TYPE_VIBE_AND_REPLACE = 8;
  CHAT_MESSAGE_REQUEST_TYPE_DEEPWIKI        = 9;
}

message ToolDefinition {
  string name             = 1;
  string description      = 2;
  string parameters_json  = 3;
}

message SamplingConfig {
  int32  mode                = 1;  // 1
  int32  max_context_tokens  = 2;  // 64000
  int32  max_tokens          = 3;
  double temperature         = 5;
  // field 6 (top_p) is NOT sent by real client
  int32  top_k               = 7;  // 40
  double repetition_penalty  = 8;  // 1.0
  repeated string special_tokens = 9;
  double frequency_penalty   = 11; // 1.0
}

message TraceInfo {
  string trace_id = 1;   // UUID v4
  // field 2 is NOT sent by real client
  int32  f3       = 3;   // 4
  int32  f4       = 4;   // 14
}

// ========================================================================
// Requests
// ========================================================================

// Endpoint: POST /exa.api_server_pb.ApiServerService/GetChatMessage
message GetChatMessageRequest {
  Metadata                  metadata       = 1;
  string                    system_prompt  = 2;
  repeated ChatMessage      messages       = 3;
  int32                     mode           = 7;   // 5=native slug, 15=enum ID
  SamplingConfig            sampling       = 8;
  repeated ToolDefinition   tools          = 10;
  TraceInfo                 trace_info     = 15;
  string                    request_id     = 16;
  ChatMessageRequestType    request_type   = 20;  // default: GENERAL=1
  string                    model          = 21;
  string                    session_id     = 22;  // stable UUID for KV cache
}

// Endpoint: /exa.language_server_pb.LanguageServerService/RawGetChatMessage
message RawGetChatMessageRequest {
  Metadata                       metadata      = 1;
  repeated ChatMessagePrompt     chat_messages = 2;
}

message ChatMessagePrompt {
  ChatMessage message = 1;
}

// ========================================================================
// Response (server-streaming)
// ========================================================================

// Each frame = one RawChatMessage delta
// Parsed by: src/services/windsurf/response-parsers.ts
message RawChatMessage {
  string         content         = 3;   // text delta
  int32          status          = 5;   // 2=text_done, 10=tool_calls_done
  ChatToolCall   tool_call       = 6;   // tool call delta
  UsageMetadata  usage           = 7;   // token usage
  string         reasoning_text  = 9;   // thinking delta
  repeated Section sections      = 28;  // perf / KV-cache sections
  int32          cached_tokens   = 33;  // KV cache hits
}

message UsageMetadata {
  int32 prompt_tokens      = 1;  // input tokens
  int32 completion_tokens  = 2;  // output tokens
  int32 cached_tokens      = 3;  // KV cache hits (treated as cache_read_tokens)
  // field 6 = ? (always 4 in captures, flag/enum)
  // field 7 = upstream message id (string, e.g. "msg_01XQT3XhcxVkvWxgtvF47jY9")
  // field 8 = repeated response headers (Date, Request-Id, …)
  // field 9 = actual_model_uid (e.g. "MODEL_PRIVATE_11")
}

message Section {
  string         section_name = 1;   // e.g. "Token Usage"
  SectionValue   value        = 2;
  string         f5           = 5;   // e.g. "cached_input_tokens"
  SectionValue   value2       = 4;
}

message SectionValue {
  string label        = 1;
  float  float_value  = 2;   // wire type 5 (float32)
  string unit_single  = 3;
  string unit_plural  = 4;
}
